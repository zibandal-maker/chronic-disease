<noscript><div class="seo-content"><h2>위식도역류질환(GERD) 처방·불응성 감별·급여 병용조건 (임상의용)</h2><p>GERD(위식도역류질환·역류성 식도염)의 PPI·P-CAB 단계적 치료(성인 용량·미란성 8주/비미란성 4주·유지 반량), PPI/P-CAB로 조절 안 될 때 감별 순서(최적화→내시경+생검→임피던스-pH(AET·SAP/SI)→HRM(IRP)), 기능성 가슴쓰림·역류 과민성·분문이완불능증(achalasia)·호산구성 식도염(EoE) 감별, 경보징후, 산분비억제제 병용 급여조건(PPI+취침 H2RA 인정·P-CAB+H2RA 불인정)을 제공한다.</p><section id="type-erd"><h3>미란성 역류질환(ERD·역류성 식도염)</h3><p>내시경에서 식도점막 미란(LA-A~D)이 확인되는 GERD. LA-C/D는 GERD 확진 근거. 1차 PPI 표준용량 8주(4주 후 미치유 +4주). 중증 P-CAB 고려. 유지 반량. 생활습관 병행.</p></section><section id="type-nerd"><h3>비미란성 역류질환(NERD)</h3><p>전형 역류증상 있으나 내시경 정상. GERD의 60–70%. 일부는 실제 산노출 정상(감별 필요). 1차 PPI 표준 4주. on-demand 가능. 불응 시 §불응성 감별. 유지 반량·필요시.</p></section><section id="type-reflux_hypersensitivity"><h3>역류 과민성(reflux hypersensitivity)</h3><p>내시경·생검 정상, 산노출 정상(AET&lt;4%)이나 역류 이벤트에 증상 연관 양성(SAP/SI+). 기능성이나 역류 유발형. 산억제(PPI/P-CAB) 유지 + 저용량 TCA(아미트립틸린) 또는 SSRI. 생활·스트레스 관리.</p></section><section id="type-functional_heartburn"><h3>기능성 가슴쓰림(functional heartburn)</h3><p>내시경·생검 정상, 산노출 정상, 증상-역류 연관 음성(SAP/SI−). 산억제 반응 나쁨. ★신경조절제 중심: 저용량 TCA(아미트립틸린 취침 10 mg~) 또는 SSRI(시탈로프람·설트랄린). 인지행동·최면요법 근거. 산억제는 대개 감량·중단 고려.</p></section><section id="type-achalasia"><h3>분문이완불능증(achalasia)</h3><p>하부식도괄약근 이완장애 + 식도체부 연동소실. GERD로 오인(환자 75%가 가슴쓰림 호소). ★소화기 의뢰: POEM·공기압 확장·Heller 근절개. GERD약(PPI/P-CAB)은 무효. 치료 후 역류성 식도염 관리 필요할 수 있음.</p></section><section id="type-egjoo"><h3>식도위접합부 유출폐쇄(EGJOO)</h3><p>IRP 상승 + 식도체부 연동 정상. achalasia 전단계일 수도, 별개일 수도. 임상적 유의 시 achalasia 준해 치료 고려(소화기 의뢰). 원인질환 교정.</p></section><section id="type-eoe"><h3>호산구성 식도염(EoE)</h3><p>식도 생검 호산구 ≥15/HPF. 알레르기 기전. 연하곤란·음식걸림·PPI 불응 흉통. 식이제거·국소 스테로이드(연하형 부데소니드/플루티카손)·PPI. 협착은 확장. 소화기·알레르기 협진.</p></section><section id="type-barrett"><h3>바렛식도(Barrett esophagus)</h3><p>만성 역류로 식도 하부가 원주상피(장상피화생)로 화생. 선암 전구. PPI 유지(증상·식도염 조절). 감시내시경. 이형성은 내시경 치료(EMR/RFA) 의뢰.</p></section><section id="refr-true_refractory"><h3>진성 불응 GERD</h3><p>on-PPI AET&gt;6% 또는 LA-C/D 미란 잔존(객관적 잔여 역류). 치료: P-CAB 전환·BID 최적화·취침 H2RA(급여조건), 난치·거대열공탈장은 항역류수술 고려.</p></section><section id="refr-reflux_hypersensitivity"><h3>역류 과민성(reflux hypersensitivity)</h3><p>내시경·생검 정상, AET 정상, 증상-역류 연관 양성(SAP/SI+). 치료: 산억제(PPI/P-CAB) 유지 + 저용량 신경조절제(TCA/SSRI)로 통증역치 조절.</p></section><section id="refr-functional_heartburn"><h3>기능성 가슴쓰림(functional heartburn)</h3><p>내시경·생검 정상, AET 정상, 증상-역류 연관 음성(SAP/SI−). 치료: ★신경조절제(저용량 TCA/SSRI)가 1차 — 산억제 증량은 이득 없음(감량·중단 고려). 인지·스트레스 관리.</p></section><section id="refr-achalasia"><h3>분문이완불능증(achalasia)/식도운동질환</h3><p>HRM IRP 상승 + 연동소실/이상, TBE 바륨 정체. GERD약 무효. 치료: ★소화기 의뢰 — POEM·공기압 확장·Heller 근절개. 가성이완불능(악성) 배제.</p></section><section id="refr-egjoo"><h3>식도위접합부 유출폐쇄(EGJOO)</h3><p>HRM IRP 상승 + 정상 연동. 기계적 폐쇄·종양 배제 필요. 치료: 기계적 원인 배제 후 임상적 유의 시 achalasia 준해 치료 고려(소화기 의뢰).</p></section><section id="refr-eoe"><h3>호산구성 식도염(EoE)</h3><p>생검 호산구 ≥15/HPF. 연하곤란·음식걸림·아토피 동반. 치료: 식이제거·국소 스테로이드(연하형)·PPI. 협착은 확장. 소화기·알레르기 협진.</p></section><section id="drug-esomeprazole"><h3>에스오메프라졸 (esomeprazole)</h3><p>양성자펌프억제제(PPI) · 표준 20–40 mg 1일 1회(식전 30–60분) · 유지 20 mg 1일 1회 또는 반량</p></section><section id="drug-omeprazole"><h3>오메프라졸 (omeprazole)</h3><p>양성자펌프억제제(PPI) · 표준 20 mg 1일 1회(식전) · 유지 10–20 mg 1일 1회</p></section><section id="drug-lansoprazole"><h3>란소프라졸 (lansoprazole)</h3><p>양성자펌프억제제(PPI) · 표준 15–30 mg 1일 1회(식전) · 유지 15 mg 1일 1회</p></section><section id="drug-rabeprazole"><h3>라베프라졸 (rabeprazole)</h3><p>양성자펌프억제제(PPI) · 표준 10–20 mg 1일 1회(식전) · 유지 10 mg 1일 1회</p></section><section id="drug-pantoprazole"><h3>판토프라졸 (pantoprazole)</h3><p>양성자펌프억제제(PPI) · 표준 20–40 mg 1일 1회(식전) · 유지 20 mg 1일 1회</p></section><section id="drug-dexlansoprazole"><h3>덱스란소프라졸 (dexlansoprazole)</h3><p>양성자펌프억제제(PPI) · 표준 30–60 mg 1일 1회(식사 무관) · 유지 30 mg 1일 1회</p></section><section id="drug-ilaprazole"><h3>일라프라졸 (ilaprazole)</h3><p>양성자펌프억제제(PPI) · 표준 10 mg 1일 1회(식전) · 유지 10 mg 1일 1회</p></section><section id="drug-tegoprazan"><h3>테고프라잔(케이캡) (tegoprazan)</h3><p>칼륨경쟁적 위산분비억제제(P-CAB) · 표준 50 mg 1일 1회(중증·불충분 시 bid/100 mg) · 유지 25 mg 1일 1회(미란성 유지 급여)</p></section><section id="drug-fexuprazan"><h3>펙수프라잔(펙수클루) (fexuprazan)</h3><p>칼륨경쟁적 위산분비억제제(P-CAB) · 표준 40 mg 1일 1회 · 유지 허가·급여 확인</p></section><section id="drug-vonoprazan"><h3>보노프라잔 (vonoprazan)</h3><p>칼륨경쟁적 위산분비억제제(P-CAB) · 표준 10–20 mg 1일 1회 · 유지 10 mg</p></section><section id="drug-famotidine"><h3>파모티딘 (famotidine)</h3><p>H2 수용체 길항제(H2RA) · 표준 20 mg 1일 2회 또는 취침 20–40 mg · 유지 취침 20 mg</p></section><section id="drug-lafutidine"><h3>라푸티딘 (lafutidine)</h3><p>H2 수용체 길항제(H2RA) · 표준 10 mg 1일 2회 · 유지 취침 10 mg</p></section><section id="drug-nizatidine"><h3>니자티딘 (nizatidine)</h3><p>H2 수용체 길항제(H2RA) · 표준 150 mg 1일 2회 · 유지 취침 150 mg</p></section><section id="drug-mosapride"><h3>모사프리드 (mosapride)</h3><p>위장운동촉진제(프로키네틱) · 표준 5 mg 1일 3회(식전) · 유지 —</p></section><section id="drug-itopride"><h3>이토프리드 (itopride)</h3><p>위장운동촉진제(프로키네틱) · 표준 50 mg 1일 3회 · 유지 —</p></section><section id="drug-alginate"><h3>알긴산(가비스콘 등) (alginate)</h3><p>알기네이트·제산제 · 표준 식후·취침 필요시 · 유지 —</p></section><section id="drug-antacid"><h3>제산제(마그네슘·알루미늄 복합) (antacid)</h3><p>알기네이트·제산제 · 표준 식후·취침 필요시 · 유지 —</p></section><section id="drug-amitriptyline"><h3>아미트립틸린 (amitriptyline)</h3><p>삼환계 항우울제(신경조절) · 표준 취침 10 mg 시작, 10–25 mg(최대 50–75 mg) · 유지 저용량 유지</p></section><section id="drug-nortriptyline"><h3>노르트립틸린 (nortriptyline)</h3><p>삼환계 항우울제(신경조절) · 표준 취침 10–25 mg · 유지 저용량</p></section><section id="drug-citalopram"><h3>시탈로프람 (citalopram)</h3><p>선택적 세로토닌재흡수억제제(신경조절) · 표준 20 mg 1일 1회 · 유지 —</p></section><section id="drug-sertraline"><h3>설트랄린 (sertraline)</h3><p>선택적 세로토닌재흡수억제제(신경조절) · 표준 50 mg 1일 1회 · 유지 —</p></section><section id="alarm"><h3>경보징후·의뢰</h3><ul><li>상부위장관 악성·중대 병변 배제 — 경험적 치료 대신 내시경 우선 — 연하곤란(삼킴 걸림), 삼킬 때 통증(odynophagia), 의도치 않은 체중감소, 소화관 출혈(토혈·흑색변), 빈혈, 지속·반복 구토, 촉지 종괴, 50세 이상 신규 발생 증상</li><li>분문이완불능증(achalasia)·식도운동질환 의심 — GERD약 무효 — 고형+액체 모두 연하곤란, 미소화 음식·비산성 역류, PPI 완전 무효 + 삼킴 곤란, 흉통·체중감소 동반</li><li>호산구성 식도염(EoE) 의심 — 내시경 + 다부위 생검 필요 — 음식 걸림(impaction) 병력, 간헐 고형 연하곤란, 아토피·알레르기 동반(특히 젊은 남성)</li><li>흉통은 심장(협심증·심근경색) 먼저 배제 — 식도성으로 단정 금지 — 운동유발·방사통 동반 흉통, 호흡곤란·발한 동반, 심혈관 위험인자(고령·당뇨·흡연 등)</li></ul></section><section id="reimb"><h3>급여·병용조건</h3><ul><li>PPI·H2RA·P-CAB 중 동시 1종만 급여(공격인자억제제 계열 중복 불인정). 예외: 예외 — PPI 투여로 증상 호전이 없는 경우(야간 산분비 돌파), PPI를 유지하면서 H2RA를 취침 시 1회 병용 인정.</li><li>★P-CAB + H2RA 병용은 급여 불인정 — PPI+취침H2RA 예외는 PPI에 한함.</li><li>미란성(ERD) 8주(4주 후 미치유 시 +4주), 비미란성(NERD) 4주, 유지요법 반량.</li></ul></section><section id="pitfalls"><h3>감별·급여 함정</h3><ul><li>연하곤란·음식걸림을 GERD로 넘김: achalasia·EoE·협착·식도암을 놓친다 — 진행성·치료 시점 놓침.</li><li>기능성 가슴쓰림에 고용량·장기 PPI: 기능성 가슴쓰림은 산노출 정상·증상연관 음성 — 산억제로 낫지 않고 비용·부작용·삭감만 는다.</li><li>최적화 없이 '난치' 단정: 실패의 흔한 원인은 식전 미복용·불순응 — 최적화만으로 상당수 호전.</li><li>P-CAB + H2RA 병용(급여 불인정): ★급여 예외(취침 H2RA 병용)는 PPI에 한함 — P-CAB+H2RA 병용은 급여 불인정(삭감).</li><li>PPI+H2RA 병용 근거 미문서화: 병용 인정은 'PPI로 증상 호전 없음·야간 산분비' 소견이 진료기록에 있어야 함 — 미비 시 삭감.</li><li>비심인성 흉통에 심장 배제 생략: 협심증·심근경색을 놓치면 치명적.</li><li>미확진 GERD를 on-PPI로 pH 검사: 미확진은 off-PPI(2–4주 중단) 검사라야 AET로 GERD 여부를 확정 — on-PPI면 진단 실패.</li></ul></section><section id="kcd"><h3>KCD 상병</h3><ul><li>K21.0 식도염을 동반한 위식도역류병(미란성 ERD)</li><li>K21.9 식도염을 동반하지 않은 위식도역류병(비미란성 NERD)</li><li>K22.0 분문이완불능증(achalasia)</li><li>K22.1 식도의 궤양</li><li>K22.4 식도운동이상(dyskinesia)</li><li>K22.2 식도폐쇄·협착</li><li>K20 식도염(호산구성 식도염 EoE 등 세분류)</li><li>K22.7 바렛식도</li><li>R12 가슴쓰림(heartburn)</li></ul></section></div></noscript>

    return '<div class="note" style="padding:0 0 6px">표준·유지 용량(코딩 직전 허가·약학정보원 재검증).</div><table class="drugtbl"><thead><tr><th>성분</th><th>표준용량</th><th>유지용량</th></tr></thead><tbody>' + rows + "</tbody></table>";
  }
  function refrAlgo() {

  function referList() {
    var URG = { emergency: ["🚨 응급 배제(심장 등)", "var(--block)"], urgent: ["⏱️ 내시경·의뢰", "var(--alert)"], reeval: ["🔁 재평가", "var(--warn)"] };

      var items = Object.values(REFER).filter(function (x) { return x.urgency === u; }); if (!items.length) return;
      h += '<div class="subttl" style="color:' + URG[u][1] + '">' + esc(URG[u][0]) + "</div>";

  function buildLib() {

  function renderLib(q) {

      host.appendChild(b);
    });
  }
  el("libSearch").addEventListener("input", function (e) { renderLib(e.target.value); });

    { label: "★기능성 가슴쓰림", d: "내시경정상·AET정상·SAP음성 → 신경조절제", p: { refractory: true, optimized: { adherence: true, bid: true, switch: true, hs_h2ra: true }, endoscopy: { done: true, finding: "normal" }, ph: { done: true, aet: "normal", sap_si: "neg" }, symptoms: { heartburn: true } } },
    { label: "역류 과민성", d: "AET정상·SAP양성 → 산억제+신경조절", p: { refractory: true, optimized: { adherence: true, bid: true, switch: true, hs_h2ra: true }, endoscopy: { done: true, finding: "normal" }, ph: { done: true, aet: "normal", sap_si: "pos" }, symptoms: { heartburn: true } } },
    { label: "진성 불응 GERD", d: "on-PPI AET>6% → P-CAB 전환", p: { refractory: true, optimized: { adherence: true, bid: true, switch: true, hs_h2ra: true }, endoscopy: { done: true, finding: "normal" }, ph: { done: true, aet: "high" }, symptoms: { heartburn: true } } },
    { label: "★achalasia 감별", d: "연하곤란·HRM IRP↑ 연동소실", p: { refractory: true, optimized: { adherence: true, bid: true, switch: true, hs_h2ra: true }, endoscopy: { done: true, finding: "normal" }, hrm: { done: true, irp: "high", peristalsis: "absent" }, symptoms: { solid_liquid_dysphagia: true } } },
    { label: "불응성·최적화 미완", d: "STEP0 먼저(순응도·BID·전환)", p: { refractory: true, optimized: { adherence: true }, symptoms: { heartburn: true, nocturnal: true } } },
    { label: "P-CAB+H2RA 급여", d: "병용 불인정 경고", p: { current: "pcab", add_h2ra: true, symptoms: { nocturnal: true } } }

  function buildSim() {

  function buildSrc() { el("srcbanner").innerHTML = Object.values(GL).map(function (g) { return g.url ? '<a href="' + esc(g.url) + '" target="_blank" rel="noopener">📘 ' + esc(g.title) + (g.year ? " (" + g.year + ")" : "") + "</a>" : ""; }).filter(Boolean).join("<br>"); }

  buildFlow(); buildLib(); buildSim(); buildSrc();
