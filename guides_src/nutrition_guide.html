<noscript><div class="seo-content"><h2>중환자 영양·NPO·TPN — 칼로리·단백·수액 계산, 전해질 보충, 재급식 (임상의용)</h2><p>중환자·NPO·TPN 영양지원의 질환별 칼로리(kcal/kg)·단백(g/kg) 목표, 수액(25–40 mL/kg)·TPN 조성(포도당 3.4 kcal/g·GIR≤5, 지질 1–1.5 g/kg, 아미노산, 1일 전해질·미량원소·비타민), 전해질 보충 프로토콜(칼륨·마그네슘·인·칼슘 수치별), 재급식증후군(시작 10 또는 5 kcal/kg·티아민), 경장(EN) vs 정맥(PN) 영양 결정, 모니터링을 제공한다. ASPEN/SCCM·ESPEN·NICE·KSPEN 근거.</p><section id="target-general"><h3>일반 중환자</h3><p>에너지 25–30 kcal/kg · 단백 1.2–2 g/kg — 조기 경장영양(24–48h). 급성기 저열량(≤70%)→3일 후 점증. 혈당 &lt;180 mg/dL 관리(스트레스 고혈당). 간접열량계 가능하면 우선(예측식은 오차).</p></section><section id="target-sepsis"><h3>패혈증·급성기</h3><p>에너지 20–25 kcal/kg · 단백 1.2–2 g/kg — 초기 저열량(permissive underfeeding)·trophic feeding(10–20 kcal/h). 안정화 후 점증. 단백은 조기 확보. 혈역학 불안정·고용량 승압제 중엔 EN 신중(장허혈 위험).</p></section><section id="target-aki"><h3>급성신손상(비투석)</h3><p>에너지 25–30 kcal/kg · 단백 0.8–1 g/kg — 비이화 비투석은 단백 0.8–1.0(질소 노폐물·요독 회피). 고이화는 최대 1.7까지. 투석 시작 시 1.3–1.5로 상향. 칼륨·인·수분 제한 감시(배설 저하).</p></section><section id="target-crrt"><h3>CRRT·잦은 혈액투석</h3><p>에너지 25–30 kcal/kg · 단백 1.5–2.5 g/kg — 필터 아미노산 소실 보상 → 단백 최대 2.5 g/kg. ★CRRT는 인·수용성비타민·미량원소 소실 → 보충·저인혈증 감시. 구연산 항응고 시 이온화 칼슘 모니터(구연산이 칼슘 결합).</p></section><section id="target-hepatic"><h3>간부전·간경화</h3><p>에너지 25–35 kcal/kg · 단백 1.2–1.5 g/kg — ★단백 제한 금지 — 근감소가 뇌증을 악화. 1.2–1.5 g/kg. 뇌증엔 BCAA(분지사슬아미노산) 고려. 계산은 건체중/평소체중(복수·부종 보정).</p></section><section id="target-pancreatitis"><h3>중증 췌장염</h3><p>에너지 25–30 kcal/kg · 단백 1.2–2 g/kg — ★조기 경장영양(비위/비공장, 24–48h) — 감염·중증도↓. 표준 중합체. PN은 EN 불가·불충분 시. 금식 최소화(장벽 유지).</p></section><section id="target-burn"><h3>화상·다발성외상</h3><p>에너지 25–35 kcal/kg · 단백 1.5–2 g/kg — 초고이화·고단백 요구. 조기 EN. 미량원소(아연·셀레늄·구리) 창상 소실 보충. 간접열량계 권장(예측식 부정확).</p></section><section id="target-obese"><h3>비만 중환자(저열량·고단백)</h3><p>에너지 11–25 kcal/kg · 단백 2.0–2.5 g/kg — ★저열량 고단백. BMI 30–50 → 11–14 kcal/kg 실체중, &gt;50 → 22–25 kcal/kg 이상체중. 단백 BMI 30–40 → 2.0, ≥40 → 2.5 g/kg 이상체중. 목표 열량 상한 65–70%(지방 동원 유도).</p></section><section id="lyte-k"><h3>칼륨(K) 보충</h3><p>목표 4.0–5.0 mEq/L — 3.8–4: 20 mEq; 3.5–3.8: 40 mEq; 3.2–3.5: 60 mEq; &lt;3.2: 80 mEq + 의사 보고</p></section><section id="lyte-mg"><h3>마그네슘(Mg) 보충</h3><p>목표 2.0–2.4 mg/dL — 1.6–2: MgSO₄ 2 g; 1–1.6: MgSO₄ 4 g; &lt;1: MgSO₄ 6 g + 의사 보고</p></section><section id="lyte-p"><h3>인(P) 보충</h3><p>목표 2.7–4.6 mg/dL — 2–2.7: 15 mmol(2시간); 1.5–2: 30 mmol(4시간); &lt;1.5: 45 mmol(6시간)</p></section><section id="lyte-ca"><h3>칼슘(이온화 Ca) 보충</h3><p>목표 1.12–1.3 mmol/L(이온화) — 1.05–1.12: 글루콘산칼슘 1 g(30–60분); 0.99–1.05: 글루콘산칼슘 2 g(30–60분); 0.93–0.99: 글루콘산칼슘 3 g(60분); &lt;0.93: 글루콘산칼슘 4 g(60분) + 의사 보고</p></section><section id="route-en"><h3>경장영양(EN)</h3><p>위장관 사용 가능·혈역학 안정 · 입실 24–48시간 내 조기 시작</p></section><section id="route-pn"><h3>정맥영양(PN/TPN)</h3><p>EN 금기·불가 또는 EN으로 목표 &lt;60% · 저영양위험군 첫 7일 유보 · 고영양위험/고도영양불량 조기(ASAP) · 보충 PN은 7–10일(ESPEN 3–7일 고려)</p></section><section id="route-npo"><h3>금식(NPO) 유지관리</h3><p>시술·수술 전후·장휴식 필요 · 가능한 단기. 장기 NPO(&gt;5–7일)·영양불량은 영양지원 개시</p></section><section id="refeeding"><h3>재급식증후군</h3><p>★열량을 천천히 올리는 것이 핵심 — 급격한 탄수화물이 인슐린을 통해 저인·저K·저Mg·티아민결핍을 유발 시작 10 kcal/kg/일로 시작, 4–7일에 걸쳐 목표 도달</p></section><section id="tpn"><h3>TPN 조성</h3><p>나트륨 1–2 mEq/kg · 칼륨 1–2 mEq/kg · 칼슘 10–15 mEq · 마그네슘 8–20 mEq · 인 20–40 mmol. 염소·아세트산 산-염기 조절.</p></section><section id="concept-stress_metabolism"><h3>스트레스 대사 — 왜 급성기엔 적게 주나</h3><p>중증 질환의 급성기에는 코르티솔·카테콜아민·글루카곤·염증사이토카인이 폭증한다. 몸은 이 시기에 근육을 분해해 아미노산을 내보내고 간에서 포도당을 스스로 만들어낸다(내인성 당신생). 즉 '이미 몸이 만들어 쓰는 열량'이 있는데, 여기에 외부 영양을 목표량만큼 꽉 채우면 총 공급이 소비를 넘어 과영양(overfeeding)이 된다. 급성기(ebb/초기 flow): 이화 우세 — 내인성 포도당 생산이 인슐린으로 잘 안 꺼진다(스트레스 고혈당). ★그래서 초기엔 저열량(목표의 ≤70%)으로 시작 — 과영양은 고혈당·감염·지방간·CO₂↑(호흡부담)·자가포식(autophagy) 억제로 오히려 해롭다. 회복기(anabolic)로 넘어가면 열량을 80–100%로 점증하고 단백을 적극 공급해 근육을 재건한다. 단백질은 예외 — 이화가 심하므로 급성기부터 충분히(1.2–2.0 g/kg) 공급해 근손실을 줄인다.</p></section><section id="concept-gut_first"><h3>장을 먼저 쓰는 이유(EN 우선)</h3><p>장은 단순 소화기관이 아니라 최대의 면역기관이다. 음식이 장을 지나가면 장점막 융모가 유지되고, 장관연관림프조직(GALT)이 자극되며, 장벽의 밀착연접이 촘촘하게 유지된다. 반대로 오래 굶기면 융모가 위축되고 장벽 투과성이 커져 장내 세균·독소가 혈류로 새어 들어가는 '세균 전위'가 일어나 전신 염증·감염을 부추긴다. EN은 장점막·면역(GALT)·장벽을 유지 → 감염 합병증·재원기간 감소. 혈역학이 안정되면 24–48시간 내 조기 EN이 원칙(소량 trophic이라도). PN은 장을 못 쓸 때의 대안 — 정맥은 장 자극이 없어 위 이점을 못 준다. ★과거 '장을 쉬게' 오래 NPO+TPN 하던 관행(예: 췌장염)은 지양 — 조기 EN이 더 좋다.</p></section><section id="concept-refeeding_patho"><h3>재급식증후군 — 무슨 일이 벌어지나</h3><p>굶는 동안 몸은 지방·케톤을 태우고 인·칼륨·마그네슘 같은 세포 내 미네랄과 티아민이 서서히 고갈된다(혈중 수치는 정상처럼 보여도 총량은 비어 있다). 여기에 갑자기 탄수화물을 주면 인슐린이 치솟고, 인슐린은 포도당과 함께 인·칼륨·마그네슘을 세포 안으로 급격히 끌어들인다. 그 결과 혈중 인·칼륨·마그네슘이 뚝 떨어지고, 특히 인 고갈은 ATP·2,3-DPG 생산을 막아 심부전·호흡부전·부정맥·의식저하로 이어질 수 있다. 굶음 → 세포 내 인·K·Mg·티아민 총량 고갈(혈중은 정상 위장). ★탄수화물 재개 → 인슐린 급증 → 인·K·Mg 세포내 이동 → 급성 저인·저K·저Mg혈증. 저인혈증 → ATP·2,3-DPG↓ → 심근·호흡근 부전·용혈·부정맥(치명적). 티아민은 포도당 대사(피루브산→아세틸CoA)의 조효소 — 탄수화물 부하로 급속 소모 → Wernicke 위험. ★대응: 열량을 천천히(10, 극단 5 kcal/kg) 올리고, 탄수화물 주기 전 티아민 먼저, 인·K·Mg 예방 보충·감시.</p></section><section id="concept-electrolyte_shift"><h3>전해질 — 역할과 보충의 원리</h3><p>중환자의 저전해질은 대개 '총량 부족'과 '세포 내외 이동'이 겹친 결과다. 보충은 단순히 숫자를 맞추는 게 아니라 어느 전해질을 먼저·어떤 속도로 줄지가 중요하다. 특히 마그네슘은 다른 전해질의 '문지기'라서, 저마그네슘을 두고는 저칼륨·저칼슘이 잘 교정되지 않는다. ★마그네슘 먼저: Mg는 신장 K 배출통로(ROMK)를 억제하고 부갑상샘호르몬(PTH) 분비·작용에 필요 → 저Mg면 K가 소변으로 계속 새고 Ca도 안 오른다. 불응성 저K·저Ca는 Mg부터. 칼륨: 심근 세포막 전위 유지 — 저K·고K 모두 치명적 부정맥. 신부전·핍뇨 시 보충은 신중(고칼륨 위험). 인(P): ATP(에너지)·2,3-DPG(산소전달)·세포막의 재료 — 고갈 시 심·호흡근 약화. CRRT·재급식서 특히 잘 빠진다. 칼슘(이온화): 심근 수축·신경근 흥분·응고에 관여 — 급속 교정은 부정맥 위험, 인과 섞으면 침전. 속도 원칙: 정맥 보충은 정해진 최대속도 이내로(예: K 10 mEq/시, P 7 mmol/시) — 급속주입 자체가 위험.</p></section><section id="concept-body_weight"><h3>어떤 체중으로 계산하나(실체중·이상·보정)</h3><p>영양 목표는 'kg당' 값이라 어느 체중을 곱하느냐가 결과를 좌우한다. 지방조직은 대사가 활발하지 않아 비만 환자에게 실체중을 그대로 곱하면 과영양이 된다. 그래서 비만에서는 이상체중(IBW) 또는 보정체중(ABW·지방의 일부만 반영)을 쓴다. 정상~과체중: 실체중(actual) 사용. 비만(BMI≥30): 지방 과다 → 실체중 곱하기 금물. 열량은 저열량 규칙(실체중 11–14 또는 IBW 22–25), 단백은 이상체중 기준. 이상체중(IBW, Devine): 신장 기반 표준체중 — 지방 제외 대사체중의 근사. 보정체중(ABW=IBW+0.4×(실체중−IBW)): 지방의 대사 기여 일부를 반영해 IBW와 실체중 사이 값. 부종·복수(간부전·과부하)는 겉체중이 부풀어 있으므로 건체중/평소체중으로 보정.</p></section><section id="concept-macro_roles"><h3>탄수화물·지질·단백의 역할과 한계</h3><p>TPN은 세 가지 열량원을 섞는다. 각자 역할과 '넘으면 해로운' 상한이 다르다. 열량(탄수화물·지질)과 단백(구조·회복)을 분리해서 생각하면 조성이 쉬워진다. 포도당(3.4 kcal/g): 주 열량원이지만 산화속도에 한계 → GIR &gt;5 mg/kg/분이면 남는 포도당이 지방으로 전환(지방간)되고 CO₂가 늘어 인공호흡 이탈을 방해한다. 지질(~10 kcal/g): 열량 밀도가 높아 적은 부피로 열량·필수지방산 공급. 그러나 청소능·면역 부담으로 1–1.5 g/kg 상한, 중성지방 감시. 단백/아미노산(4 kcal/g): 열량이 아니라 '재료' — 근육·면역·상처회복. 스트레스에선 최우선 확보(열량이 부족해도 단백은 지킨다). 삼투압: 고농도 포도당·아미노산은 삼투압이 높아 말초정맥을 상하게 함 → 중심정맥(TPN) 필요. 칼슘-인 침전: 같은 수액에서 칼슘과 인이 만나면 인산칼슘으로 굳을 수 있어 조제 순서·농도를 지킨다.</p></section></div></noscript>

      fb += '<div class="dc-row"><span class="dc-k">티아민</span><span class="dc-v">' + esc(rf.thiamine) + "</span></div>";
      fb += '<div class="dc-row"><span class="dc-k">전해질</span><span class="dc-v">' + esc(rf.lyteProphylaxis) + "</span></div>";
      fb += '<div class="dc-row"><span class="dc-k">감시</span><span class="dc-v">' + esc(rf.monitor) + "</span></div></div>";
      html += card("clin", "⚠️", "재급식증후군 예방", rf.risk, fb);
    }
    // monitor
    var mb = "";
    r.monitor.forEach(function (m) { mb += '<div class="subttl">' + esc(m.ko) + "</div>" + kp(m.items); });
    html += card("care", "📋", "모니터링 체크리스트", null, mb);
    host.innerHTML = html;
  }

  /* 도서관 */
  var CAT_ORDER = ["기전", "원칙", "목표", "TPN", "전해질", "재급식", "모니터", "공식"];
  var CAT_META = { "기전": ["💡", "기전·개념(왜 그런가)"], "원칙": ["🧭", "기본 원칙·경로(EN/PN/NPO)"], "목표": ["🎯", "질환별 칼로리·단백 목표"], "TPN": ["💉", "TPN 조성·전해질·미량"], "전해질": ["🧂", "전해질 보충 프로토콜"], "재급식": ["⚠️", "재급식증후군"], "모니터": ["📋", "모니터링"], "공식": ["🧮", "체중·GIR 공식·단위"] };
  function conceptLib() {
    var h = '<div class="note" style="padding:0 0 8px">수치 뒤의 <b>이유</b>를 이해하면 응용이 쉬워집니다.</div>';
    Object.values(CONCEPTS).forEach(function (c) {
      h += '<div class="conceptblk"><div class="ct">' + esc(c.emoji + " " + c.title) + '</div><div class="cbody">' + esc(c.body) + "</div>" + kp(c.points) + "</div>";
    });
    return h;
  }
  function routeLib() {
    var h = "";
    Object.values(ROUTE).sort(function (a, b) { return b.priority - a.priority; }).forEach(function (x) {
      h += '<div class="blk"><div class="bl">' + esc(x.ko) + "</div>" + why(x.why) + "<div class=\"dose\"><b>적응</b> " + esc(x.when) + "</div><div class=\"dose\"><b>시점</b> " + esc(x.timing) + "</div>" + (x.contraindication ? '<div class="od" style="color:var(--block)">금기: ' + esc(x.contraindication) + "</div>" : "") + '<div class="od" style="color:var(--ink-faint)">' + esc(x.note) + "</div></div>";
    });
    return h;
  }
  function targetLib() {
    var h = '<div class="note" style="padding:0 0 6px">질환별 목표(kcal/kg·g/kg). 계산은 플로우.</div><table class="drugtbl"><thead><tr><th>상태</th><th>에너지</th><th>단백</th></tr></thead><tbody>';
    Object.values(TARGETS).forEach(function (t) {
      var e = t.special === "obese" ? "11–25 kcal/kg(BMI별, IBW/ABW)" : t.energy.lo + "–" + t.energy.hi + " kcal/kg";
      var p = t.special === "obese" ? "2.0–2.5 g/kg(IBW)" : t.protein.lo + "–" + t.protein.hi + " g/kg";
      h += "<tr><td><b>" + esc(t.emoji + " " + t.ko) + "</b></td><td>" + esc(e) + "</td><td>" + esc(p) + "</td></tr>";
    });
    h += "</tbody></table>";
    Object.values(TARGETS).forEach(function (t) { h += '<div class="subttl">' + esc(t.emoji + " " + t.ko) + "</div>" + why(t.mechanism) + kp(t.notes) + (t.cautions ? '<div class="od" style="color:var(--warn);padding:0 2px">주의: ' + esc(t.cautions.join(" / ")) + "</div>" : ""); });
    return h;
  }
  function tpnLib() {
    var m = TPN["nutr:tpn:macro"], el2 = TPN["nutr:tpn:electrolytes"], mi = TPN["nutr:tpn:micro"], ca = TPN["nutr:tpn:caution"];
    var mr = CONCEPTS["nutr:concept:macro_roles"];
    var h = why(mr ? mr.body : "") + '<div class="subttl">대량영양소</div>';
    m.components.forEach(function (c) { h += '<div class="blk"><div class="bl">' + esc(c.ko) + "</div><div class=\"od\">" + esc(c.detail) + "</div></div>"; });
    h += '<div class="note" style="padding:2px 0">' + esc(m.note) + "</div>";
    h += '<div class="subttl">1일 전해질</div><div class="note" style="padding:0">' + esc(el2.detail) + "<br>" + esc(el2.note) + "</div>";
    h += '<div class="subttl">미량원소·비타민</div><div class="note" style="padding:0"><b>미량:</b> ' + esc(mi.trace) + "<br><b>비타민:</b> " + esc(mi.vitamins) + "<br>" + esc(mi.note) + "</div>";
    h += '<div class="subttl">주의·모니터</div>' + kp(ca.items);
    return h;
  }
  function lyteLib() {
    var h = '<div class="note" style="padding:0 0 8px">혈청수치별 성인 보충(기관 프로토콜·재검증). 신부전 감량.</div>';
    Object.values(LYTES).forEach(function (L) {
      h += '<div class="subttl">' + esc(L.ko) + " · 목표 " + esc(L.goalText) + "</div>";
      h += why(L.mechanism);
      h += '<table class="drugtbl"><thead><tr><th>혈청</th><th>보충</th><th>비고</th></tr></thead><tbody>';
      L.bands.forEach(function (b) { h += "<tr><td>" + (b.lo === 0 ? "<" + b.hi : b.lo + "–" + b.hi) + "</td><td><b>" + esc(b.dose) + "</b><br>" + esc(b.route || "") + "</td><td>" + esc(b.note || "") + "</td></tr>"; });
      h += "</tbody></table><div class=\"od\" style=\"color:var(--warn)\">속도: " + esc(L.rate) + (L.maxConc ? " · " + esc(L.maxConc) : "") + "</div><div class=\"od\" style=\"color:var(--ink-faint)\">주의: " + esc(L.cautions.join(" / ")) + "</div>";
    });
    return h;
  }
  function refeedLib() {
    var c = REFEED["nutr:refeed:criteria"], p = REFEED["nutr:refeed:protocol"];
    var h = why(p.mechanism);
    h += '<div class="subttl">고위험 기준(' + esc(c.rule) + ")</div>";
    h += '<div class="note" style="padding:0"><b>주기준:</b> ' + c.major.map(function (m) { return esc(m.label); }).join(" · ") + "</div>";
    h += '<div class="note" style="padding:2px 0"><b>부기준:</b> ' + c.minor.map(function (m) { return esc(m.label); }).join(" · ") + "</div>";
    h += '<div class="warnbox">★' + esc(c.extreme) + "</div>";
    h += '<div class="subttl">프로토콜</div><div class="drugclass-box"><div class="dc-row"><span class="dc-k">시작</span><span class="dc-v">고위험 ' + esc(p.start_high) + " · 극단 " + esc(p.start_extreme) + "</span></div><div class=\"dc-row\"><span class=\"dc-k\">티아민</span><span class=\"dc-v\">" + esc(p.thiamine) + "</span></div><div class=\"dc-row\"><span class=\"dc-k\">전해질</span><span class=\"dc-v\">" + esc(p.lyte_prophylaxis) + "</span></div><div class=\"dc-row\"><span class=\"dc-k\">감시</span><span class=\"dc-v\">" + esc(p.monitor) + "</span></div></div><div class=\"note\">" + esc(p.note) + "</div>";
    return h;
  }
  function monitorLib() { var h = ""; Object.values(MONITOR).forEach(function (m) { h += '<div class="subttl">' + esc(m.ko) + "</div>" + kp(m.items); }); return h; }
  function formulaLib() {
    var h = ""; Object.values(FORMULA).forEach(function (f) { h += '<div class="blk"><div class="bl">' + esc(f.label) + "</div><div class=\"od\">" + esc(f.expr) + "</div></div>"; });
    h += '<div class="subttl">상수</div><div class="note" style="padding:0">포도당 3.4 · 아미노산 4 · 지질 ~10 kcal/g · GIR 상한 5 mg/kg/분 · 수액 25–40 mL/kg</div>';
    h += '<div class="warnbox">단위 주의: Mg·P는 mg/dL(국내 검사), 이온화 Ca는 mmol/L. 프로토콜 출처별 단위 확인.</div>';
    return h;
  }
  function buildLib() {
    var items = [
      { cat: "기전", title: "💡 기전·개념(왜 그런가)", kw: "기전 개념 스트레스 대사 장 재급식 전해질 체중 왜 pathophysiology", html: conceptLib() },
      { cat: "원칙", title: "🧭 기본 원칙·경로(EN/PN/NPO)", kw: "경장 정맥 NPO 조기영양 EN PN", html: routeLib() },
      { cat: "목표", title: "🎯 질환별 칼로리·단백 목표", kw: "칼로리 단백 kcal 질환 CRRT 간 비만 AKI", html: targetLib() },
      { cat: "TPN", title: "💉 TPN 조성·전해질·미량", kw: "TPN 포도당 지질 아미노산 GIR 전해질 미량 비타민", html: tpnLib() },
      { cat: "전해질", title: "🧂 전해질 보충 프로토콜(K·Mg·P·Ca)", kw: "전해질 칼륨 마그네슘 인 칼슘 보충 저칼륨 저인", html: lyteLib() },
      { cat: "재급식", title: "⚠️ 재급식증후군", kw: "재급식 refeeding 티아민 저인 시작열량", html: refeedLib() },
      { cat: "모니터", title: "📋 모니터링", kw: "모니터 전해질 혈당 중성지방 간효소", html: monitorLib() },
      { cat: "공식", title: "🧮 체중·GIR 공식·단위", kw: "공식 BMI 이상체중 보정체중 GIR 단위", html: formulaLib() }
    ];
    W._LIB = items; renderLib("");
  }
  function renderLib(q) {
    q = (q || "").toLowerCase(); var host = el("libGrid"); host.innerHTML = "";
    if (q) { var m = (W._LIB || []).filter(function (it) { return (it.title + it.kw).toLowerCase().indexOf(q) >= 0; }); if (!m.length) { host.innerHTML = '<div class="note">검색 결과 없음</div>'; return; } m.forEach(function (it) { var dd = document.createElement("details"); dd.className = "libItem"; dd.open = true; dd.innerHTML = '<summary>' + esc(it.title) + '</summary><div class="body">' + it.html + "</div>"; host.appendChild(dd); }); return; }
    CAT_ORDER.forEach(function (cat) {
      var it = (W._LIB || []).filter(function (x) { return x.cat === cat; })[0]; if (!it) return;
      var meta = CAT_META[cat];
      var b = document.createElement("button"); b.className = "librow"; b.innerHTML = meta[0] + " " + esc(meta[1]);
      b.addEventListener("click", function () { openSheet(esc(it.title), it.html); });
      host.appendChild(b);
    });
  }
  el("libSearch").addEventListener("input", function (e) { renderLib(e.target.value); });

  function buildSrc() { el("srcbanner").innerHTML = Object.values(GL).map(function (g) { return g.url ? '<a href="' + esc(g.url) + '" target="_blank" rel="noopener">📘 ' + esc(g.title) + (g.year ? " (" + g.year + ")" : "") + "</a>" : ""; }).filter(Boolean).join("<br>"); }

  buildFlow(); buildLib(); buildSrc();
})();

</script>
</body></html>
