/* ============================================================

:root{
  color-scheme:light only;
  --hf-primary:#C0392B; --hf-accent:#E74C3C; --hf-soft:#FADBD8; --hf-deep:#922B21; --hf-ink:#3A1512;

}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{color-scheme:light only;background:#FFF9F8}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;

/* 헤더 */
.hf-hd{background:linear-gradient(135deg,var(--hf-primary),var(--hf-deep));color:#fff;padding:20px 16px 16px;

.hf-search{position:sticky;top:0;z-index:50;background:var(--hf-bg);padding:10px 12px;border-bottom:1px solid var(--hf-line)}

.search-res .sr:active{background:var(--hf-soft)}

/* 배지 (COR/LOE/급여) */
.badges{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:5px}
.bdg{display:inline-flex;align-items:center;gap:3px;border-radius:20px;padding:2px 8px;font-size:11px;font-weight:700;line-height:1.6}
.bdg-cor-I{background:#FDEDEC;color:#C0392B}
.bdg-cor-IIa{background:#FEF5E7;color:#CA6F1E}
.bdg-cor-IIb{background:#FEF9E7;color:#B7950B}
.bdg-cor-III{background:#EBEDEF;color:#566573}
.loe-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.bdg-loe{background:#F4F6F7;color:#566573}
.bdg-cover{background:#E9F7EF;color:#1E8449}
.bdg-cond{background:#FEF5E7;color:#B9770E}
.bdg-noncover{background:#FDEDEC;color:#C0392B}
.bdg-ph-rEF{background:#FDEDEC;color:var(--hf-rEF)}
.bdg-ph-mrEF{background:#FEF5E7;color:var(--hf-mrEF)}
.bdg-ph-pEF{background:#E8F8F5;color:var(--hf-pEF)}

/* 상세 블록 (접힘영역) */
.drow{display:flex;gap:8px;padding:7px 0;border-top:1px solid var(--hf-line);font-size:13px}
.drow:first-child{border-top:none}
.drow .lbl{flex:0 0 76px;color:var(--hf-mut);font-weight:600;font-size:12px}
.drow .val{flex:1}
.drow .val ul{margin:2px 0;padding-left:16px}
.drow .val li{margin:2px 0}
.dose-line{display:flex;align-items:center;gap:8px;margin:4px 0}
.dose-bar{flex:1;height:8px;border-radius:5px;background:#F0E6E3;position:relative;overflow:hidden}
.dose-bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--hf-accent),var(--hf-primary));border-radius:5px}
.tag-start{font-size:11px;color:var(--hf-mut)} .tag-target{font-size:11px;color:var(--hf-primary);font-weight:700}

/* 경고박스 */
.warnbox{background:#FDEDEC;border:1.5px solid var(--hf-noncover);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:12.5px;color:#922B21}
.warnbox b{color:var(--hf-noncover)}
.infobox{background:#EBF5FB;border:1px solid #AED6F1;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:12.5px;color:#1B4F72}
.conflictbox{background:#FEF9E7;border:1.5px solid var(--hf-cond);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:12.5px;color:#7E5109}

/* 급여 게이트 트리 */
.gate{margin:6px 0}
.gate .gnode{margin-left:0}
.gate .gop{font-size:11px;font-weight:800;color:var(--hf-mut);margin:3px 0}
.gate .gleaf{display:flex;align-items:flex-start;gap:7px;padding:5px 8px;border-radius:8px;margin:3px 0;font-size:12.5px;background:#FAFAFA}
.gate .gleaf .ic{flex:0 0 auto;font-size:13px}
.gate .pass{background:#E9F7EF}
.gate .fail{background:#FDEDEC}
.gate .excl{background:#FEF9E7}
.gate .group{border-left:2px solid var(--hf-line);padding-left:9px;margin:4px 0 4px 4px}

/* 게이지 (eGFR/K) */
.gauge{margin:8px 0}
.gauge .glabel{font-size:12px;color:var(--hf-mut);display:flex;justify-content:space-between}
.gauge .gtrack{height:12px;border-radius:7px;margin-top:4px;position:relative;
  background:linear-gradient(90deg,#C0392B 0%,#E67E22 25%,#27AE60 50%,#27AE60 75%,#E67E22 100%)}
.gauge .gmark{position:absolute;top:-3px;width:3px;height:18px;background:#222;border-radius:2px;box-shadow:0 0 0 2px #fff}

/* 4-pillar 인포그래픽 */
.pillars{display:flex;gap:8px;margin:10px 0}
.pillar{flex:1;text-align:center}
.pillar .col{height:70px;border-radius:9px 9px 0 0;background:#F0E6E3;position:relative;overflow:hidden;display:flex;align-items:flex-end}
.pillar .col i{width:100%;background:linear-gradient(180deg,var(--hf-accent),var(--hf-primary));transition:height .4s}
.pillar .nm{font-size:10.5px;font-weight:700;margin-top:5px;color:var(--hf-deep)}
.pillar .em{font-size:16px}

/* 플로우/시뮬 입력 */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:11.5px;color:var(--hf-mut);font-weight:600}
.fld input,.fld select{padding:9px 10px;border:1.5px solid var(--hf-line);border-radius:9px;font-size:14px;background:#fff;min-height:40px}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--hf-accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{padding:7px 12px;border:1.5px solid var(--hf-line);border-radius:20px;background:#fff;font-size:12.5px;cursor:pointer;min-height:38px}
.chip.sel{background:var(--hf-primary);color:#fff;border-color:var(--hf-primary)}
.btn{display:inline-block;padding:11px 18px;background:var(--hf-primary);color:#fff;border:none;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;min-height:44px}
.btn:active{background:var(--hf-deep)}
.btn-ghost{background:#fff;color:var(--hf-primary);border:1.5px solid var(--hf-primary)}

/* 결과 카드 */
.result{margin-top:12px}
.ph-banner{border-radius:12px;padding:12px 14px;color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
.rec-item{background:#fff;border:1px solid var(--hf-line);border-radius:11px;padding:10px 12px;margin:7px 0}
.rec-item .rh{display:flex;align-items:center;gap:7px}
.rec-item .rh .nm{flex:1;font-weight:700;font-size:14px}
.rec-item .role{font-size:12px;color:var(--hf-mut);margin-top:3px}
.rec-cls{display:inline-block;background:var(--hf-soft);color:var(--hf-deep);font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:10px;margin-right:2px;vertical-align:middle}
.rec-alts{font-size:11px;color:var(--hf-mut);margin-top:4px;padding:4px 8px;background:#FAFAFA;border-radius:7px}

/* 치료 축 카드 */
.axis-grp-title{font-size:13px;font-weight:800;color:var(--hf-deep);margin:14px 2px 7px}
.axis-grp-title .agt-sub{font-size:11px;font-weight:500;color:var(--hf-mut)}
.axis-card{background:#fff;border:1px solid var(--hf-line);border-radius:13px;margin-bottom:8px;overflow:hidden}
.axis-head{display:flex;align-items:center;gap:10px;padding:12px 13px;cursor:pointer}
.axis-head:active{background:var(--hf-soft)}
.axis-em{font-size:20px;flex:0 0 auto}
.axis-tt{flex:1;min-width:0}
.axis-t{font-weight:800;font-size:14px;color:var(--hf-ink)}
.axis-sel{display:inline-block;background:var(--hf-soft);color:var(--hf-deep);font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;margin-left:4px;vertical-align:middle}
.axis-s{margin-top:4px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.axis-rep{font-size:12px;color:var(--hf-mut)}
.axis-chev{flex:0 0 auto;color:var(--hf-primary);font-size:15px;transition:transform .2s}
.axis-card.open .axis-chev{transform:rotate(180deg)}
.axis-body{display:none;padding:0 13px 12px;border-top:1px solid var(--hf-line)}
.axis-card.open .axis-body{display:block}
.axis-note{font-size:12px;color:var(--hf-deep);background:var(--hf-soft);border-radius:8px;padding:8px 10px;margin:10px 0 6px;line-height:1.5}
.opt-row{display:flex;align-items:flex-start;gap:8px;padding:9px 0;border-top:1px dashed var(--hf-line);cursor:pointer}
.opt-row:first-of-type{border-top:none}
.opt-row:active{background:#FAFAFA}
.opt-rank{flex:0 0 auto;font-size:10px;font-weight:700;padding:2px 7px;border-radius:9px;background:#EEE;color:#777;margin-top:1px}
.opt-rank.opt-1{background:var(--hf-primary);color:#fff}
.opt-main{flex:1;min-width:0}
.opt-nm{font-weight:700;font-size:13.5px;color:var(--hf-ink)}
.opt-badges{font-weight:400}
.opt-role{font-size:11.5px;color:var(--hf-mut);margin-top:2px;line-height:1.4}
.opt-warn{font-size:11px;color:var(--hf-noncover);margin-top:3px}
.opt-caut{font-size:11px;color:var(--hf-cond);margin-top:2px}
.opt-chev{flex:0 0 auto;color:var(--hf-primary);font-weight:700;font-size:16px}
.rec-item .reimb-line{font-size:12px;margin-top:5px}

/* 점수 계산기 */
.score-box{background:#fff;border:1px solid var(--hf-line);border-radius:12px;padding:12px;margin:8px 0}
.score-total{font-size:30px;font-weight:800;text-align:center;margin:6px 0}
.score-band{text-align:center;font-weight:700;font-size:13px;padding:5px;border-radius:8px;color:#fff}

/* 출처 */
.sources{margin-top:14px;padding:12px;background:#fff;border:1px solid var(--hf-line);border-radius:12px}
.sources h3{margin:0 0 8px;font-size:14px}
.sources a{color:var(--hf-primary);font-size:12.5px;word-break:break-all}
.sources li{margin:5px 0;font-size:12.5px}
.rct-link{font-size:12px;color:var(--hf-primary);text-decoration:none}
.disclaimer{margin-top:12px;padding:12px;background:#FBF6F5;border-radius:10px;font-size:11.5px;color:var(--hf-mut);line-height:1.5}

/* ===== Sheet (sheet_pattern_spec v1.0) ===== */
.card.sheetmode:not(.lead) .head{cursor:pointer}
.card.sheetmode:not(.lead) .head .chev{font-size:0;transform:none!important}
.card.sheetmode:not(.lead) .head .chev::after{content:"\203A";font-size:20px;font-weight:700;color:var(--hf-primary)}
.card.sheetmode:not(.lead) .body{display:none!important}

.sheet-overlay{position:fixed;inset:0;background:rgba(40,12,10,.42);opacity:0;pointer-events:none;
  transition:opacity .25s ease;z-index:200}
.sheet-overlay.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:760px;margin:0 auto;background:#fff;
  border-radius:20px 20px 0 0;z-index:201;transform:translateY(100%);
  transition:transform .28s cubic-bezier(.32,.72,0,1);
  height:85vh;max-height:85vh;display:flex;flex-direction:column;
  will-change:transform;-webkit-backface-visibility:hidden;backface-visibility:hidden;
  box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet.on{transform:translateY(0)}
.sheet-handle{flex:0 0 auto;padding:9px 0 5px;display:flex;justify-content:center;cursor:grab;touch-action:none}
.sheet-handle .bar{width:38px;height:5px;border-radius:3px;background:#E4D9D2;border:1px solid #D8CCC4}
.sheet-head{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:2px 16px 11px;border-bottom:1px solid var(--hf-line)}
.sheet-head .sback{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:1px solid #E4D9D2;
  background:#F7F2EE;font-size:24px;color:var(--hf-primary);cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;padding-bottom:3px}
.sheet-head .sback:active{background:var(--hf-soft)}
.sheet-head .emoji{font-size:20px}
.sheet-head .stitle{flex:1;font-weight:800;font-size:16.5px;color:var(--hf-ink)}
.sheet-head .sclose{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:1px solid #E4D9D2;
  background:#F7F2EE;font-size:18px;color:#6B5D55;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.sheet-body{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 26px;overscroll-behavior:contain}

/* Sheet 내부 서식 미러링 (컨테이너 스코프 CSS가 시트엔 안 먹으므로 복제) */

.sheet.theme-hf .bdg-cor-IIa{background:#FEF5E7;color:#CA6F1E}
.sheet.theme-hf .bdg-cor-IIb{background:#FEF9E7;color:#B7950B}

.sheet.theme-hf .dose-bar{flex:1;height:8px;border-radius:5px;background:#F0E6E3;position:relative;overflow:hidden}
.sheet.theme-hf .dose-bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--hf-accent),var(--hf-primary));border-radius:5px}

</style>
</head>

<script>
/* ============================================================
   심부전 처방가이드 — DATA 레이어 (data.js)
   임상지식 전부의 유일 거주지. 엔진·UI에 하드코딩 금지.
   ID: 전역공유=prefix없음(drug:/comorbid:/lab:/notice:), 질환한정=hf:prefix
   근거: KSHF 2022 + ESC 2023 focused update | 급여: HIRA 원문(2026.6 재검증)
   ============================================================ */
var HF_DATA = (function(){
"use strict";

/* ---------- 0. 메타/색 ---------- */
var META = {
  key:"hf", version:"hf-1.0",
  color:{primary:"#C0392B",accent:"#E74C3C",soft:"#FADBD8",deep:"#922B21",ink:"#3A1512",
         rEF:"#C0392B",mrEF:"#E67E22",pEF:"#16A085",
         loeA:"#27AE60",loeB:"#F39C12",loeC:"#95A5A6",
         cover:"#27AE60",cond:"#F39C12",noncover:"#C0392B"}
};

/* ---------- 1. 표현형 ---------- */
var PHENOTYPES = {
  rEF:{id:"rEF",label:"HFrEF",label_full:"박출률 감소 심부전",lvef:"≤40%",emoji:"🫀",color:"#C0392B",
       criteria:"LVEF ≤ 40%"},
  mrEF:{id:"mrEF",label:"HFmrEF",label_full:"박출률 경도감소 심부전",lvef:"41–49%",emoji:"🫀",color:"#E67E22",
        criteria:"LVEF 41–49% + 증상/징후 + (구조이상 OR NT-proBNP>125 또는 BNP>35). ★LVEF만으로 진단 금지"},
  pEF:{id:"pEF",label:"HFpEF",label_full:"박출률 보존 심부전",lvef:"≥50%",emoji:"🫀",color:"#16A085",
       criteria:"LVEF ≥ 50% + 증상/징후 + 충만압 상승/구조이상 객관적 증거(NP상승 등)"}
};

/* ---------- 2. 계열 (class:) ---------- */
var CLASSES = {
  "class:arni":{id:"class:arni",label:"ARNI",label_full:"안지오텐신수용체-네프릴리신억제제",

  "class:acei":{id:"class:acei",label:"ACE억제제",atc_prefix:"C09AA",

  "class:arb":{id:"class:arb",label:"ARB",atc_prefix:"C09CA",
    members:["drug:candesartan","drug:valsartan","drug:losartan"]},
  "class:bb_hf":{id:"class:bb_hf",label:"베타차단제(심부전)",
    members:["drug:bisoprolol","drug:carvedilol","drug:nebivolol","drug:metoprolol"],

  "class:mra_steroidal":{id:"class:mra_steroidal",label:"스테로이드성 MRA",
    members:["drug:spironolactone","drug:eplerenone"]},
  "class:mra_nonsteroidal":{id:"class:mra_nonsteroidal",label:"비스테로이드성 MRA",
    members:["drug:finerenone"],note:"급여·기전이 스테로이드성과 완전히 별개"},
  "class:sglt2i":{id:"class:sglt2i",label:"SGLT2 억제제",atc_prefix:"A10BK",
    members:["drug:dapagliflozin","drug:empagliflozin"],
    note:"통합레지스트리 약물ID 직접참조. dm/htn 가이드와 동일 ID"},
  "class:loop_diuretic":{id:"class:loop_diuretic",label:"고리이뇨제",atc_prefix:"C03CA",
    members:["drug:furosemide","drug:torsemide","drug:bumetanide"]},

<script>
/* ============================================================
   심부전 처방가이드 — ENGINE 레이어 (engine.js)
   값 복제 금지, ID 참조만. 정문 recommend(patient) 노출.
   DATA(HF_DATA)에만 의존. UI 비의존.
   ============================================================ */
var HF_ENGINE = (function(D){
"use strict";

/* COR/LOE 순위 가중치 */
var COR_RANK={"I":0,"IIa":1,"IIb":2,"III":3};
var LOE_RANK={"A":0,"B":1,"C":2};

/* ---------- 표현형 분류 ---------- */
function classifyPhenotype(p){
  // p.lvef (숫자) 필수. 보조: p.np_elevated, p.structural
  if(p==null||p.lvef==null) return null;
  var ef=Number(p.lvef);
  if(ef<=40) return "rEF";
  if(ef>=50) return "pEF";
  // 41–49 = mrEF (지침상 추가조건 필요하나, 분류 자체는 EF 기준)
  return "mrEF";
}

/* ---------- 권고 순위 정렬 ---------- */
function rankRecommendations(phenotype, ctx){
  ctx=ctx||{};
  var out=[];
  for(var i=0;i<D.RECS.length;i++){
    var r=D.RECS[i];
    if(r.ph.indexOf(phenotype)<0) continue;
    out.push(r);
  }
  out.sort(function(a,b){
    var c=(COR_RANK[a.cor]-COR_RANK[b.cor]); if(c) return c;
    var l=(LOE_RANK[a.loe]-LOE_RANK[b.loe]); if(l) return l;
    return 0;
  });
  return out;
}

/* ---------- 급여 게이트 평가 ----------
   재귀적으로 AND/OR 트리 평가. 각 leaf의 test를 patient로 검사.
   반환: {covered, tree:평가결과, missing:[불충족조건txt], notes} */
function evalReimbursement(reimbId, patient){
  var rule=D.REIMB[reimbId];
  if(!rule) return null;
  var missing=[];
  function evalNode(node){
    if(node.op){ // 그룹
      var results=node.conds.map(evalNode);
      var pass;
      if(node.op==="AND") pass=results.every(function(x){return x.pass;});
      else pass=results.some(function(x){return x.pass;});
      return {op:node.op,pass:pass,children:results};
    }
    // leaf
    var ok=evalTest(node.test,patient,node.exclusion);
    if(!ok && !node.exclusion) missing.push(node.txt);
    if(!ok && node.exclusion) missing.push("[제외조건 위반] "+node.txt);
    return {leaf:true,pass:ok,txt:node.txt,k:node.k,exclusion:!!node.exclusion};
  }
  var tree=evalNode(rule.gate);
  return {id:reimbId,covered:tree.pass,tree:tree,missing:missing,
          rule:rule,unknown:hasUnknown(patient,rule)};
}

/* 환자값 부족으로 판정 불가한지 (보수적 표시용) */
function hasUnknown(patient,rule){
  // 핵심 키들이 비어있으면 unknown 플래그
  return false; // UI에서 입력값 기반으로 처리, 엔진은 false-as-fail 기본
}

/* leaf test 평가기 — DSL 문자열을 patient 속성으로 해석 */
function evalTest(test,p,isExclusion){
  p=p||{};
  switch(test){
    // 표현형/EF
    case "lvef<=40": return num(p.lvef)!=null && p.lvef<=40;
    case "lvef>40":  return num(p.lvef)!=null && p.lvef>40;
    case "lvef<=35": return num(p.lvef)!=null && p.lvef<=35;
    // NYHA
    case "nyha in [2,3,4]": return [2,3,4].indexOf(num(p.nyha))>=0;
    case "nyha not in [2,3,4]": return !([2,3,4].indexOf(num(p.nyha))>=0);
    // 표준치료/병용
    case "std_therapy": return !!p.std_therapy;       // BB/MRA 등 표준치료 병용
    case "raasi_max_4wk": return !!p.raasi_max_4wk;
    // 증상·입원
    case "hf_symptom": return !!p.hf_symptom;
    case "hf_admission_12mo": return !!p.hf_admission_12mo;
    // 바이오마커
    case "ntprobnp>=125": return num(p.ntprobnp)!=null && p.ntprobnp>=125;
    case "bnp>=35": return num(p.bnp)!=null && p.bnp>=35;
    // 동반질환
    case "t2dm": return !!p.t2dm;
    case "ckd": return !!p.ckd;
    case "uacr>300": return num(p.uacr)!=null && p.uacr>300;
    case "25<=egfr<75": return num(p.egfr)!=null && p.egfr>=25 && p.egfr<75;
    // 부정맥/HR
    case "sinus_rhythm": return !!p.sinus_rhythm;
    case "hr>=70": return num(p.hr)!=null && p.hr>=70;
    case "bb_max_or_intol": return !!p.bb_max_or_intol;
    // 철결핍
    case "iron_deficiency": return isIronDeficient(p);
    default: return false;
  }
}
function num(x){return (x==null||x==="")?null:Number(x);}
function isIronDeficient(p){
  var f=num(p.ferritin), t=num(p.tsat);
  if(f!=null && f<100) return true;
  if(f!=null && t!=null && f>=100 && f<300 && t<20) return true;
  return false;
}

/* ---------- 정문 recommend(patient) → {drugs[],targets[],flags[]} ---------- */
function recommend(patient){
  patient=patient||{};
  var ph=classifyPhenotype(patient);
  var flags=[];
  if(!ph){ return {phenotype:null,axes:[],drugs:[],targets:[],flags:[{lv:"info",msg:"LVEF를 입력하면 표현형별 권고를 표시합니다."}],recs:[]}; }

  var recs=rankRecommendations(ph,patient);
  // 권고문에서 표현형 적용 약물 집합 + 각 약물의 COR/LOE 최상위 매핑
  var drugRec={};
  for(var i=0;i<recs.length;i++){
    var r=recs[i];
    for(var j=0;j<r.drugs.length;j++){
      var did=r.drugs[j];
      if(!drugRec[did]) drugRec[did]={cor:r.cor,loe:r.loe}; // 최상위(이미 정렬됨)
    }
  }

  // 축 단위로 묶기
  var axes=[];
  for(var a=0;a<D.AXES.length;a++){
    var ax=D.AXES[a];
    if(ax.ph.indexOf(ph)<0) continue;
    // 이 축의 계열들에서 권고된 약물 수집(우선순위 순서)
    var members=[];
    for(var c=0;c<ax.classes.length;c++){
      var clsId=ax.classes[c];
      var clsObj=D.CLASSES[clsId]; if(!clsObj) continue;
      var clsMembers=clsObj.members||[];
      for(var m=0;m<clsMembers.length;m++){
        var did2=clsMembers[m];
        if(!drugRec[did2]) continue; // 이 표현형에 권고 안 된 약 제외
        var dd=D.DRUGS[did2]; if(!dd) continue;
        var mem={id:did2,label:dd.label_ko,cls:clsId,clsLabel:clsObj.label,
                 cor:drugRec[did2].cor,loe:drugRec[did2].loe,role:dd.role,
                 reimb:null,ci_hit:[],caution:[]};
        if(dd.reimb){
          var ev=evalReimbursement(dd.reimb,patient);
          if(ev) mem.reimb={covered:ev.covered,missing:ev.missing,id:dd.reimb,conflict:ev.rule.conflict};
        }
        checkSafety(dd,patient,mem);
        members.push(mem);
      }
    }
    if(!members.length) continue; // 권고 약물 없으면 축 생략
    var primary=members[0];
    axes.push({
      id:ax.id,emoji:ax.emoji,title:ax.title,sub:ax.sub,select:ax.select,
      pillar:!!ax.pillar,note:ax.note,mutex_note:ax.mutex_note||null,
      cor:primary.cor,loe:primary.loe,
      primary:primary,members:members,count:members.length
    });
  }

  // 평면 drugs[](하위호환): 각 축의 대표만
  var drugs=axes.map(function(ax){
    var p=ax.primary;
    return {id:p.id,label:p.label,cls:p.cls,cor:p.cor,loe:p.loe,role:p.role,
            reimb:p.reimb,ci_hit:p.ci_hit,caution:p.caution,
            alts:ax.members.slice(1).map(function(m){return m.label;})};
  });

  // 표적(목표)
  var targets=[];
  if(ph==="rEF"){
    targets.push({k:"GDMT",txt:"4 pillar(RAS차단·BB·MRA·SGLT2i) 조기 병용·목표용량 적정"});
    targets.push({k:"euvolemia",txt:"이뇨제로 울혈 조절(증상)"});
  } else if(ph==="mrEF"){
    targets.push({k:"SGLT2i",txt:"SGLT2i 기둥치료(I-A)"});
    targets.push({k:"comorbid",txt:"동반질환·울혈 관리"});
  } else {
    targets.push({k:"SGLT2i",txt:"SGLT2i(I-A) + 원인·동반질환 적극관리"});
    targets.push({k:"bp",txt:"BP<130/80, AF·DM·비만·OSA 관리"});
  }

  buildFlags(patient,ph,flags);

  return {phenotype:ph,phenotypeInfo:D.PHENOTYPES[ph],axes:axes,drugs:drugs,targets:targets,flags:flags,recs:recs};
}

function checkSafety(dd,p,item){
  var egfr=num(p.egfr), k=num(p.potassium);
  // MRA: K+>5.0 또는 eGFR<30
  if(dd.cls==="class:mra_steroidal"){
    if(k!=null && k>5.0) item.ci_hit.push("K+>5.0 (MRA 개시 금기)");
    if(egfr!=null && egfr<30) item.ci_hit.push("eGFR<30 (MRA 금기)");
    else if(egfr!=null && egfr<50) item.caution.push("eGFR 30–50: 감량·신중");
  }
  // SGLT2i: eGFR<20 개시주의
  if(dd.cls==="class:sglt2i"){
    if(egfr!=null && egfr<20) item.caution.push("eGFR<20: 개시 주의");
  }
  // ACEI/ARB/ARNI: K+>5.5 주의
  if(dd.cls==="class:acei"||dd.cls==="class:arb"||dd.cls==="class:arni"){
    if(k!=null && k>5.5) item.caution.push("K+>5.5: RAS차단 주의");
    if(egfr!=null && egfr<30) item.caution.push("eGFR<30: 신중·감량");
  }
  // finerenone
  if(dd.id==="drug:finerenone"){
    if(k!=null && k>5.0) item.ci_hit.push("K+>5.0 (개시 금기)");
    if(egfr!=null && egfr<25) item.ci_hit.push("eGFR<25 (개시 금기)");
  }
}

function buildFlags(p,ph,flags){
  var egfr=num(p.egfr), k=num(p.potassium), hr=num(p.hr);
  // finerenone 급여 함정
  if(p.t2dm && (ph==="mrEF"||ph==="pEF")){
    flags.push({lv:"warn",msg:"⚠️ finerenone: 심부전(NYHA II-IV)이면 DKD 급여경로에서도 제외 → 급여 불가(삭감 고위험)"});
  }
  // 고칼륨혈증
  if(k!=null && k>5.0){
    flags.push({lv:"warn",msg:"🧂 K+ "+k+": MRA/RAASi 주의. K-binder로 RAASi 유지 고려(중단보다 우선)"});
  }
  // eGFR
  if(egfr!=null && egfr<20){
    flags.push({lv:"warn",msg:"🫘 eGFR<20: SGLT2i 개시 주의, MRA 금기, RAS차단 신중"});
  } else if(egfr!=null && egfr<30){
    flags.push({lv:"info",msg:"🫘 eGFR<30: MRA 금기, ACEI/ARB/ARNI 감량·신중"});
  }
  // 철결핍
  if(isIronDeficient(p)){
    flags.push({lv:"info",msg:"🩸 철결핍 충족: IV 철분(ferric carboxymaltose) 권고 대상(I-A)"});
  }
  // 빈맥+동율동
  if(ph==="rEF" && p.sinus_rhythm && hr!=null && hr>=70){
    flags.push({lv:"info",msg:"⚡ 동율동 HR≥70: BB 최대내약 후에도 빈맥시 이바브라딘 추가 고려(IIa)"});
  }
  // ARNI BNP 주의
  flags.push({lv:"info",msg:"🧪 ARNI 사용시 BNP는 상승(neprilysin 억제)—NT-proBNP로 추적 권장"});
}

/* ---------- 점수 계산기 ---------- */
function scoreH2FPEF(sel){ // sel: {heavy,htn,af,ph,elder,filling} bool
  var items=D.SCORES.h2fpef.items, total=0, detail=[];
  for(var i=0;i<items.length;i++){
    var it=items[i], on=!!sel[it.k];
    if(on) total+=it.pts;
    detail.push({k:it.k,label:it.label,pts:it.pts,on:on});
  }
  return {total:total,detail:detail,band:bandOf(D.SCORES.h2fpef.cutoff,total)};
}
function scoreHFAPEFF(vals){ // vals: {func:0/1/2, morph:0/1/2, biom:0/1/2}
  var total=(num(vals.func)||0)+(num(vals.morph)||0)+(num(vals.biom)||0);
  return {total:total,band:bandOf(D.SCORES.hfapeff.cutoff,total)};
}
function bandOf(cutoffs,total){
  for(var i=0;i<cutoffs.length;i++){ if(total>=cutoffs[i].min) return cutoffs[i]; }
  return cutoffs[cutoffs.length-1];
}

/* eGFR(CKD-EPI 2021) 보조 계산 */
function egfrCKDEPI(scr,age,female){
  scr=Number(scr);age=Number(age);
  if(!scr||!age) return null;
  var k=female?0.7:0.9, a=female?-0.241:-0.302;
  var min=Math.min(scr/k,1), max=Math.max(scr/k,1);
  var e=142*Math.pow(min,a)*Math.pow(max,-1.200)*Math.pow(0.9938,age)*(female?1.012:1);
  return Math.round(e*10)/10;
}

return {classifyPhenotype:classifyPhenotype,rankRecommendations:rankRecommendations,

    (rule.stop?'<div style="font-size:12px;color:var(--hf-noncover);margin-top:4px">⛔ 중단: '+esc(rule.stop)+'</div>':'')+
    (rule.changed?'<div class="infobox" style="margin-top:6px">📌 '+esc(rule.changed)+'</div>':'')+
    (rule.conflict?'<div class="conflictbox">⚠️ 가이드라인-급여 괴리: '+esc(rule.conflict)+'</div>':'')+
    '</div></div>';
  return h;
}

/* 급여 블록 (rule 직접 — 급여 카드용) */
function gateBlockHTML(rule){
  if(!rule) return '';
  return '<div class="drow"><span class="lbl">💰 급여</span><div class="val">'+
    '<span style="font-size:12px;color:var(--hf-mut)">'+esc(rule.notice)+'</span>'+
    gateTreeHTML(rule.gate)+
    (rule.stop?'<div style="font-size:12px;color:var(--hf-noncover);margin-top:4px">⛔ 중단: '+esc(rule.stop)+'</div>':'')+
    (rule.changed?'<div class="infobox" style="margin-top:6px">📌 '+esc(rule.changed)+'</div>':'')+
    (rule.conflict?'<div class="conflictbox">⚠️ 가이드라인-급여 괴리: '+esc(rule.conflict)+'</div>':'')+
    '</div></div>';
}

/* 급여 게이트 트리 (정적 렌더 — 조건 구조 표시) */
function gateTreeHTML(node,depth){
  depth=depth||0;
  if(node.op){
    var opl=node.op==="AND"?"모두 충족(AND)":"하나 충족(OR)";
    var inner=node.conds.map(function(c){return gateTreeHTML(c,depth+1);}).join('');
    return '<div class="'+(depth>0?'group':'')+'"><div class="gop">'+opl+'</div>'+inner+'</div>';
  }
  var ic=node.exclusion?'🚫':'•';
  return '<div class="gleaf'+(node.exclusion?' excl':'')+'"><span class="ic">'+ic+'</span><span>'+esc(node.txt)+'</span></div>';
}

/* 평가된 게이트 트리 (환자값 반영 — 플로우/시뮬용) */
function gateEvalHTML(tree){
  if(tree.op){
    var opl=tree.op==="AND"?"모두 충족(AND)":"하나 충족(OR)";
    var inner=tree.children.map(gateEvalHTML).join('');
    return '<div class="group"><div class="gop">'+opl+' '+(tree.pass?'✅':'❌')+'</div>'+inner+'</div>';
  }
  var cls=tree.exclusion?(tree.pass?'pass':'excl'):(tree.pass?'pass':'fail');
  var ic=tree.pass?'✅':(tree.exclusion?'🚫':'❌');
  return '<div class="gleaf '+cls+'"><span class="ic">'+ic+'</span><span>'+esc(tree.txt)+'</span></div>';
}

/* ================= Sheet 제어 ================= */
var Sheet=(function(){
  var ov,sh,sb,se,st,sbk,_stack=[];
  function els(){ov=$("#sheetOverlay");sh=$("#sheet");sb=$("#sheetBody");se=$("#sheetEmoji");st=$("#sheetTitle");sbk=$("#sheetBack");}
  function lockBody(){
    document.documentElement.style.overflow="hidden";
    document.body.style.overflow="hidden";
  }
  function unlockBody(){
    document.documentElement.style.overflow="";
    document.body.style.overflow="";
  }
  /* 현재 프레임을 화면에 그림(애니메이션 없이 내용만 교체) */
  function paint(o){
    se.textContent=o.emoji||"";st.innerHTML=o.title||"";sb.innerHTML=o.html||"";sb.scrollTop=0;
    if(sbk) sbk.style.display=_stack.length>1?"flex":"none";
    if(typeof o.rebind==="function")o.rebind(sb);
  }
  /* 새 시트 열기(스택 초기화) */
  function open(o){if(!sh)els();
    _stack=[o];
    sh.className="sheet theme-hf";
    sh.style.position="fixed";sh.style.left="0";sh.style.right="0";sh.style.bottom="0";
    sh.style.zIndex="2147483000";
    ov.style.position="fixed";ov.style.left="0";ov.style.top="0";ov.style.right="0";ov.style.bottom="0";
    ov.style.zIndex="2147482999";
    paint(o);
    sh.style.transition="none";sh.style.transform="translateY(100%)";
    lockBody();ov.classList.add("on");
    void sh.offsetHeight;
    sh.style.transition="";sh.style.transform="";
    sh.classList.add("on");
  }
  /* 하위 화면으로 진입(스택 push, 뒤로가기 가능) */
  function push(o){if(!sh||!sh.classList.contains("on")){open(o);return;}
    /* 현재 프레임의 실제 DOM 상태(선택된 축·약목록 등)를 보존 */
    if(_stack.length){var cur=_stack[_stack.length-1];cur.html=sb.innerHTML;}
    _stack.push(o);
    sb.style.opacity="0";
    setTimeout(function(){paint(o);sb.style.transition="opacity .18s";sb.style.opacity="1";
      setTimeout(function(){sb.style.transition="";},200);},60);
  }
  /* 상위 화면으로 복귀 */
  function back(){if(_stack.length<=1)return;
    _stack.pop();
    var prev=_stack[_stack.length-1];
    sb.style.opacity="0";
    setTimeout(function(){paint(prev);sb.style.transition="opacity .18s";sb.style.opacity="1";
      setTimeout(function(){sb.style.transition="";},200);},60);
  }
  function close(){if(!sh)els();sh.classList.remove("on");ov.classList.remove("on");unlockBody();_stack=[];}
  function init(){els();
    ov.addEventListener("click",close);
    $("#sheetClose").addEventListener("click",close);
    if(sbk) sbk.addEventListener("click",back);
    var h=$("#sheetHandle"),sy=0,cy=0,drag=false;
    function d(y){sy=y;cy=y;drag=true;sh.style.transition="none";}
    function m(y){if(!drag)return;cy=y;var dy=cy-sy;if(dy>0)sh.style.transform="translateY("+dy+"px)";}
    function u(){if(!drag)return;drag=false;sh.style.transition="";var dy=cy-sy;sh.style.transform="";if(dy>90)close();}
    h.addEventListener("touchstart",function(e){d(e.touches[0].clientY);},{passive:true});
    h.addEventListener("touchmove",function(e){m(e.touches[0].clientY);},{passive:true});
    h.addEventListener("touchend",u);
    h.addEventListener("mousedown",function(e){d(e.clientY);e.preventDefault();});
    document.addEventListener("mousemove",function(e){if(drag)m(e.clientY);});
    document.addEventListener("mouseup",u);
  }
  return {open:open,push:push,back:back,close:close,init:init};
})();

function resultHTML(res,patient){
  if(!res.phenotype){
    return '<div class="infobox">'+esc(res.flags[0].msg)+'</div>';
  }
  var info=res.phenotypeInfo;
  var h='<div class="ph-banner" style="background:'+info.color+'">'+info.emoji+' '+esc(info.label)+' · '+esc(info.label_full)+' (LVEF '+esc(info.lvef)+')</div>';

  // 플래그
  res.flags.forEach(function(f){
    var cls=f.lv==='warn'?'warnbox':(f.lv==='info'?'infobox':'infobox');
    h+='<div class="'+cls+'">'+esc(f.msg)+'</div>';
  });

  // 표적
  h+='<div style="font-size:12.5px;font-weight:800;color:var(--hf-deep);margin:10px 2px 4px">🎯 치료 표적</div>';
  res.targets.forEach(function(t){h+='<div class="rec-item"><b>'+esc(t.k)+'</b> · '+esc(t.txt)+'</div>';});

  // 치료 축 (대분류 → 클릭하면 약 펼침)
  var pillars=res.axes.filter(function(a){return a.pillar;});
  var adjuncts=res.axes.filter(function(a){return !a.pillar;});

  if(pillars.length){
    h+='<div class="axis-grp-title">🏛️ GDMT 기둥 <span class="agt-sub">각 축에서 1제 선택 · 조기 병용</span></div>';
    pillars.forEach(function(ax){h+=axisCardHTML(ax);});
  }
  if(adjuncts.length){
    h+='<div class="axis-grp-title">➕ 부가 치료 <span class="agt-sub">증상·상황별 선택</span></div>';
    adjuncts.forEach(function(ax){h+=axisCardHTML(ax);});
  }
  h+='<div class="disclaimer">⚕️ 본 도구는 전문가용 의사결정 <b>조언자</b>이며 처방을 강제하지 않습니다. 같은 축 안의 약은 원칙적으로 택일하며, 모든 급여 판정은 입력값 기반 참고이니 실제 청구 전 HIRA 원문·환자 개별상황을 확인하세요.</div>';
  return h;
}

/* 치료 축 카드 (헤더=대분류, 펼치면 약 목록) */
function axisCardHTML(ax){
  var p=ax.primary;
  var selBadge = ax.select==="one"?'<span class="axis-sel">택일</span>':(ax.select==="choice"?'<span class="axis-sel">상황별</span>':'');
  // 헤더: 대분류명 + 대표약 + COR/LOE + 옵션 수
  var head='<div class="axis-head"><span class="axis-em">'+esc(ax.emoji)+'</span>'+
    '<div class="axis-tt"><div class="axis-t">'+esc(ax.title)+' '+selBadge+'</div>'+
    '<div class="axis-s">'+UI.corBadge(p.cor)+UI.loeBadge(p.loe)+' <span class="axis-rep">'+esc(p.label)+(ax.count>1?' 외 '+(ax.count-1)+'제':'')+'</span></div></div>'+
    '<span class="axis-chev">▾</span></div>';
  // 본문(펼침): 약 목록 + note + mutex
  var body='<div class="axis-body">';
  if(ax.note) body+='<div class="axis-note">'+esc(ax.note)+'</div>';
  if(ax.mutex_note) body+='<div class="kbox kbox-amber" style="margin:6px 0"><b>⚠️ 기능 중복</b><div>'+esc(ax.mutex_note)+'</div></div>';
  ax.members.forEach(function(m,idx){
    var tag = idx===0?'<span class="opt-rank opt-1">1차</span>':'<span class="opt-rank">대안</span>';
    var rb='';
    if(m.reimb){
      rb=' '+UI.reimbBadge(m.reimb.covered);
    }
    var safety='';
    if(m.ci_hit&&m.ci_hit.length) safety+='<div class="opt-warn">🚫 '+m.ci_hit.map(esc).join(', ')+'</div>';
    if(m.caution&&m.caution.length) safety+='<div class="opt-caut">⚠ '+m.caution.map(esc).join(', ')+'</div>';
    body+='<div class="opt-row" data-sheet-drug="'+esc(m.id)+'">'+tag+
      '<div class="opt-main"><div class="opt-nm">'+esc(m.label)+rb+
      ' <span class="opt-badges">'+UI.corBadge(m.cor)+UI.loeBadge(m.loe)+'</span></div>'+
      '<div class="opt-role">'+esc(m.role)+'</div>'+safety+
      (m.reimb&&m.reimb.conflict?'<div class="conflictbox" style="margin-top:3px;font-size:11.5px">⚠️ '+esc(m.reimb.conflict)+'</div>':'')+
      '</div><span class="opt-chev">›</span></div>';
  });
  body+='</div>';
  return '<div class="axis-card" data-axis="'+esc(ax.id)+'">'+head+body+'</div>';
}

/* ============ 검색 ============ */
function buildSearchIndex(){
  var idx=[];
  Object.keys(D.DRUGS).forEach(function(id){var d=D.DRUGS[id];
    idx.push({type:'약물',id:id,title:d.label_ko,
      kw:(d.label_ko+' '+d.label_en+' '+(d.brand||'')+' '+(d.role||'')+' '+(d.cls||'')).toLowerCase(),
      desc:d.label_en+(d.brand?' · '+d.brand:'')+' · '+(D.CLASSES[d.cls]?D.CLASSES[d.cls].label:''),
      drug:id});
  });
  Object.keys(D.REIMB).forEach(function(id){var r=D.REIMB[id];
    idx.push({type:'급여',id:id,title:r.title,kw:(r.title+' '+r.summary+' '+r.notice).toLowerCase(),desc:r.summary,reimb:id});
  });
  Object.keys(D.ALGOS).forEach(function(id){var a=D.ALGOS[id];
    idx.push({type:'동반질환',id:id,title:a.title,kw:(a.title+' '+a.rules.join(' ')).toLowerCase(),desc:a.rules[0]||'',algo:id});
  });
  Object.keys(D.LABS).forEach(function(id){var l=D.LABS[id];
    idx.push({type:'검사',id:id,title:l.key,kw:(l.key+' '+l.label+' '+(l.note||'')).toLowerCase(),desc:l.label});
  });
  D.RECS.forEach(function(r){
    idx.push({type:'권고',id:r.id,title:r.txt,kw:(r.txt+' '+r.cor+' '+r.loe).toLowerCase(),desc:'COR '+r.cor+' · LOE '+r.loe});
  });
  return idx;
}
var SEARCH_IDX=null;
function doSearch(q){
  if(!SEARCH_IDX) SEARCH_IDX=buildSearchIndex();
  q=q.trim().toLowerCase();
  var box=$('#searchRes');
  if(!q){box.innerHTML='';return;}
  var hits=SEARCH_IDX.filter(function(it){return it.kw.indexOf(q)>=0;}).slice(0,20);
  if(!hits.length){box.innerHTML='<div class="search-empty">검색 결과 없음</div>';return;}
  box.innerHTML=hits.map(function(it){
    return '<div class="sr" data-open="'+esc(it.drug||it.reimb||it.algo||'')+'" data-type="'+it.type+'">'+
      '<div class="t">['+it.type+'] '+esc(it.title)+'</div><div class="d">'+esc(it.desc)+'</div></div>';
  }).join('');
}
function bindSearch(){
  var inp=$('#searchInput'); if(!inp)return;
  inp.addEventListener('input',function(){doSearch(this.value);});
  $('#searchRes').addEventListener('click',function(e){
    var sr=e.target.closest('.sr'); if(!sr)return;
    var id=sr.getAttribute('data-open');
    var dd=D.DRUGS[id];
    if(dd){ // 약물 시트 열기
      var tmp=document.createElement('div'); tmp.innerHTML=UI.drugCardHTML(dd);
      var bd=tmp.querySelector('.body');
      UI.Sheet.open({emoji:dd.emoji,title:esc(dd.label_ko)+' <small style="font-weight:500;font-size:12px;color:var(--hf-mut)">'+esc(dd.label_en)+'</small>',
        html:bd.innerHTML,rebind:function(){}});
    }
  });
}

  <p><b>계열</b>: 스테로이드성 MRA (class:mra_steroidal) · 성분 ID <code>drug:eplerenone</code></p>
  <p><b>권고등급</b>: 권고등급 I (권장) / 근거수준 A (다수 RCT)</p>
  <p><b>적용 표현형</b>: HFrEF</p>
  <p><b>역할</b>: HFrEF 기둥(선택적 MRA). EMPHASIS 근거. 내분비 부작용 적음</p>
  <p><b>용법</b>: 시작 25mg qd / 목표 50mg qd / 적정 4주 후 증량</p>
  <p><b>신기능</b>: eGFR 30–50 감량, &lt;30 금기</p>
  <p><b>금기</b>: K+ &gt; 5.0 / eGFR &lt; 30 / 강한 CYP3A4 억제제 병용</p>
  <p><b>주의</b>: 고칼륨혈증 / 신기능악화</p>
  <p><b>모니터링</b>: K+ / eGFR/Cr</p>
  <p><b>이상반응</b>: 고칼륨혈증 / 어지럼</p>
  <p><b>심부전 노트</b>: spironolactone 여성형유방 시 대안(선택적이라 내분비 부작용 적음)</p>
  <p><b>주요 RCT(PMID)</b>: 21678313</p>

</section>
<section id="drug-finerenone" class="seo-drug">
  <h3>💊 피네레논 · Finerenone (케렌디아)</h3>
  <p><b>계열</b>: 비스테로이드성 MRA (class:mra_nonsteroidal) · 성분 ID <code>drug:finerenone</code></p>
  <p><b>권고등급</b>: IIa (합리적) / B (단일 RCT/관찰)</p>
  <p><b>적용 표현형</b>: HFmrEF · HFpEF</p>
  <p><b>역할</b>: HFmrEF/HFpEF(FINEARTS-HF, 2024). 당뇨성 CKD 신·심 보호. ★HF 단독 비급여</p>
  <p><b>용법</b>: 시작 eGFR≥60: 20mg qd / eGFR 25–&lt;60: 10mg qd / 목표 eGFR ≥60: 40 mg / 25–&lt;60: 20 mg (최대 40 mg) (심부전 허가 용량) · 심부전 급여기준 없음(비급여)</p>
  <p><b>신기능</b>: eGFR 25–&lt;60: 10mg, ≥60: 20mg. &lt;15 중단</p>
  <p><b>금기</b>: K+ &gt; 5.0(개시) / eGFR &lt; 25(개시) / 애디슨병 / 강한 CYP3A4 억제제(이트라코나졸 등) / 자몽주스</p>
  <p><b>주의</b>: 고칼륨혈증(스테로이드성 MRA보다는 낮음) / eGFR&lt;15 중단</p>
  <p><b>모니터링</b>: K+(개시 4주·정기) / eGFR</p>
  <p><b>이상반응</b>: 고칼륨혈증 / 저혈압 / 저나트륨혈증</p>
  <p><b>심부전 노트</b>: ★★심부전(NYHA II-IV)은 DKD 급여경로에서도 제외 → HF 환자는 어느 경로로도 급여 불가. 삭감 고위험</p>
  <p><b>급여 최신(2026.7)</b>: 적응증·급여 최신(2026.7): <b>2025.10 LVEF≥40% 만성심부전(HFmrEF/HFpEF) 적응증 국내 승인</b>(FINEARTS-HF 3상, 미국 이어 세계 2번째). 단 <b>급여는 여전히 DKD(2형당뇨+CKD) 경로만 등재</b> — HF 단독 적응 급여는 미등재(적응증 승인과 급여 등재 시차). 가이드라인·적응증 vs 급여 상충 사례.</p>
  <p><b>주요 RCT(PMID)</b>: 39520455</p>
  <p><a href="#lib">심부전 처방가이드 상세 →</a></p>
</section>
<section id="drug-dapagliflozin" class="seo-drug">
  <h3>💊 다파글리플로진 · Dapagliflozin (포시가 등(제네릭))</h3>
  <p><b>계열</b>: SGLT2 억제제 (class:sglt2i) · 성분 ID <code>drug:dapagliflozin</code></p>
  <p><b>권고등급</b>: 권고등급 I (권장) / 근거수준 A (다수 RCT)</p>
  <p><b>적용 표현형</b>: HFrEF · HFmrEF · HFpEF</p>
  <p><b>역할</b>: 全 표현형 1차 기둥(ESC 2023). 신·심 보호</p>
  <p><b>용법</b>: 시작 10mg qd / 목표 10mg qd(고정) / 적정 적정 불필요(고정용량)</p>
  <p><b>신기능</b>: eGFR 25–75 적응(DAPA-CKD). HF는 eGFR≥20 권고</p>
  <p><b>금기</b>: 1형 당뇨 / DKA 병력 반복 / eGFR&lt;20(개시 주의)</p>
  <p><b>주의</b>: 초기 2주 eGFR 일시 저하(정상) / 생식기 감염 / 당뇨 환자 euglycemic DKA / 혈량저하시 주의</p>
  <p><b>모니터링</b>: eGFR(baseline·1–2주·정기) / 생식기 감염 증상 / 혈당(당뇨시)</p>
  <p><b>이상반응</b>: 생식기 진균감염 / 요로감염 / 혈량저하 / 드물게 euglycemic DKA</p>
  <p><b>심부전 노트</b>: 비당뇨 심부전도 효과. 2025.2 LVEF&gt;40 급여확대</p>
  <p><b>급여</b>: <b>다파/엠파글리플로진 만성심부전 급여기준</b> · 고시: 다파 고시 제2025-102호(2025-07-01) · 엠파 고시 제2026-159호(2026-08-01) — HF 적응증 보유 품목 한정(포시가 취하) · 증상·징후 + (LVEF≤40 OR LVEF&gt;40+NP상승 OR 12개월내 악화입원). 비당뇨 포함</p>
  <p><b>주요 RCT(PMID)</b>: 31535829, 36114137</p>
  <p><a href="#lib">심부전 처방가이드 상세 →</a></p>
</section>

<section id="drug-ivabradine" class="seo-drug">
  <h3>💊 이바브라딘 · Ivabradine (프로코라란)</h3>
  <p><b>계열</b>: If 채널억제제 (class:if_inhibitor) · 성분 ID <code>drug:ivabradine</code></p>
  <p><b>권고등급</b>: IIa (합리적) / B (단일 RCT/관찰)</p>
  <p><b>적용 표현형</b>: HFrEF</p>
  <p><b>역할</b>: 동율동 HR≥70bpm, BB 최대내약 후에도 빈맥. 순수 HR 감소(SHIFT)</p>
  <p><b>용법</b>: 시작 5mg bid (고령 2.5mg bid) / 목표 7.5mg bid / 적정 2주 후 안정시 HR 보며 조절(목표 50–60)</p>

  <p><b>금기</b>: 심방세동(동율동에서만 작용) / 안정시 HR&lt;70 / 급성 비대상성 HF / 중증 간장애 / 페이스메이커 의존</p>

  <p><b>이상반응</b>: 서맥 / 광시증(시야 번쩍임) / 혈압변동 / 심방세동</p>
  <p><b>심부전 노트</b>: 반드시 동율동에서만. AF면 효과 없음. BB 최대내약 용량 우선</p>
  <p><b>급여</b>: <b>이바브라딘(프로코라란) 급여기준</b> · 고시: HIRA 약제기준 · 동리듬 + HR≥75 + LVEF≤35% NYHA II–IV + (BB 금기·불내성 또는 표준치료 4주 후 병용) · LVEF 35–40% 선별급여(본인부담 50%) — 고시 제2023-23호(2023-02-01)</p>
  <p><b>주요 RCT(PMID)</b>: 21108219</p>

<section id="drug-furosemide" class="seo-drug">
  <h3>💧 푸로세미드 · Furosemide (라식스 등)</h3>
  <p><b>계열</b>: 고리이뇨제 (class:loop_diuretic) · 성분 ID <code>drug:furosemide</code></p>
  <p><b>권고등급</b>: 권고등급 I (권장) / C (전문가 의견)</p>
  <p><b>적용 표현형</b>: HFrEF · HFmrEF · HFpEF</p>
  <p><b>역할</b>: 울혈·체액저류 증상완화(全 표현형). ★예후개선 아닌 증상조절</p>
  <p><b>용법</b>: 시작 20–40mg qd / 목표 euvolemia 도달 최소용량 / 적정 체중·울혈 보며 적정</p>
  <p><b>신기능</b>: 신기능 저하시 증량 필요(eGFR&lt;30 고용량)</p>
  <p><b>금기</b>: 무뇨 / 과민반응</p>
  <p><b>주의</b>: 전해질이상(저K·저Na·저Mg) / 탈수·저혈압 / 신기능악화 / 이독성(고용량)</p>
  <p><b>모니터링</b>: 체중 / K+/Na/Mg / eGFR/Cr / 울혈 징후 / 혈압</p>
  <p><b>이상반응</b>: 저칼륨혈증 / 저나트륨혈증 / 탈수 / 신기능악화 / 이독성</p>
  <p><b>심부전 노트</b>: 최소 유효용량으로 euvolemia 유지. 예후약(GDMT) 아님—증상조절용</p>
  <p><a href="#lib">심부전 처방가이드 상세 →</a></p>
</section>

  <p><b>용법</b>: 시작 500–1000mg IV (0주·4주) / 목표 ferritin&gt;100 &amp; TSAT&gt;20% / 적정 체중·Hb 기반 용량, 3–6개월마다 재평가·보충</p>

<section id="pillar-hf" class="seo-pillar">

  <p><b>💊 ARNI/ACEI</b> (RAS 차단): 사쿠비트릴/발사르탄 · 에날라프릴 · 라미프릴 · 칸데사르탄 · 발사르탄 · 로사르탄</p>
  <p><b>💊 BB</b> (베타차단제): 비소프롤롤 · 카르베딜롤 · 네비볼롤 · 메토프롤롤</p>

  <p><b>💊 SGLT2i</b> (심·신 보호): 다파글리플로진 · 엠파글리플로진</p>

<section id="reimb-hf" class="seo-reimb">
  <h3>심부전 급여기준·상병코드 요약</h3>
  <p><b>다파/엠파글리플로진 만성심부전 급여기준</b>: 증상·징후 + (LVEF≤40 OR LVEF&gt;40+NP상승 OR 12개월내 악화입원). 비당뇨 포함 — 고시 다파 고시 제2025-102호(2025-07-01) · 엠파 고시 제2026-159호(2026-08-01) — HF 적응증 보유 품목 한정(포시가 취하)</p>
  <p><b>사쿠비트릴/발사르탄(엔트레스토) 급여기준</b>: LVEF≤40% + NYHA II-IV + 표준치료 병용 — 고시 고시 제2023-120호 (2023.7.1)</p>
  <p><b>피네레논(케렌디아) 급여기준</b>: ★HF 단독=비급여. DKD경로도 NYHA II-IV 만성HF 제외 → HF환자 급여 불가 — 고시 고시 제2024-20호 (2024.2.1) — DKD 경로</p>
  <p><b>이바브라딘(프로코라란) 급여기준</b>: 동리듬 + HR≥75 + LVEF≤35% NYHA II–IV + (BB 금기·불내성 또는 표준치료 4주 후 병용) · LVEF 35–40% 선별급여(본인부담 50%) — 고시 제2023-23호(2023-02-01) — 고시 HIRA 약제기준</p>
  <p><b>정맥 철분제(페릭 카르복시말토오스) 급여</b>: Hb ≤10 g/dL + ferritin &lt;30 또는 TSAT &lt;20% + 경구 곤란(비투석 CKD 별도) — 고시 제2025-102호(2025-07-01) · 비빈혈 HF 철결핍은 비급여 — 고시 HIRA 약제기준</p>
  <p><b>피네레논 최신(2026.7)</b>: 2025.10 LVEF≥40% HF 적응증 국내 승인(FINEARTS-HF), 급여는 DKD 경로만 — HF 단독 급여 미등재.</p>
  <p><b>SGLT2i 최신(2026.7)</b>: 2024.2 LVEF≤40 → 2025.2 LVEF>40 확대(NT-proBNP≥125 또는 BNP≥35, 또는 12개월내 심부전 악화 입원). 비당뇨 포함(오리지널·승계품목 한정).</p>
  <div id="kcd-hf">
    <h4>심부전 상병코드 (KCD)</h4>
    <p><b>I50.0</b>: 울혈성 심부전 — 가장 광범위 사용</p>
    <p><b>I50.1</b>: 좌심실부전</p>
    <p><b>I50.9</b>: 상세불명 심부전 — 표현형 미확정 시</p>
    <p><b>I50.20</b>: 수축기 심부전(상세불명) — HFrEF 계열</p>
    <p><b>I50.22</b>: 만성 수축기 심부전 — 만성 HFrEF</p>
    <p><b>I50.30</b>: 이완기 심부전(상세불명) — HFpEF 계열</p>
    <p><b>I50.32</b>: 만성 이완기 심부전 — 만성 HFpEF</p>
    <p><b>I50.42</b>: 만성 수축기+이완기 심부전 — 혼합형</p>
    <p><b>I11.0</b>: 고혈압성 심장병, 심부전 동반 — 고혈압 원인 시</p>
    <p><b>I13.0</b>: 고혈압성 심장·신장병, 심부전 동반 — 고혈압+CKD</p>
  </div>
  <p><a href="#lib">급여기준 상세 →</a></p>
</section>

<section id="concept-esc2026" class="seo-concept">
  <h3>2026 ESC 심부전 지침 반영 (2026.11)</h3>
  <p>HFrEF = LVEF &lt;50%(ESC 2026). HFmrEF 폐지. HFpEF = LVEF ≥50% + 구조·기능 이상 객관 증거 + NP 상승</p>
  <p>'급성 HF' → '비대상성 HF(DHF)'로 용어 변경</p>
  <p>HF 병기 A–D 채택 — 위험인자 단계부터 진행성 HF까지</p>
  <p>치료 분류 신설: FMT(기본) · AMT(추가) · GDIT(시술·기기)</p>
  <p>HFimpEF: 이전 대비 절대 +10%p 이상 &amp; 40% 초과 — FMT 유지</p>
  <p>ESC 2026 신규 권고 39개 · LoE 체계 A/B1/B2/C</p>
  <p><b>I/A</b> 증상 HF는 LVEF와 무관하게 SGLT2 억제제(다파·엠파) — HF 입원·CV 사망 감소</p>
  <p><b>I/A</b> 증상 HF는 LVEF와 무관하게 MRA — HFrEF는 스테로이드성, HFpEF는 스테로이드성 또는 피네레논(비스테로이드성)</p>
  <p><b>I/A</b> 안정된 증상 HFrEF에 베타차단제</p>
  <p><b>I/A</b> 증상 HFrEF에 ACE 억제제 또는 ARNI(ESC 2026은 동격 — KSHF 2022의 'ARNI 우선'은 한국 레이어 참고)</p>
  <p><b>I/B1</b> ACE 억제제·ARB 복용 중인 증상 HFrEF는 ARNI로 전환(ACE-I 중단 후 36시간 washout)</p>
  <p><b>I/A</b> ACE-I·ARNI 불내성이면 ARB</p>
  <p><b>지침⟷급여</b>: ESC 2026: LVEF 41–49%도 HFrEF → ACE-I/ARNI I/A(외삽) / 급여: LVEF ≤40%만(고시 2023-120) — 41–49%는 ARNI 비급여</p>
  <p><b>지침⟷급여</b>: ESC 2026: 최적 FMT에도 LVEF &lt;45% 증상 HFrEF IIb/B1 — 악화 사건 요건 없음 / 허가: HF 입원/외래 IV 이뇨제 경험자 한정 · 급여: 6개월 입원 또는 3개월 외래 IV 이뇨제 + 리듬별 NP 컷 + 4주 표준치료</p>
  <p><b>지침⟷급여</b>: ESC 2026: HFpEF에 nsMRA(피네레논) 포함 MRA I/A / 허가 있음(LVEF ≥40%) · HF 급여기준 없음 → 비급여 (스피로노락톤은 세부기준 없는 일반 원칙)</p>
  <p><b>지침⟷급여</b>: ESC 2026: 철결핍 증상 HFrEF IV 철분 I/B1 — 빈혈 무관 / 급여: Hb ≤10 + ferritin &lt;30 또는 TSAT &lt;20 + 경구 곤란(고시 2025-102) — 비빈혈 HF 철결핍은 비급여</p>
  <p><b>지침⟷급여</b>: ESC 2026: LVEF ≥45% + BMI ≥30 세마/터제 IIa/B1 / HF 적응증 없음(체중관리 허가) · 비급여</p>
  <p><b>지침⟷급여</b>: ESC 2026: 안정시 HR &gt;70 / 허가·급여: HR ≥75 (고시 2023-23) · LVEF 35–40%는 선별급여 50%</p>
  <p>한국 레이어: KSHF 2022 (2026 개정 진행 중). 급여: 심평원 고시 원문 2026-11-01 재검증.</p>

<script>
/* 공용 뒤로가기 트랩 v4 — 모바일/브라우저 뒤로가기가 페이지를 이탈시키지 않고
   (1) 열린 팝업(모달·시트)을 닫거나, (2) 팝업이 없으면 앱 내부 "‹ 도서관/돌아가기/목록으로" 뷰-백을 실행한다.
   둘 다 없으면 뒤로가기는 정상 이탈(사용자 안 가둠). 앱 내부 함수명을 몰라도 DOM 레벨로 동작. */
(function(){
  "use strict";
  if(window.__backTrapInstalled) return; window.__backTrapInstalled=true;
  var armed=false, consuming=false, baseline=null, backTrapOK=true, lastSched=-1;
  var SHOW_CLASSES=['on','open','active','show','visible','is-open','opened','shown','in'];

  /* ---- 오버레이(팝업) 감지 ---- */
  function inView(el){
    var r=el.getBoundingClientRect();
    var iw=Math.min(r.right,innerWidth)-Math.max(r.left,0);
    var ih=Math.min(r.bottom,innerHeight)-Math.max(r.top,0);
    if(iw<=0||ih<=0) return false;
    return iw>=innerWidth*0.5 && (iw*ih)>=innerWidth*innerHeight*0.22;
  }
  function znum(s){ var z=parseInt(s.zIndex,10); return isNaN(z)?0:z; }
  function candidates(){
    var out=[], body=document.body; if(!body) return out;
    var all=body.getElementsByTagName('*');
    for(var i=0;i<all.length;i++){
      var el=all[i];
      if(el.id==='portal-hdr') continue;
      var s=getComputedStyle(el);
      if(s.position!=='fixed' && s.position!=='absolute') continue;
      if(s.display==='none'||s.visibility==='hidden'||parseFloat(s.opacity||'1')<0.05) continue;
      if(znum(s) < 10) continue;
      if(!inView(el)) continue;
      out.push(el);
    }
    return out;
  }
  function overlays(){ if(!baseline) return []; return candidates().filter(function(el){ return !baseline.has(el); }); }

  /* ---- 앱 내부 "도서관 돌아가기" 뷰-백 버튼 감지 ---- */
  function isVisible(el){
    var s=getComputedStyle(el); if(s.display==='none'||s.visibility==='hidden'||parseFloat(s.opacity||'1')<0.05) return false;
    var r=el.getBoundingClientRect(); return r.width>4 && r.height>4 && r.bottom>0 && r.top<innerHeight;
  }
  var BACK_ARROW=/[\u2039\u2190\u25C0\u27E8\u276E<]/;   // ‹ ← ◀ ⟨ ❮ <
  function looksBack(t){
    if(!t) return false; t=t.replace(/\s+/g,' ').trim(); if(t.length>16) return false;
    if(/돌아가기/.test(t)) return true;
    if(/목록으로/.test(t)) return true;
    if(/도서관/.test(t) && BACK_ARROW.test(t)) return true;
    if(BACK_ARROW.test(t) && /목록|리스트|처음|home/i.test(t)) return true;
    return false;
  }
  function backControl(){
    var nodes=document.body.querySelectorAll('[onclick],a,button,[role=button]');
    for(var i=0;i<nodes.length;i++){
      var el=nodes[i];
      if(el.id==='portal-hdr'||el.closest('#portal-hdr')) continue;
      if(!isVisible(el)) continue;
      if(looksBack(el.textContent||'')){
        return el.closest('[onclick],a,button,[role=button]')||el;
      }
    }
    return null;
  }

  /* ---- 무엇을 닫을지 결정(팝업 우선, 없으면 뷰-백) ---- */
  function closeTarget(){
    if(overlays().length>0) return {type:'overlay'};
    if(backTrapOK){ var b=backControl(); if(b) return {type:'back', el:b}; }
    return null;
  }

  function appClosers(){
    var bad={close:1,closed:1,stop:1,print:1,open:1,opener:1,focus:1,blur:1,alert:1,confirm:1,prompt:1};
    var fns=[];
    for(var k in window){
      try{ if(/^(close|hide|dismiss)/i.test(k) && !bad[k] && typeof window[k]==='function' && window[k].length===0 && (''+window[k]).indexOf('[native code]')<0) fns.push(window[k]); }catch(e){}
    }
    try{ if(typeof window.close==='function' && (''+window.close).indexOf('[native code]')<0) fns.push(window.close); }catch(e){}
    return fns;
  }
  function closeOverlays(){
    appClosers().forEach(function(fn){ try{fn.call(window);}catch(e){} });
    overlays().forEach(function(el){ SHOW_CLASSES.forEach(function(c){ el.classList.remove(c); }); });
    try{ if(!overlays().length) document.body.style.overflow=''; }catch(e){}
  }

  function refreshOnce(){
    var has=!!closeTarget();
    if(has && !armed){ armed=true; try{history.pushState({backTrap:1},'');}catch(e){} }
    else if(!has && armed && !consuming){ consuming=true; try{history.back();}catch(e){} }
  }
  function schedule(){
    var t=(window.performance&&performance.now)?performance.now():+new Date();
    if(lastSched>=0 && t-lastSched<80) return; lastSched=t;
    [0,100,250,450,700].forEach(function(d){ setTimeout(refreshOnce,d); });
  }

  window.addEventListener('popstate', function(){
    if(consuming){ consuming=false; armed=false; return; }
    var tgt=closeTarget();
    if(tgt){
      armed=false;
      if(tgt.type==='overlay') closeOverlays();
      else if(tgt.el){ try{tgt.el.click();}catch(e){} }   // 앱 자체 "도서관 돌아가기" 실행
      schedule();                                          // 더 깊으면 재무장
    } else { armed=false; }
  });

  function init(){
    baseline=new WeakSet();
    candidates().forEach(function(el){ baseline.add(el); });
    backTrapOK = (backControl()===null);      // 로드(도서관 뷰)에 이미 백버튼 보이면 신호로 못 씀 → 뷰-백 트랩 비활성
    var mo=new MutationObserver(schedule);
    mo.observe(document.body,{subtree:true,attributes:true,attributeFilter:['class','style','hidden'],childList:true});
    document.addEventListener('click',function(){ schedule(); },true);
    window.addEventListener('resize',schedule);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ setTimeout(init,80); });
  else setTimeout(init,80);
})();
</script>

/* ===== hf v2 (ESC 2026 · 급여 원문 2026-11) 가산 블록 — v1 코드 무수정 ===== */
/* ===================================================================
   공용 when 미니문법 (SPEC §10.5(5)) — eval/Function 미사용 재귀하강 파서
   문법: has(x) · matched(x) · 비교(== != >= <= > <) · && || ! · 괄호
   식별자: ctx.vars에 있으면 값, 없으면 문자열 리터럴(예: phase == high)
   출처: dyslipidemia v2 lipidWhenEval과 동일 의미론 — 신규 가이드는 이 모듈 사용
   =================================================================== */
var WhenDSL = (function(){
  function tokens(s){
    var t=[], i=0, re=/\s*(\|\||&&|==|!=|>=|<=|[()!<>]|-?\d+(?:\.\d+)?(?:e\d+)?|[A-Za-z_][\w:.\-]*)/y;
    while(i<s.length){ re.lastIndex=i; var m=re.exec(s); if(!m){ if(/^\s*$/.test(s.slice(i))) break; throw new Error("when 구문 오류: "+s.slice(i)); } t.push(m[1]); i=re.lastIndex; }
    return t;
  }
  function evaluate(expr, ctx){
    if(expr==null || expr==="") return true;
    var tk=tokens(expr), p=0, vars=ctx.vars||{};
    function peek(){ return tk[p]; } function next(){ return tk[p++]; }
    function val(tok){
      if(/^-?\d/.test(tok)) return parseFloat(tok);
      if(tok==="true") return true; if(tok==="false") return false;
      if(Object.prototype.hasOwnProperty.call(vars,tok)) return vars[tok];
      return tok;
    }
    function primary(){
      var tok=next();
      if(tok==="("){ var v=orE(); next(); return v; }
      if(tok==="!") return !primary();
      if((tok==="has"||tok==="matched") && peek()==="("){ next(); var arg=next(); next();
        return tok==="has" ? !!(ctx.has&&ctx.has(arg)) : !!(ctx.matched&&ctx.matched(arg)); }
      var a=val(tok), op=peek();
      if(op==="=="||op==="!="||op===">="||op==="<="||op===">"||op==="<"){
        next(); var b=val(next());
        if(op==="==") return a===b; if(op==="!=") return a!==b;
        if(typeof a!=="number"||typeof b!=="number") return false;
        if(op===">=") return a>=b; if(op==="<=") return a<=b; if(op===">") return a>b; return a<b;
      }
      return !!a;
    }
    function andE(){ var v=primary(); while(peek()==="&&"){ next(); var r=primary(); v=v&&r; } return v; }
    function orE(){ var v=andE(); while(peek()==="||"){ next(); var r=andE(); v=v||r; } return v; }
    var out=orE(); if(p<tk.length) throw new Error("when 잔여 토큰: "+tk.slice(p).join(" "));
    return out;
  }
  return { tokens:tokens, eval:evaluate, version:"when-dsl-1.0" };
})();

  (rb.notes||[]).forEach(function(n){ if(n) h+='<div class="hf26-mini">· '+esc(n)+'</div>'; });
  return h;
}
function drugHTML(d){
  var r=REC[d.rec];
  var h='<div class="rec-item"><div class="rh"><span class="nm">'+esc(d.label)+' <small style="font-weight:500;color:var(--hf-mut)">'+esc(d.clsLabel)+'</small></span></div>'+
    '<div class="badges">'+gradeBadge(d.grade)+loeBadge(d.loe)+reimbBadge(d.reimb.status)+'</div>';
  if(r) h+='<div class="role">'+esc(r.text)+' <span class="hf26-mini">('+esc(r.cite)+')</span></div>';
  if(d.brand) h+='<div class="hf26-mini">'+esc(d.brand)+'</div>';
  if(d.dose) h+='<div class="hf26-mini"><b>용량</b> '+esc(d.dose.start)+' → '+esc(d.dose.target)+(d.dose.note?' · '+esc(d.dose.note):'')+(d.dose.src!==D.DOSE_SRC?' <i>('+esc(d.dose.src)+')</i>':'')+'</div>';
  d.safety.forEach(function(s){ h+='<div class="'+(s.lv==="warn"?"warnbox":"infobox")+'" style="margin:5px 0;padding:6px 9px">'+esc(s.msg)+'</div>'; });
  h+='<details><summary class="hf26-sum hf26-mini">급여 판정 상세 ▾</summary>'+reimbDetail(d.reimb)+'</details>';
  if(d.recs.length>1) h+='<div class="hf26-mini">관련 권고: '+d.recs.map(function(id){ var x=REC[id]; return esc(x.grade+'/'+x.loe); }).join(' · ')+'</div>';
  return h+'</div>';
}
function resultHTML(res){
  var v=res.vars||{};
  if(res.phenotype26==="none") return '<div class="infobox">ESC 2026 판정: LVEF를 입력하세요.</div>';
  var P=D.PHENO26["hf:pheno26:"+res.phenotype26];
  var h='<div class="card lead hf26-res" id="hf26Result"><div class="head"><span class="emoji">🆕</span><div class="t">ESC 2026 판정 <small>한국 레이어 KSHF 2022 · 급여 HIRA 원문 2026-11-01</small></div></div><div class="body">';
  h+='<div class="hf26-ban">ESC 2026: '+esc(P.label)+' ('+esc(P.rule)+') · KSHF 2022: '+esc(res.kshfLabel||"—")+'</div>';
  if(res.band4149) h+='<div class="infobox">'+esc(D.PHENO26["hf:pheno26:band4149"].text)+'</div>';
  if(res.impef) h+='<div class="infobox">'+esc(D.PHENO26["hf:pheno26:impef"].text)+'</div>';
  res.conflicts.forEach(function(id){ var c=CONF[id];
    h+='<div class="conflictbox"><b>⚖️ 지침 ⟷ 급여 상충</b><div>📘 '+esc(c.gl)+'</div><div>💰 '+esc(c.rb)+'</div></div>'; });
  if(res.avoid.length){ h+='<div class="warnbox"><b>⛔ 금기·권고하지 않음 (Class III)</b>'+res.avoid.map(function(a){ return '<div>· '+esc(a.label)+' — '+esc(a.text)+'</div>'; }).join('')+'</div>'; }
  var tiers=Object.keys(D.TIERS).sort(function(a,b){ return D.TIERS[a].order-D.TIERS[b].order; });
  tiers.forEach(function(t){
    var ds=res.drugs.filter(function(d){ return d.tier===t; });
    var ps=res.recs.map(function(id){ return REC[id]; }).filter(function(r){ return r.tier===t && (!r.drugs||!r.drugs.length); });
    if(!ds.length && !ps.length) return;
    h+='<div class="hf26-tier">'+esc(D.TIERS[t].label)+' <span class="hf26-mini">'+esc(D.TIERS[t].desc)+'</span></div>';
    ds.forEach(function(d){ h+=drugHTML(d); });
    ps.forEach(function(r){ h+='<div class="rec-item"><div class="role" style="color:var(--hf-ink)">'+esc(r.text)+'</div><div class="badges">'+gradeBadge(r.grade)+loeBadge(r.loe)+'</div></div>'; });
  });
  if(res.unavailable.length) h+='<div class="infobox"><b>국내 미허가(참고)</b>'+res.unavailable.map(function(d){ return '<div>· '+esc(d.label)+' — '+esc(d.kr_note||"")+'</div>'; }).join('')+'</div>';
  res.flags.filter(function(f){ return f.lv!=="conflict"; }).forEach(function(f){ h+='<div class="'+(f.lv==="warn"?"warnbox":"infobox")+'">'+esc(f.msg)+'</div>'; });
  if(res.errata.length) h+='<div class="kbox kbox-green"><b>🔧 v1 정정 반영</b>'+res.errata.map(function(id){ var e=ERR[id]; return '<div>'+esc(id.replace("hf:err:",""))+' · '+esc(e.current)+'</div>'; }).join('')+'</div>';
  h+='<div class="disclaimer">ESC 2026 권고는 한국어 의역(원문 미수록)이며 Class/LoE는 원문 표기입니다. 급여 판정은 입력값 기반 참고 — 청구 전 고시 원문·품목 허가사항을 확인하세요.</div>';
  return h+'</div></div>';
}

/* ---------- 입력 ---------- */
function inputCardHTML(ns){
  var fl=D.INPUTS.filter(function(i){ return i.type!=="chip"; }), ch=D.INPUTS.filter(function(i){ return i.type==="chip"; });
  var h='<div class="card lead hf26-in" id="hf26Input'+(ns==="sim"?"Sim":"")+'"><div class="head"><span class="emoji">🆕</span><div class="t">ESC 2026·급여 추가 입력 <small>선택 — 비워 두면 해당 조건은 미충족으로 판정</small></div></div><div class="body"><div class="form-grid">';
  fl.forEach(function(i){
    if(i.type==="select") h+='<div class="fld"><label>'+esc(i.label)+'</label><select data-k26="'+esc(i.k)+'">'+i.opts.map(function(o){ return '<option value="'+esc(o[0])+'">'+esc(o[1])+'</option>'; }).join('')+'</select></div>';
    else h+='<div class="fld"><label>'+esc(i.label)+'</label><input type="number" inputmode="decimal" data-k26="'+esc(i.k)+'" placeholder="'+esc(i.ph||"")+'"></div>';
  });
  h+='</div><div class="chips">'+ch.map(function(i){ return '<button class="chip" data-chip26="'+esc(i.k)+'">'+esc(i.label)+'</button>'; }).join('')+'</div></div></div>';
  return h;
}
function collect(scopeSel, chipsSel, inCard){
  var p={};
  $$(scopeSel+' [data-k]').forEach(function(inp){ if(inp.value!=="") p[inp.getAttribute("data-k")]=inp.value; });
  $$(chipsSel+' .chip.sel').forEach(function(c){ p[c.getAttribute("data-chip")]=true; });
  if(inCard){ $$('[data-k26]',inCard).forEach(function(inp){ if(inp.value!=="") p[inp.getAttribute("data-k26")]=inp.value; });
    $$('[data-chip26].sel',inCard).forEach(function(c){ p[c.getAttribute("data-chip26")]=true; }); }
  return p;
}
function runFlow(){
  var out=$('#flowResult'); if(!out) return;
  var p=collect('#sec-flow','#flowChips',$('#hf26Input'));
  var res=E.applyHf2026(p);
  var legacy=out.innerHTML;
  out.innerHTML=resultHTML(res)+(legacy?'<details class="hf26-legacy"><summary>이전 지침(v1 · KSHF 2022/ESC 2023) 결과 보기 ▾</summary>'+legacy+'</details>':'');
}

/* ---------- 도서관 ---------- */
function libCard(id, emoji, title, sub, body){
  return '<details class="card lead hf26-libcard" id="'+id+'"><summary class="head hf26-sum"><span class="emoji">'+emoji+'</span><div class="t">'+esc(title)+(sub?' <small>'+esc(sub)+'</small>':'')+'</div><span class="chev">▾</span></summary><div class="body">'+body+'</div></details>';
}
function recRow(r){ return '<tr><td>'+gradeBadge(r.grade)+' '+loeBadge(r.loe)+'</td><td>'+esc(r.text)+' <span class="hf26-mini">'+esc(r.cite)+(r.scope==="library"?' · 도서관':'')+(r.change&&r.change!=="same"?' · '+esc(r.change):'')+'</span></td></tr>'; }
function sortedRecs(list){ return list.slice().sort(function(a,b){ var g=D.REC_SYSTEMS["recsys:esc"]; var x=g.grade[a.grade].rank-g.grade[b.grade].rank; if(x) return x; return g.loe_rank[a.loe]-g.loe_rank[b.loe]; }); }
function gateText(node, depth){
  if(!node) return "";
  if(!node.op) return '<li>'+esc(node.txt)+'</li>';
  return (node.label?'<li class="grp">'+esc(node.label)+'</li>':'')+'<li class="grp">'+(node.op==="AND"?"모두 충족":"하나 이상")+'</li><li><ul>'+node.conds.map(function(c){ return gateText(c, depth+1); }).join('')+'</ul></li>';
}
function renderLib(){
  var sec=$('#sec-lib'); if(!sec||$('#hf26-lib')) return;
  var tiers=Object.keys(D.TIERS).sort(function(a,b){ return D.TIERS[a].order-D.TIERS[b].order; });
  var all='<div class="hf26-mini">총 '+D.REC_2026.length+'건 (엔진 판정 '+D.REC_2026.filter(function(r){ return r.scope==="rx"; }).length+' · 도서관 '+D.REC_2026.filter(function(r){ return r.scope==="library"; }).length+')</div>';
  tiers.forEach(function(t){ var rs=sortedRecs(D.REC_2026.filter(function(r){ return r.tier===t; })); if(!rs.length) return;
    all+='<div class="hf26-tier">'+esc(D.TIERS[t].label)+'</div><table class="hf26-tbl">'+rs.map(recRow).join('')+'</table>'; });
  var tierBody=tiers.map(function(t){ return '<div class="rec-item"><b>'+esc(D.TIERS[t].label)+'</b><div class="role">'+esc(D.TIERS[t].desc)+'</div></div>'; }).join('')+
    '<div class="hf26-mini">v1 치료축 대응: '+Object.keys(D.AXIS_TIER).map(function(a){ return esc(a.replace("axis:",""))+'→'+esc(D.TIERS[D.AXIS_TIER[a]].label.split(" ")[0]); }).join(' · ')+'</div>';
  var doseRows=Object.keys(D.DOSE_2026).map(function(did){ var info=E.drugInfo(did), d=D.DOSE_2026[did];
    return '<tr><td><b>'+esc(info?info.label_ko:did)+'</b></td><td>'+esc(d.start)+'</td><td>'+esc(d.target)+(d.note?'<div class="hf26-mini">'+esc(d.note)+'</div>':'')+'</td></tr>'; }).join('');
  var safety=D.SAFETY.map(function(s){ return '<div class="'+(s.lv==="warn"?"warnbox":"infobox")+'">'+esc(E.tpl(s.msg))+'</div>'; }).join('');
  var reimb=Object.keys(D.REIMB_2026).map(function(id){ var r=D.REIMB_2026[id];
    var h='<div class="rec-item"><div class="rh"><span class="nm">'+esc(r.title)+'</span>'+(r.fixed?reimbBadge(r.fixed):'')+'</div><div class="hf26-mini">'+esc(noticeLabel(r.notice))+'</div>';
    if(r.gate) h+='<ul class="hf26-gate">'+gateText(r.gate,0)+'</ul>';
    if(r.selective) h+='<div class="hf26-mini">· '+esc(r.selective.txt)+'</div>';
    (r.notes||[]).forEach(function(n){ h+='<div class="hf26-mini">· '+esc(n)+'</div>'; });
    if(r.fallback) h+='<div class="hf26-mini">· '+esc(r.fallback.note)+'</div>';
    return h+'</div>'; }).join('')+'<div class="hf26-mini">세부기준 없음(허가 범위 내 일반 원칙): 디곡신·스피로노락톤·에플레레논·고리이뇨제·로켈마 등</div>';
  var conf=D.CONFLICTS.map(function(c){ return '<div class="conflictbox"><div>📘 '+esc(c.gl)+'</div><div>💰 '+esc(c.rb)+'</div></div>'; }).join('');
  var err='<table class="hf26-tbl"><tr><th>ID</th><th>v1</th><th>현행</th></tr>'+D.ERRATA.map(function(e){ return '<tr><td>'+esc(e.id.replace("hf:err:",""))+'</td><td>'+esc(e.v1_value)+'</td><td>'+esc(e.current)+' <span class="hf26-mini">'+esc(e.src)+'</span></td></tr>'; }).join('')+'</table>';
  var kr=Object.keys(D.NOTES_KR).map(function(k){ return '<div class="rec-item"><div class="role">'+esc(D.NOTES_KR[k])+'</div></div>'; }).join('')+
    '<div class="infobox">'+esc(D.LIB.kshf2026)+'</div>'+
    '<div class="hf26-mini">v1 권고 → 2026 대체: '+Object.keys(D.SUPERSEDED_V1).map(function(k){ return esc(k.replace("hf:rec:",""))+'→'+esc((D.SUPERSEDED_V1[k].map(function(x){ return x.replace("hf:rec26:",""); }).join("+"))||"ESC 권고 없음"); }).join(' · ')+'</div>';
  var html='<div id="hf26-lib">'+
    libCard('hf26-lib-concept','🆕','ESC 2026 핵심 변화','2026-08 발표 · 신규 권고 39',D.LIB.concepts.map(function(c){ return '<div class="rec-item"><div class="role">'+esc(c)+'</div></div>'; }).join('')+'<div class="hf26-mini">'+esc(D.REC_SYSTEMS["recsys:esc"].loe_note)+'</div>')+
    libCard('hf26-lib-tier','🏛️','치료 분류 FMT · AMT · GDIT','',tierBody)+
    libCard('hf26-lib-recs','📋','ESC 2026 권고 전수','등급순 · 의역',all)+
    libCard('hf26-lib-dose','💊','용량표 (시작 → 목표)',D.DOSE_SRC,'<table class="hf26-tbl"><tr><th>약물</th><th>시작</th><th>목표</th></tr>'+doseRows+'</table>')+
    libCard('hf26-lib-safety','⚠️','안전 임계값','ESC 2026 본문·허가',safety)+
    libCard('hf26-lib-reimb','💰','급여 기준 (고시 원문 2026-11-01)','HIRA 보험인정기준',reimb)+
    libCard('hf26-lib-conf','⚖️','지침 ⟷ 허가·급여 상충',D.CONFLICTS.length+'건',conf)+
    libCard('hf26-lib-err','🔧','v1 정정 (errata)',D.ERRATA.length+'건',err)+
    libCard('hf26-lib-kr','🇰🇷','한국 레이어 · KSHF','KSHF 2022 유지 · 2026 개정 대기',kr)+
    '<div class="hf26-old">아래 분야별 카드는 이전 지침(v1 · KSHF 2022/ESC 2023) 기준입니다. 2026 변경·정정은 위 카드를 우선하세요.</div></div>';
  var hub=$('#libHub');
  if(hub) hub.insertAdjacentHTML('beforebegin', html); else sec.insertAdjacentHTML('afterbegin', html);
}

/* ---------- 시뮬레이션 ---------- */
function renderSim(){
  var sec=$('#sec-sim'); if(!sec||$('#hf26-sim')) return;
  var h='<div class="card lead" id="hf26-sim"><div class="head"><span class="emoji">🧪</span><div class="t">ESC 2026 증례 <small>탭하면 2026 엔진 판정(입력값만 저장 — 판정은 매번 계산)</small></div></div><div class="body">';
  D.SIM_CASES.forEach(function(c){ h+='<button class="btn-ghost hf26-case" data-case26="'+esc(c.id)+'"><b>'+esc(c.title)+'</b><div class="hf26-mini">'+esc(c.point)+'</div></button>'; });
  h+='<div id="hf26SimOut" class="result"></div></div></div>';
  sec.insertAdjacentHTML('afterbegin', h);
  $('#hf26-sim').addEventListener('click',function(e){
    var b=e.target.closest('[data-case26]'); if(!b) return;
    var c=null; D.SIM_CASES.forEach(function(x){ if(x.id===b.getAttribute('data-case26')) c=x; });
    if(c) $('#hf26SimOut').innerHTML=resultHTML(E.applyHf2026(c.p));
  });
}

/* ---------- 헤더·푸터 ---------- */
function relabel(){
  $$('.hf-hd .gl span').forEach(function(s){ if(/ESC 2023/.test(s.textContent)) s.textContent='ESC 2026 반영'; });
  var gl=$('.hf-hd .gl'); if(gl && !$('#hf26Ver')) gl.insertAdjacentHTML('beforeend','<span id="hf26Ver">'+esc(D.META.version)+'</span>');
  var sub=$('.hf-hd .sub'); if(sub && !/2026/.test(sub.textContent)) sub.textContent='HFrEF(<50%) · HFpEF(≥50%) — ESC 2026 · KSHF 2022 HFmrEF 병기 · 전문가용 의사결정 조언자';
}
function renderSources(){
  var el=$('#sources'); if(!el||$('#hf26-src')) return;
  el.insertAdjacentHTML('afterbegin','<div id="hf26-src"><h3>🆕 2026 개정 출처</h3><ul>'+D.SOURCES.map(function(s){
    return '<li><a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.label)+' ↗</a>'+(s.kind==="secondary"?' <span class="hf26-mini">(2차)</span>':'')+'</li>'; }).join('')+'</ul></div>');
}

function bindChips(card){ if(!card) return; card.addEventListener('click',function(e){ var b=e.target.closest('[data-chip26]'); if(b) b.classList.toggle('sel'); }); }
function init(){
  if(!document.getElementById('hf26-css')){ var st=document.createElement('style'); st.id='hf26-css'; st.textContent=CSS; document.head.appendChild(st); }
  relabel(); renderLib(); renderSim(); renderSources();
  var run=$('#flowRun');
  if(run && !$('#hf26Input')){ run.insertAdjacentHTML('beforebegin', inputCardHTML('flow')); bindChips($('#hf26Input')); run.addEventListener('click', runFlow); }
  var resetBtn=$('#flowReset'); if(resetBtn) resetBtn.addEventListener('click',function(){ $$('#hf26Input [data-k26]').forEach(function(i){ i.value=''; }); $$('#hf26Input .sel').forEach(function(c){ c.classList.remove('sel'); }); });
}
window.__hf26UI={ resultHTML:resultHTML, runFlow:runFlow };
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(init,0); });
else setTimeout(init,0);
})(HF26, HF26_ENGINE);

</script>
