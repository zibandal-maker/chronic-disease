<noscript><div class="seo-content"><h2>폐렴 처방·경험적 항생제·급여 진료지침 정보 (임상의용)</h2><p>성인 폐렴(지역사회획득 CAP·병원획득 HAP·인공호흡기연관 VAP·흡인성)의 중증도 평가(CURB-65·PSI·IDSA/ATS)와 경험적 항생제 선택을 한국 CAP 2018·HAP 2025 지침과 IDSA/ATS 2016을 병치해 제시하고, 원인균 동정·기저질환·면역저하 3축과 심평원 급여·삭감 위험을 함께 안내한다.</p><section id="type-cap"><h3>지역사회획득 폐렴</h3><p>입원 48시간 이전/외래 발생. 폐렴구균·비정형(마이코플라스마·클라미디아·레지오넬라)·H.influenzae 중심. cap_out_simple, cap_out_comorbid, cap_ward, cap_icu</p></section><section id="type-hap"><h3>병원획득 폐렴(HAP)</h3><p>입원 &gt;48h 후 발생. 다제내성 그람음성(녹농균·아시네토박터·ESBL)·MRSA 위험↑. hap_low, hap_high</p></section><section id="type-vap"><h3>인공호흡기연관 폐렴(VAP)</h3><p>기계환기 ≥48h 후 발생. MDR 최고위험. 침습적 정량배양·프로칼시토닌 진단 루틴은 비권고. vap_low, vap_high</p></section><section id="type-aspiration"><h3>흡인성 폐렴</h3><p>흡인 위험군(연하장애·의식저하·신경질환)의 하기도 세균감염. aspiration</p></section><section id="type-viral_influenza"><h3>인플루엔자 폐렴</h3><p>인플루엔자 바이러스에 의한 폐렴 ± 세균 이차감염. influenza</p></section><section id="type-viral_covid"><h3>COVID-19 폐렴</h3><p>SARS-CoV-2 폐렴. 중증도(산소요구)에 따라 스테로이드·항바이러스·면역조절. covid</p></section><section id="type-pcp"><h3>주폐포자충 폐렴(PCP)</h3><p>면역저하(HIV CD4&lt;200·장기 스테로이드·이식·혈액암)에서 아급성 호흡곤란·건성기침·LDH↑. pcp</p></section><section id="type-abscess"><h3>폐농양·괴사성 폐렴</h3><p>공동·괴사 병변. 혐기성 포함 장기 항생제. abscess</p></section><section id="type-empyema"><h3>농흉</h3><p>흉막강 화농. 배액이 핵심. empyema</p></section><section id="pathogen-target_mssa"><h3>MSSA 표적치료</h3><p>1차 세파졸린(cefazolin)</p></section><section id="pathogen-target_mrsa"><h3>MRSA 표적치료</h3><p>1차 반코마이신(vancomycin), 리네졸리드(linezolid)</p></section><section id="pathogen-target_pseudomonas"><h3>P.aeruginosa 표적치료</h3><p>1차 피페라실린/타조박탐(piperacillin-tazobactam), 세페핌(cefepime), 세프타지딤(ceftazidime), 메로페넴(meropenem) — 확진·감수성 시 단독(한국 HAP2025 #7)</p></section><section id="pathogen-target_crab"><h3>CRAB(A.baumannii) 표적치료</h3><p>1차 암피실린/설박탐(ampicillin-sulbactam), 콜리스티메테이트(콜리스틴)(colistimethate) — colistin ±흡입</p></section><section id="pathogen-target_esbl"><h3>ESBL 장내세균 표적치료</h3><p>1차 메로페넴(meropenem), 이미페넴/실라스타틴(imipenem-cilastatin), 에르타페넴(ertapenem)</p></section><section id="pathogen-target_cre"><h3>CRE 표적치료</h3><p>1차 세프타지딤/아비박탐(ceftazidime-avibactam), 세피데로콜(cefiderocol)</p></section><section id="pathogen-target_legionella"><h3>L.pneumophila 표적치료</h3><p>1차 아지트로마이신(azithromycin), 레보플록사신(levofloxacin), 목시플록사신(moxifloxacin) — ≥14일</p></section><section id="drug-amoxicillin"><h3>아목시실린 (amoxicillin)</h3><p>아미노페니실린</p></section><section id="drug-amoxicillin_clavulanate"><h3>아목시실린/클라불란산 (amoxicillin-clavulanate)</h3><p>β-lactam/β-lactamase 억제제 복합</p></section><section id="drug-ampicillin_sulbactam"><h3>암피실린/설박탐 (ampicillin-sulbactam)</h3><p>β-lactam/β-lactamase 억제제 복합 · CRAB에 sulbactam 고용량</p></section><section id="drug-ampicillin"><h3>암피실린 (ampicillin)</h3><p>아미노페니실린 · 감수성 폐렴구균 정맥 표적(de-escalation)</p></section><section id="drug-nafcillin"><h3>나프실린 (nafcillin)</h3><p>항포도상 페니실린(MSSA) · MSSA 표적 — 가이드 표준. 국내 미시판→cefazolin 대체</p></section><section id="drug-cefazolin"><h3>세파졸린 (cefazolin)</h3><p>1세대 세팔로스포린 · MSSA 표적 — 국내 실사용 표준</p></section><section id="drug-cefuroxime"><h3>세푸록심 (cefuroxime)</h3><p>2세대 세팔로스포린</p></section><section id="drug-cefpodoxime"><h3>세프포독심 (cefpodoxime)</h3><p>3세대 세팔로스포린(경구)</p></section><section id="drug-cefditoren"><h3>세프디토렌 (cefditoren)</h3><p>3세대 세팔로스포린(경구)</p></section><section id="drug-cefotaxime"><h3>세포탁심 (cefotaxime)</h3><p>3세대 세팔로스포린(주사)</p></section><section id="drug-ceftriaxone"><h3>세프트리악손 (ceftriaxone)</h3><p>3세대 세팔로스포린(주사)</p></section><section id="drug-cefepime"><h3>세페핌 (cefepime)</h3><p>4세대 세팔로스포린 · 급여 ★★</p></section><section id="drug-ceftazidime"><h3>세프타지딤 (ceftazidime)</h3><p>항녹농균 β-lactam</p></section><section id="drug-piperacillin_tazobactam"><h3>피페라실린/타조박탐 (piperacillin-tazobactam)</h3><p>항녹농균 BL/BLI · 급여 ★★</p></section><section id="drug-aztreonam"><h3>아즈트레오남 (aztreonam)</h3><p>모노박탐 · β-lactam 알레르기 대체</p></section><section id="drug-imipenem_cilastatin"><h3>이미페넴/실라스타틴 (imipenem-cilastatin)</h3><p>카바페넴 · 급여 ★★★</p></section><section id="drug-meropenem"><h3>메로페넴 (meropenem)</h3><p>카바페넴 · 급여 ★★★</p></section><section id="drug-ertapenem"><h3>에르타페넴 (ertapenem)</h3><p>카바페넴 · 항녹농균 없음 · 급여 ★★★</p></section><section id="drug-doripenem"><h3>도리페넴 (doripenem)</h3><p>카바페넴 · 급여 ★★★</p></section><section id="drug-vancomycin"><h3>반코마이신 (vancomycin)</h3><p>글리코펩타이드 · 급여 ★★★</p></section><section id="drug-teicoplanin"><h3>테이코플라닌 (teicoplanin)</h3><p>글리코펩타이드 · 급여 ★★★</p></section><section id="drug-linezolid"><h3>리네졸리드 (linezolid)</h3><p>옥사졸리디논 · 급여 ★★★</p></section><section id="drug-tedizolid"><h3>테디졸리드 (tedizolid)</h3><p>옥사졸리디논</p></section><section id="drug-ceftaroline"><h3>세프타롤린 (ceftaroline)</h3><p>항MRSA 세팔로스포린 · 급여 ★★</p></section><section id="drug-azithromycin"><h3>아지트로마이신 (azithromycin)</h3><p>마크로라이드</p></section><section id="drug-clarithromycin"><h3>클래리트로마이신 (clarithromycin)</h3><p>마크로라이드</p></section><section id="drug-roxithromycin"><h3>록시트로마이신 (roxithromycin)</h3><p>마크로라이드</p></section><section id="drug-erythromycin"><h3>에리트로마이신 (erythromycin)</h3><p>마크로라이드</p></section><section id="drug-doxycycline"><h3>독시사이클린 (doxycycline)</h3><p>테트라사이클린</p></section><section id="drug-levofloxacin"><h3>레보플록사신 (levofloxacin)</h3><p>호흡기 플루오로퀴놀론 · 급여 ★★</p></section><section id="drug-moxifloxacin"><h3>목시플록사신 (moxifloxacin)</h3><p>호흡기 플루오로퀴놀론 · 급여 ★★</p></section><section id="drug-gemifloxacin"><h3>제미플록사신 (gemifloxacin)</h3><p>호흡기 플루오로퀴놀론</p></section><section id="drug-ciprofloxacin"><h3>시프로플록사신 (ciprofloxacin)</h3><p>플루오로퀴놀론</p></section><section id="drug-colistin"><h3>콜리스티메테이트(콜리스틴) (colistimethate)</h3><p>폴리믹신 · 급여 ★★★</p></section><section id="drug-amikacin"><h3>아미카신 (amikacin)</h3><p>아미노글리코사이드 · 급여 ★★</p></section><section id="drug-gentamicin"><h3>겐타마이신 (gentamicin)</h3><p>아미노글리코사이드</p></section><section id="drug-tobramycin"><h3>토브라마이신 (tobramycin)</h3><p>아미노글리코사이드</p></section><section id="drug-tigecycline"><h3>타이제사이클린 (tigecycline)</h3><p>글리실사이클린 · 급여 ★★★</p></section><section id="drug-ceftolozane_tazobactam"><h3>세프톨로잔/타조박탐 (ceftolozane-tazobactam)</h3><p>신규 β-lactam/BLI(MDR 그람음성) · 급여 ★★★</p></section><section id="drug-ceftazidime_avibactam"><h3>세프타지딤/아비박탐 (ceftazidime-avibactam)</h3><p>신규 β-lactam/BLI(MDR 그람음성) · CRE 표적 · 급여 ★★★</p></section><section id="drug-cefiderocol"><h3>세피데로콜 (cefiderocol)</h3><p>신규 β-lactam/BLI(MDR 그람음성) · CRAB 원내폐렴 1차(급여 2025.9 약평위) · 급여 ★★★</p></section><section id="drug-sulbactam_durlobactam"><h3>설박탐/둘로박탐 (sulbactam-durlobactam)</h3><p>신규 β-lactam/BLI(MDR 그람음성) · CRAB 표적(신규)</p></section><section id="drug-clindamycin"><h3>클린다마이신 (clindamycin)</h3><p>린코사마이드</p></section><section id="drug-metronidazole"><h3>메트로니다졸 (metronidazole)</h3><p>니트로이미다졸</p></section><section id="drug-oseltamivir"><h3>오셀타미비르 (oseltamivir)</h3><p>뉴라미니다제 억제제</p></section><section id="drug-peramivir"><h3>페라미비르 (peramivir)</h3><p>뉴라미니다제 억제제</p></section><section id="drug-baloxavir"><h3>발록사비르 (baloxavir marboxil)</h3><p>항바이러스제</p></section><section id="drug-remdesivir"><h3>렘데시비르 (remdesivir)</h3><p>항바이러스제</p></section><section id="drug-nirmatrelvir_ritonavir"><h3>니르마트렐비르/리토나비르 (nirmatrelvir-ritonavir)</h3><p>항바이러스제</p></section><section id="drug-dexamethasone"><h3>덱사메타손 (dexamethasone)</h3><p>항바이러스제 · COVID 저산소 보조</p></section><section id="drug-trimethoprim_sulfamethoxazole"><h3>트리메토프림/설파메톡사졸 (trimethoprim-sulfamethoxazole)</h3><p>엽산길항제(TMP-SMX 등) · PCP 치료·예방</p></section><section id="drug-primaquine"><h3>프리마퀸 (primaquine)</h3><p>항바이러스제 · PCP 대체(+clindamycin)</p></section><section id="drug-atovaquone"><h3>아토바쿠온 (atovaquone)</h3><p>항바이러스제 · PCP 경증 대체</p></section><section id="drug-pentamidine"><h3>펜타미딘 (pentamidine)</h3><p>항바이러스제 · PCP 대체</p></section><section id="reimb-pneumonia"><h3>폐렴 심평원 급여·삭감 및 KCD</h3><ul><li>glycopeptide (★★★): 그람양성 중증감염 허가범위 내 급여. 경험적 사용 가능.</li><li>linezolid (★★★): VRE 감염, 또는 MRSA/그람양성에서 glycopeptide(반코마이신·테이코플라닌) 사용 곤란(내성·부작용·실패) 시. 경구 포함.</li><li>carbapenem (★★★): 중증·복잡성 감염·ESBL 등 허가범위 내 급여.</li><li>piptazo (★★): 중등도–중증·녹농균/혼합감염 정황 허가범위 내 급여.</li><li>cefepime (★★): 중증·녹농균 위험 허가범위 내 급여.</li><li>resp-fq (★★): CAP·AECOPD 등 허가 적응 범위 내 급여.</li><li>colistin (★★★): 다제내성 그람음성(CRAB/CRPA/CRE) 감수성 근거 시 급여. 흡입 병용 가능.</li><li>tigecycline (★★★): 국내 허가 = 복잡성 피부·연조직 / 복잡성 복강내 / 지역사회획득 폐렴(CAP). HAP/VAP 허가·급여 제외.</li><li>novel-bl (★★★): MDR 그람음성 감수성 확인·단계조건 시 급여. cefiderocol: CRAB 확인 원내폐렴(HAP/VAP) 1차, 2차=카바페넴 실패/MDR녹농균·CRE(약평위 2025-09-04 급여 인정, 약가협상).</li><li>aminoglycoside (★★): 병용요법 성분으로 허가범위 내 급여.</li><li>ceftaroline (★★): 허가 적응 제한.</li><li>J12 바이러스 폐렴(NEC)</li><li>J13 폐렴연쇄구균 폐렴</li><li>J14 H. influenzae 폐렴</li><li>J15 세균성 폐렴 NEC</li><li>J16 기타 감염성 폐렴 NEC</li><li>J17* 달리 분류된 질환에서의 폐렴</li><li>J18 상세불명 병원체 폐렴</li><li>J69 고형물·액체에 의한 폐렴</li><li>J85 폐·종격동 농양</li><li>J86 농흉</li><li>J95.85 인공호흡기연관 폐렴(VAP)</li><li>B59 주폐포자충증(PCP)</li><li>U07 COVID-19</li></ul></section><section id="class-antibiotics"><h3>항생제 계열</h3><p>아미노페니실린, 항포도상 페니실린(MSSA), β-lactam/β-lactamase 억제제 복합, 1세대 세팔로스포린, 2세대 세팔로스포린, 3세대 세팔로스포린(주사), 3세대 세팔로스포린(경구), 4세대 세팔로스포린, 항녹농균 β-lactam, 항녹농균 BL/BLI, 카바페넴, 모노박탐, 마크로라이드, 호흡기 플루오로퀴놀론, 플루오로퀴놀론, 글리코펩타이드, 옥사졸리디논, 아미노글리코사이드, 폴리믹신, 글리실사이클린, 테트라사이클린, 린코사마이드, 니트로이미다졸, 신규 β-lactam/BLI(MDR 그람음성), 항MRSA 세팔로스포린, 뉴라미니다제 억제제, 항바이러스제, 엽산길항제(TMP-SMX 등)</p></section></div></noscript>

    const mdr = !!(r.prior_iv_abx_90d || r.septic_shock_onset || r.ards_before || r.acute_rrt || r.high_mdr_ward
      || (r.hospital_days != null && r.hospital_days >= 5));
    return { pseudomonas, mrsa, mdr };
  }

  const OUT = { computeSetting, computeRisks };
  if (typeof module !== "undefined" && module.exports) module.exports = OUT;
  else Object.assign(root, OUT);
})(typeof globalThis !== "undefined" ? globalThis : this);

/* engine/gate.js */
/* gate.js — GATE 실행. SPEC §5-2 C. action별 분류. */
(function (root) {
  const expr = (typeof require !== "undefined") ? require("./expr.js") : root;
  function runGates(GATES, ctx) {
    const out = { excludes: [], demotes: [], warns: [], infos: [] };
    for (const g of Object.values(GATES)) {
      let hit = false;
      try { hit = expr.evalExpr(g.when, ctx); } catch (e) { hit = false; }
      if (!hit) continue;
      const item = { gate: g.id, action: g.action, reason: g.reason, tag: g.tag || null,
        coexist: !!g.coexist, practice_note: g.practice_note || null, ref: g.ref };
      if (g.action === "EXCLUDE") out.excludes.push(item);
      else if (g.action === "DEMOTE") out.demotes.push(item);
      else if (g.action === "WARN") out.warns.push(item);
      else out.infos.push(item);

  else Object.assign(root, OUT);

/* engine/rank.js */
/* rank.js — 정렬. SPEC §5-2 D: grade_rank → LOE → 급여충족(삭감위험 낮음). */
(function (root) {
  const LOE = { "높음": 0, "high": 0, "중등도": 1, "moderate": 1, "낮음": 2, "low": 2, "매우낮음": 3, "very low": 3 };
  const RISK = { "★": 1, "★★": 2, "★★★": 3 };
  function rankRegimens(regs, notices) {
    return regs.slice().sort((a, b) => {
      const gr = (a.grade_rank || 9) - (b.grade_rank || 9); if (gr) return gr;
      const lo = (LOE[a.loe] ?? 9) - (LOE[b.loe] ?? 9); if (lo) return lo;
      return (worstRisk(a, notices) - worstRisk(b, notices));
    });
  }
  function worstRisk(reg, notices) {
    let w = 0; const s = JSON.stringify(reg);
    const m = s.match(/drug:[a-z0-9_]+/g) || [];
    for (const d of m) for (const n of Object.values(notices || {})) {
      if ((n.drugs || []).includes(d) || n.scope === d) w = Math.max(w, RISK[n.risk] || 0);
    }
    return w;
  }
  const OUT = { rankRegimens };
  if (typeof module !== "undefined" && module.exports) module.exports = OUT;
  else Object.assign(root, OUT);

/* engine/recommend.js */
/* recommend.js — 정문 오케스트레이션. SPEC §5.
 * 폐렴은 1차 이후 발산 → 본 엔진은 "경험적 시작 제안"에 집중하고,
 * 3축(균주 동정·기저질환·면역저하)의 고려사항을 함께 반환한다(개발자 방향, 08-14).
 */
(function (root) {
  const req = (typeof require !== "undefined");
  const DR = req ? require("../data/pneu_drugs.js") : root;
  const TY = req ? require("../data/pneu_types.js") : root;
  const RG = req ? require("../data/pneu_regimens.js") : root;
  const GA = req ? require("../data/pneu_gate.js") : root;
  const NO = req ? require("../data/pneu_notices.js") : root;
  const RC = req ? require("../data/pneu_rec.js") : root;
  const TH = req ? require("../data/pneu_thresholds.js") : root;
  const expr = req ? require("./expr.js") : root;
  const strat = req ? require("./stratify.js") : root;
  const gate = req ? require("./gate.js") : root;
  const rank = req ? require("./rank.js") : root;

  const DRUGS = DR.PNEU_DRUGS, CLASSES = DR.PNEU_CLASSES, TYPES = TY.PNEU_TYPES,
    REGIMENS = RG.PNEU_REGIMENS, GATES = GA.PNEU_GATES, NOTICES = NO.PNEU_NOTICES,
    REC = RC.PNEU_REC, THS = TH.PNEU_TH;

  const drugClass = (id) => (DRUGS[id] || {}).class || null;

  // 후보 약물/계열/mono계열 수집
  function collectCandidate(regs, risks) {
    const drugs = new Set(), classes = new Set(), mono = new Set();
    for (const reg of regs) {
      const clone = JSON.parse(JSON.stringify(reg));
      if (!risks.mrsa) delete clone.mrsa_if;                 // MRSA 커버는 위험시만 후보
      const ids = (JSON.stringify(clone).match(/drug:[a-z0-9_]+/g) || []);
      ids.forEach(d => { drugs.add(d); const c = drugClass(d); if (c) classes.add(c); });
      if (!reg.combo && Array.isArray(reg.options)) {
        for (const o of reg.options) {
          if (o.any_of && !o.base_any_of && !o.plus && !o.plus_if_atypical) {
            const cs = new Set(o.any_of.map(drugClass));
            if (cs.size === 1) mono.add([...cs][0]);
          }
        }
      }
    }
    if (risks.mrsa) { drugs.add("drug:vancomycin"); classes.add("class:glycopeptide"); }
    return { drugs, classes, monoClasses: mono };
  }

  // 헬퍼 컨텍스트(화이트리스트)
  function makeCtx(p, computed, cand) {
    const r = p.risk || {}, c = p.comorbid || [], mi = p.micro || {}, co = p.course || {}, cl = p.clinical || {}, sv = p.severity || {};
    const T = { setting: computed.setting, risks: computed.risks };
    const table = {
      type: a => p.type === a,
      has: a => c.includes(String(a).replace(/^comorbid:/, "")),
      special: a => (p.special || []).includes(a),
      severity_outpatient: () => T.setting === "outpatient",
      severity_ward: () => T.setting === "ward",
      severity_icu: () => T.setting === "icu",
      severity_severe: () => T.setting === "icu",
      pseudomonas_risk: () => T.risks.pseudomonas,
      mrsa_risk: () => T.risks.mrsa,
      mdr_risk: () => T.risks.mdr,
      recommend: a => cand && cand.drugs.has(a),
      recommend_class: a => cand && cand.classes.has(a),
      regimen_mono: a => cand && cand.monoClasses.has(a),
      tb_suspect: () => !!cl.tb_suspect,
      bacteremia: () => !!mi.bacteremia,
      mrsa_confirmed: () => !!mi.mrsa_confirmed,
      esbl_or_mdr_evidence: () => !!(mi.esbl_evidence || mi.mdr_evidence),
      susceptibility_documented: () => !!mi.susceptibility_documented,
      pseudomonas_confirmed_susceptible: () => !!mi.pseudomonas_confirmed_susceptible,
      culture_available: () => !!mi.culture_available,
      clinically_stable: () => !!co.clinically_stable,
      route_iv: () => co.route === "iv",
      days_since_start_gt3: () => (co.days_since_start || 0) > 3,
      duration_excess: () => co.duration_planned != null && co.duration_planned > 8,
      abscess: () => !!cl.abscess, empyema: () => !!cl.empyema, necrotizing: () => !!cl.necrotizing,
      prior_pseudomonas: () => !!r.prior_pseudomonas, recent_broad_abx: () => !!r.recent_broad_abx,
      recent_steroid: () => !!r.recent_steroid, post_influenza_necrotizing: () => !!r.post_influenza_necrotizing,
      prior_mrsa: () => !!r.prior_mrsa, ivdu: () => !!r.ivdu, recent_hospitalization: () => !!r.recent_hospitalization,
      prior_iv_abx_90d: () => !!r.prior_iv_abx_90d, septic_shock_at_onset: () => !!r.septic_shock_onset,
      ards_before: () => !!r.ards_before, hospital_days_ge5: () => (r.hospital_days || 0) >= 5,
      acute_rrt: () => !!r.acute_rrt, high_mdr_ward: () => !!r.high_mdr_ward,
      upper_lobe: () => !!cl.upper_lobe, cavitary: () => !!cl.cavitary, subacute: () => !!cl.subacute,
      tb_contact: () => !!cl.tb_contact, shock: () => !!sv.vasopressor
    };
    return { fn: (name, arg) => { const f = table[name]; return f ? !!f(arg) : false; } };
  }

  // 3축: 균주 동정 → 표적 카탈로그
  const PATHOGEN_MAP = {
    MRSA: "pneu:rg:target_mrsa", MSSA: "pneu:rg:target_mssa", PSEUDOMONAS: "pneu:rg:target_pseudomonas",
    ESBL: "pneu:rg:target_esbl", CRE: "pneu:rg:target_cre", CRAB: "pneu:rg:target_crab", LEGIONELLA: "pneu:rg:target_legionella"
  };

  const SPECIAL = { viral_influenza: "pneu:rg:influenza", viral_covid: "pneu:rg:covid", pcp: "pneu:rg:pcp", abscess: "pneu:rg:abscess", empyema: "pneu:rg:empyema" };

  function specialResult(p, rid) {
    const reg = REGIMENS[rid], t = TYPES[reg.type] || {};
    const drugs = new Set(JSON.stringify(reg).match(/drug:[a-z0-9_]+/g) || []);
    const classes = new Set([...drugs].map(drugClass).filter(Boolean));
    const reimb = [];
    for (const n of Object.values(NOTICES)) {
      if ((n.drugs || []).some(d => drugs.has(d)) || drugs.has(n.scope) || classes.has(n.scope)) reimb.push({ notice: n.id, basis: n.basis, cut: n.cut, risk: n.risk, verified: n.verified });
    }
    const comorb = p.comorbid || [];
    const axes = { pathogen: null, comorbidity: null, immunocompromise: null };
    if (rid === "pneu:rg:pcp" || comorb.includes("immunocompromise") || comorb.includes("neutropenia"))
      axes.immunocompromise = { escalated: true, gate: "pneu:gate:immunocompromise_escalate", considerations: ["경험적 스펙트럼 상향", "PCP(TMP-SMX)·CD4/면역상태", "곰팡이·CMV 동시 고려", "결핵 감별"] };
    return {
      types: [reg.type], setting: null, risks: {}, special: true,
      regimens: [{ id: reg.id, blocks: reg.blocks, keypoints: reg.keypoints, duration: reg.duration || null }],
      typeNotes: t.notes || null, typeDef: t.def || null,
      axes, flags: [], gates: [], reimb, duration: reg.duration || null, referrals: []
    };
  }

  function recommend(patient) {
    const p = patient || {};
    if (SPECIAL[p.type]) return specialResult(p, SPECIAL[p.type]);
    const setting = strat.computeSetting(p.severity);
    const risks = strat.computeRisks(p);
    const computed = { setting, risks };

    // SELECT: 유형·when 매칭 경험적 티어
    const ctxSel = makeCtx(p, computed, null);
    const selected = Object.values(REGIMENS).filter(reg => {
      if (reg.target) return false;                       // 표적 카탈로그는 축에서 처리
      if (reg.type && TYPES[reg.type] && p.type && reg.type !== ("pneu:type:" + p.type) && !reg.type.startsWith("pneu:special")) return false;
      try { return reg.when ? expr.evalExpr(reg.when, ctxSel) : false; } catch (e) { return false; }
    });

    // GATE
    const cand = collectCandidate(selected, risks);
    // CAP 녹농균 위험 addon → 항녹농 약제를 후보에 편입(급여 배지·게이트 연동)
    if (p.type === "cap" && risks.pseudomonas) {
      ["drug:piperacillin_tazobactam", "drug:cefepime", "drug:ciprofloxacin"].forEach(d => { cand.drugs.add(d); const c = drugClass(d); if (c) cand.classes.add(c); });
    }
    const ctxGate = makeCtx(p, computed, cand);
    const gates = gate.runGates(GATES, ctxGate);

    // EXCLUDE 반영(후보 제거 표시) + RANK
    const ranked = rank.rankRegimens(selected, NOTICES);

    // 3축
    const axes = { pathogen: null, comorbidity: null, immunocompromise: null };
    const pk = (p.micro && p.micro.pathogen ? String(p.micro.pathogen).toUpperCase().replace(/[^A-Z]/g, "") : "");
    for (const key of Object.keys(PATHOGEN_MAP)) if (pk.includes(key)) {
      axes.pathogen = { pathogen: p.micro.pathogen, target: PATHOGEN_MAP[key], regimen: REGIMENS[PATHOGEN_MAP[key]] }; break;
    }
    const comorb = p.comorbid || [];
    if (comorb.length) {
      const mods = [];
      if (comorb.includes("bronchiectasis") || comorb.includes("copd") || comorb.includes("copd_severe")) mods.push({ comorbid: "copd/기관지확장증", effect: "녹농균 위험 → 항녹농 스펙트럼 고려", rule: "pneu:rule:pseudomonas_risk" });
      if (comorb.includes("ckd")) mods.push({ comorbid: "ckd", effect: "신배설 항생제 용량조절(vancomycin/aminoglycoside/colistin)" });
      if (comorb.includes("cirrhosis")) mods.push({ comorbid: "간경변", effect: "간독성·출혈 주의, 감수성 확인" });
      if (comorb.includes("dm")) mods.push({ comorbid: "당뇨", effect: "중증화 위험, 혼합감염 고려" });
      axes.comorbidity = { present: comorb, modifiers: mods };
    }
    if (comorb.includes("immunocompromise") || comorb.includes("neutropenia") || comorb.includes("hiv")) {
      axes.immunocompromise = {
        escalated: true, gate: "pneu:gate:immunocompromise_escalate",
        considerations: ["경험적 스펙트럼 상향(항녹농 ± MRSA)", "PCP(TMP-SMX) 감별·CD4/면역상태", "곰팡이(아스페르길루스)·CMV 동시 고려", "결핵 감별"]
      };
    }

    // reimb 요지(선택 후보 관련 고시)
    const reimb = [];
    for (const n of Object.values(NOTICES)) {
      const rel = (n.drugs || []).some(d => cand.drugs.has(d)) || cand.drugs.has(n.scope) || cand.classes.has(n.scope);
      if (rel) reimb.push({ notice: n.id, basis: n.basis, cut: n.cut, risk: n.risk, verified: n.verified });
    }

    var tnode = TYPES["pneu:type:" + p.type] || {};
    return {
      types: [p.type ? "pneu:type:" + p.type : null].filter(Boolean),
      setting: (p.type === "cap" ? setting : null),   // 중증도도구(CURB-65/PSI)는 CAP 전용
      risks, typeNotes: tnode.notes || null, typeDef: tnode.def || null,
      regimens: ranked.map(r => ({
        id: r.id, grade: r.grade, loe: r.loe, grade_rank: r.grade_rank,
        options: r.options || r, stance: r.stance || null, duration: r.duration || null
      })),
      axes,
      flags: gates.warns.concat(gates.infos),
      gates: gates.excludes.concat(gates.demotes),
      reimb,
      referrals: gates.warns.filter(w => /결핵/.test(w.reason || "")).map(w => ({ reason: w.reason, ref: w.ref }))
    };
  }

  const OUT = { recommend, makeCtx, collectCandidate };
  if (typeof module !== "undefined" && module.exports) module.exports = OUT;
  else Object.assign(root, OUT);
})(typeof globalThis !== "undefined" ? globalThis : this);

<script>
/* app.js — 폐렴 앱 뷰 로직. 정본 카드 문법(clin/pay/care). 엔진 recommend() 불변 소비. */
(function () {

  var dn = function (id) { return (DRUGS[id] || {}).ko || String(id).replace("drug:", ""); };
  var joinD = function (arr, sep) { return (arr || []).map(dn).join(sep || " 또는 "); };

        (b.drugs ? '<div class="bd">' + joinD(b.drugs, " · ") + "</div>" : "") +

    }).join("");

    var h = t.def ? '<div class="note" style="padding:0 0 6px">' + esc(t.def) + "</div>" : "";
    (t.regimens || []).forEach(function (rid) { if (REG[rid]) h += fmtRegimen(REG[rid]); });
    if (t.notes) h += '<div class="subttl">핵심 노트</div>' + fmtKeypoints(t.notes);

  }

    Object.values(DRUGS).forEach(function (d) { (byClass[d.class] = byClass[d.class] || []).push(d); });
    var rows = "";
    Object.values(CL).forEach(function (c) {

      rows += '<tr><th class="rowhead" colspan="3">' + esc(c.ko) + "</th></tr>";
      ds.forEach(function (d) {
        var risk = d.reimb ? ((NOTICES[d.reimb] || {}).risk || "") : "";
        rows += "<tr><td>" + esc(d.ko) + '</td><td class="en">' + esc(d.en || "") + '</td><td class="rk">' + esc(risk) + "</td></tr>";
      });

    return '<table class="drugtbl"><thead><tr><th>성분</th><th>영문</th><th>급여</th></tr></thead><tbody>' + rows + "</tbody></table>";
  }

  /* ---------- 탭 ---------- */
  ["lib", "sim", "flow"].forEach(function (t) {
    el("tab-" + t).addEventListener("click", function () {
      ["lib", "sim", "flow"].forEach(function (o) {
        el("tab-" + o).classList.toggle("on", o === t);
        el("pane-" + o).classList.toggle("on", o === t);
      });
    });
  });

  /* ---------- 환자 상태 ---------- */
  var P = { type: null, special: [], severity: {}, risk: {}, comorbid: [], micro: {}, course: {}, clinical: {} };

  /* ---------- 플로우 대분류 트리 ---------- */
  var TYPE_CHIPS = [["cap", "CAP", "지역사회획득"], ["hap", "HAP", "병원획득 >48h"], ["vap", "VAP", "인공호흡기 >48h"], ["aspiration", "흡인성", "흡인 위험군"]];
  var SETTING_CHIPS = [["outpatient", "외래"], ["ward", "병동"], ["icu", "중환자실"]];
  var COMORB_CHIPS = [["copd", "COPD"], ["bronchiectasis", "기관지확장증"], ["ckd", "CKD"], ["dm", "당뇨"],
    ["cirrhosis", "간경변"], ["immunocompromise", "면역저하"], ["neutropenia", "호중구감소"]];
  var PATH_CHIPS = [["", "미동정"], ["MRSA", "MRSA"], ["MSSA", "MSSA"], ["PSEUDOMONAS", "녹농균"],

  var RISK_LABEL = { pseudomonas: "녹농균 위험", mrsa: "MRSA 위험", mdr: "MDR 위험(최근IV·입원≥5d)", tb: "결핵 의심",
    culture: "배양 시행", stable: "임상 안정", iv: "정맥 투여중", abscess: "폐농양", empyema: "농흉", necrotizing: "괴사성" };

  function riskChipsFor(t) {
    if (t === "cap") return ["pseudomonas", "mrsa", "tb", "culture", "stable", "iv"];
    if (t === "hap" || t === "vap") return ["mdr", "mrsa", "pseudomonas", "culture", "stable", "iv"];

  }
  function toggleArr(arr, v, on) { var i = arr.indexOf(v); if (on && i < 0) arr.push(v); if (!on && i >= 0) arr.splice(i, 1); }

  function accSec(id, num, title, hint, openIt) {
    return '<details class="accSec"' + (openIt ? " open" : "") + '><summary><span class="arw">▸</span>' + num + ". " + title +
      '<span class="sel none" id="sel_' + id + '">미선택</span></summary><div class="abody">' +
      (hint ? '<div class="hint">' + hint + "</div>" : "") + '<div id="cg' + id + '" class="chips"></div></div></details>';
  }

  var SPECIAL_CHIPS = [["viral_influenza", "인플루엔자"], ["viral_covid", "COVID-19"], ["pcp", "PCP"], ["abscess", "폐농양"], ["empyema", "농흉"]];
  var SPECIAL_SET = { viral_influenza: 1, viral_covid: 1, pcp: 1, abscess: 1, empyema: 1 };

  function buildFlowInputs() {
    el("flowInputs").innerHTML =
      '<div class="acc-top"><div class="gl">1. 폐렴 유형 · 대분류 (택1)</div><div id="typeBtns" class="typebtns"></div></div>' +
      '<div class="acc-top"><div class="gl">특수 · 바이러스</div><div id="specialBtns" class="typebtns"></div></div>' +
      '<div id="ctxSections"></div>';
    mkTypeBtns("typeBtns", TYPE_CHIPS);
    mkTypeBtns("specialBtns", SPECIAL_CHIPS);
  }
  function mkTypeBtns(host, list) {
    var h = el(host);
    list.forEach(function (t) {
      var b = document.createElement("button"); b.className = "typebtn"; b.dataset.v = t[0];
      b.innerHTML = esc(t[1]) + (t[2] ? '<span class="td">' + esc(t[2]) + "</span>" : "");
      b.addEventListener("click", function () {
        ["typeBtns", "specialBtns"].forEach(function (g) { Array.prototype.forEach.call(el(g).children, function (c) { c.classList.remove("on"); }); });
        b.classList.add("on"); P.type = t[0]; onTypeChange();
      });
      h.appendChild(b);
    });
  }

  function onTypeChange() {
    P.severity = {}; P.risk = {}; P.clinical = {}; P.micro = { pathogen: null }; P.course = {}; P.comorbid = [];
    var t = P.type, s = "";
    if (SPECIAL_SET[t]) {
      s += accSec("Com", 4, "기저질환 · 면역상태", "면역저하(스테로이드·이식·HIV·호중구감소)면 PCP·곰팡이·CMV 감별 및 스펙트럼 상향.", true);
      el("ctxSections").innerHTML = s;
      mkChips("cgCom", COMORB_CHIPS, "multi", function (v, on) { toggleArr(P.comorbid, v, on); });
      render(); return;
    }
    if (t === "cap") s += accSec("Set", 2, "중증도", "CURB-65/PSI 기반 진료환경. 외래→병동→ICU로 경험적 강도가 올라갑니다.", true);
    var rtitle = (t === "cap") ? "위험 인자" : (t === "aspiration") ? "병변 성격" : "MDR·내성 위험";
    var rhint = (t === "cap") ? "녹농균·MRSA·결핵 의심에 따라 스펙트럼을 조정합니다."
      : (t === "aspiration") ? "농양·농흉·괴사 시에만 혐기성 커버를 추가(단순 흡인은 불필요)."
        : "최근 IV항생제·입원≥5d·쇽 등 MDR 신호를 표시합니다.";
    s += accSec("Risk", 3, rtitle, rhint, t !== "cap");
    s += accSec("Com", 4, "기저질환", "동반질환에 따른 위험·용량 고려.", false);
    s += accSec("Path", 5, "균주 동정", "배양 확인 시 표적치료로 전환(1차 이후 축).", false);
    el("ctxSections").innerHTML = s;
    if (t === "cap") mkChips("cgSet", SETTING_CHIPS, "single", function (v) { P.severity.setting = v; });
    mkChips("cgRisk", riskChipsFor(t).map(function (k) { return [k, RISK_LABEL[k]]; }), "multi", function (v, on) { applyRisk(v, on); });
    mkChips("cgCom", COMORB_CHIPS, "multi", function (v, on) { toggleArr(P.comorbid, v, on); });
    mkChips("cgPath", PATH_CHIPS, "single", function (v) { P.micro.pathogen = v || null; });
    render();
  }

  function updateSel() {
    function set(id, txt) { var e = el("sel_" + id); if (!e) return; var none = !txt; e.textContent = none ? "미선택" : txt; e.classList.toggle("none", none); }
    set("Set", P.severity.setting ? ({ outpatient: "외래", ward: "병동", icu: "중환자실" })[P.severity.setting] : "");
    var rk = [];
    if (P.risk.pseudomonas) rk.push("녹농균"); if (P.risk.mrsa) rk.push("MRSA"); if (P.risk.prior_iv_abx_90d) rk.push("MDR");
    if (P.clinical.tb_suspect) rk.push("결핵의심"); if (P.clinical.abscess) rk.push("폐농양"); if (P.clinical.empyema) rk.push("농흉"); if (P.clinical.necrotizing) rk.push("괴사");
    if (P.micro.culture_available) rk.push("배양"); if (P.course.clinically_stable) rk.push("안정"); if (P.course.route === "iv") rk.push("IV");
    set("Risk", rk.join(", "));
    set("Com", P.comorbid.map(function (c) { var f = COMORB_CHIPS.filter(function (x) { return x[0] === c; })[0]; return f ? f[1] : c; }).join(", "));
    set("Path", P.micro.pathogen || "");
  }

  function mkChips(host, list, mode, cb) {
    var h = el(host); h.innerHTML = "";
    list.forEach(function (it) {
      var b = document.createElement("div"); b.className = "chip"; b.textContent = it[1];
      b.addEventListener("click", function () {
        if (mode === "single") {
          Array.prototype.forEach.call(h.children, function (c) { c.classList.remove("on"); });
          b.classList.add("on"); cb(it[0], true);
        } else {
          var on = !b.classList.contains("on"); b.classList.toggle("on", on); cb(it[0], on);
        }
        render();
      });
      h.appendChild(b);
    });
  }

  /* ---------- 요법 포맷 ---------- */
  function fmtRegimen(orig) {
    if (!orig) return "";
    if (orig.blocks) return fmtBlocks(orig.blocks) + fmtKeypoints(orig.keypoints);
    if (orig.combo) {
      var parts = [];
      if (orig.base_any_of) parts.push(joinD(orig.base_any_of));
      if (orig.antipseudomonal_betalactam_any_of) parts.push("[항녹농 β-lactam: " + joinD(orig.antipseudomonal_betalactam_any_of, " / ") + "] 중 1");
      if (orig.plus_one_of) parts.push("＋ [" + joinD(orig.plus_one_of, " / ") + "] 중 1");
      if (orig.mrsa_if) parts.push("(＋MRSA 위험 시: " + joinD(orig.mrsa_if.any_of, " / ") + ")");
      var extra = orig.legionella_cover ? '<div class="od">· 레지오넬라 커버 포함</div>' : "";
      return '<div class="opt"><div class="ol">병용 요법</div><div class="od">' + esc(parts.join(" ")) + "</div>" + extra + "</div>";
    }
    if (orig.options) {
      return orig.options.map(function (o) {
        var line = "";
        if (o.any_of) line = joinD(o.any_of);
        else if (o.base_any_of) line = joinD(o.base_any_of) + (o.plus_if_atypical ? " (± " + joinD(o.plus_if_atypical, "/") + " 비정형시)" : "") + (o.plus ? " ＋ " + joinD(o.plus, "/") : "");
        var stc = o.stance ? '<div class="stc"><span class="g">가이드</span> ' + esc(o.stance.guideline) + '<br><span class="p">실사용</span> ' + esc(o.stance.practice) + "</div>" : "";
        return '<div class="opt"><div class="ol">' + esc(o.label) + '</div><div class="od">' + esc(line) + "</div>" + stc + "</div>";
      }).join("");
    }
    // 표적(first/alt)
    if (orig.first) {
      var s = '<div class="opt"><div class="ol">1차</div><div class="od">' + joinD(orig.first) + "</div>";
      if (orig.alt) s += '<div class="od">대체: ' + joinD(orig.alt) + "</div>";
      if (orig.stance) s += '<div class="stc"><span class="g">가이드</span> ' + esc(orig.stance.guideline) + '<br><span class="p">실사용</span> ' + esc(orig.stance.practice) + "</div>";
      if (orig.note) s += '<div class="od">· ' + esc(orig.note) + "</div>";
      return s + "</div>";
    }
    return "";
  }

  function card(cls, ic, title, tag, bodyHtml) {
    return '<div class="card ' + cls + '"><div class="ch"><span class="ic">' + ic + "</span>" + esc(title) +
      (tag ? '<span class="tag">' + esc(tag) + "</span>" : "") + '</div><div class="cb">' + bodyHtml + "</div></div>";
  }

  /* ---------- 렌더 ---------- */
  function renderResult(res, hostId) {
    var host = el(hostId); host.innerHTML = "";
    if (!res || !res.types.length) { if (hostId === "stream") el("empty").style.display = "block"; return; }
    if (hostId === "stream") el("empty").style.display = "none";
    var html = "";

    if (res.special) {
      var sr = res.regimens[0], stn = (TYPES[res.types[0]] || {}).ko || "";
      var sbody = (res.typeDef ? '<div class="note" style="padding:0 0 8px">' + esc(res.typeDef) + "</div>" : "") + fmtBlocks(sr.blocks) + fmtKeypoints(sr.keypoints);
      html += card("clin", "🧬", stn + " — 프로토콜", null, sbody);
    } else {
      var body = "";
      if (res.regimens.length) {
        res.regimens.forEach(function (r) {
          var orig = REG[r.id];
          var tname = (TYPES[orig.type] || {}).ko || "";
          body += '<div class="subttl">' + esc(tname || r.id) + (r.grade ? " · 권고 " + esc(r.grade) + (r.loe ? "/" + esc(r.loe) : "") : "") + "</div>";
          body += fmtRegimen(orig);
          if (orig.stance) body += '<div class="opt"><div class="stc"><span class="g">가이드</span> ' + esc(orig.stance.guideline) + '<br><span class="p">실사용</span> ' + esc(orig.stance.practice) + "</div></div>";
        });
      } else body = '<div class="note">해당 유형·상황에 매칭된 경험적 티어가 없습니다. 입력을 확인하세요.</div>';
      html += card("clin", "💊", "경험적 시작 제안", "1차", body);
      if (res.typeNotes) html += card("care", "📌", "유형 핵심 노트", null, fmtKeypoints(res.typeNotes));
    }

    // 2) 안전 게이트 (EXCLUDE=hard, WARN=soft)
    var conf = "";
    res.gates.forEach(function (g) {
      if (g.action === "EXCLUDE") conf += '<div class="conflict hard"><span class="ci">⛔</span><div><b>금기</b> · ' + esc(g.reason) + "</div></div>";
      else if (g.action === "DEMOTE") conf += '<div class="conflict soft"><span class="ci">▼</span><div><b>강등</b> · ' + esc(g.reason) + "</div></div>";
    });
    res.flags.forEach(function (g) {
      if (g.action === "WARN") conf += '<div class="conflict soft"><span class="ci">⚠️</span><div>' + esc(g.reason) + (g.practice_note ? '<br><span style="color:var(--care)">실사용: ' + esc(g.practice_note) + "</span>" : "") + "</div></div>";
    });
    if (conf) html += card("clin", "🚦", "안전·주의 게이트", null, conf);

    // 3) 급여·삭감 (pay)
    if (res.reimb.length) {
      var rb = '<div class="drugclass-box">';
      res.reimb.forEach(function (n) {
        rb += '<div class="dc-row dc-reimb"><span class="dc-k">' + esc(n.risk || "-") + '</span><span class="dc-v"><b>' + esc(n.notice.replace("notice:hira-", "")) + "</b> — " + esc(n.basis) +
          (n.cut ? '<br><span style="color:var(--warn)">삭감: ' + esc((n.cut || []).join(" / ")) + "</span>" : "") +
          (n.verified === false ? ' <span style="color:var(--ink-faint)">(재검증 대상)</span>' : "") + "</span></div>";
      });
      rb += "</div>";
      html += card("pay", "💰", "급여 · 삭감 위험", "HIRA", rb);
    }

    // 4) 3축 고려 (care)
    var ax = res.axes, axb = "";
    if (ax.pathogen) {
      var tr = ax.pathogen.regimen;
      axb += '<div class="subttl">균주 동정 → 표적</div><div class="drugclass-box"><div class="dc-row dc-feat"><span class="dc-k">' + esc(ax.pathogen.pathogen) + '</span><span class="dc-v">1차 ' + joinD(tr.first) + (tr.alt ? " / 대체 " + joinD(tr.alt) : "") + (tr.note ? "<br>· " + esc(tr.note) : "") + "</span></div></div>";
    }
    if (ax.comorbidity && ax.comorbidity.modifiers.length) {
      axb += '<div class="subttl">기저질환 고려</div><div class="drugclass-box">';
      ax.comorbidity.modifiers.forEach(function (m) { axb += '<div class="dc-row"><span class="dc-k">' + esc(m.comorbid) + '</span><span class="dc-v">' + esc(m.effect) + "</span></div>"; });
      axb += "</div>";
    }
    if (ax.immunocompromise) {
      axb += '<div class="subttl">면역저하 고려 (스펙트럼 상향)</div><div class="drugclass-box">';
      ax.immunocompromise.considerations.forEach(function (c, i) { axb += '<div class="dc-row"><span class="dc-k">' + (i + 1) + '</span><span class="dc-v">' + esc(c) + "</span></div>"; });
      axb += "</div>";
    }
    if (axb) html += card("care", "🧭", "1차 이후 고려 — 균주·기저·면역저하", null, axb);

    // 5) 기간
    var durTh = res.duration || (res.regimens[0] && REG[res.regimens[0].id] ? REG[res.regimens[0].id].duration : null);
    var TH = W.PNEU_TH || {};
    if (durTh && TH[durTh]) {
      var dv = (TH[durTh].values || []).map(function (v) { return v.ctx + ": " + v.val; }).join(" · ");
      html += card("care", "⏱️", "치료기간", null, '<div class="note" style="padding:0">' + esc(dv) + "</div>");
    }
    host.innerHTML = html;
  }

  function render() { updateSel(); renderResult(W.recommend(P), "stream"); }

  /* ---------- 도서관 ---------- */
  function buildLibrary() {
    var items = [];
    // 유형
    Object.values(TYPES).forEach(function (t) {
      if (!t.regimens) return;
      items.push({ cat: "유형", title: t.emoji + " " + t.ko, kw: t.ko + " " + (t.def || ""), html: fmtType(t) });
    });
    // 원인균 표적
    Object.values(REG).forEach(function (r) {
      if (!r.target) return;
      items.push({ cat: "균주표적", title: "🦠 " + r.target, kw: r.target, html: fmtRegimen(r) });
    });
    // 급여·삭감
    Object.values(NOTICES).forEach(function (n) {
      if (n.scope === "all-antibiotics") return;
      var b = '<div class="drugclass-box"><div class="dc-row dc-reimb"><span class="dc-k">' + esc(n.risk || "-") + '</span><span class="dc-v">' + esc(n.basis) + "</span></div>" +
        (n.cut ? '<div class="dc-row dc-contra"><span class="dc-k">삭감</span><span class="dc-v">' + esc((n.cut || []).join(" / ")) + "</span></div>" : "") +
        (n.warn ? '<div class="dc-row"><span class="dc-k">경고</span><span class="dc-v">' + esc(n.warn) + "</span></div>" : "") + "</div>";
      items.push({ cat: "급여", title: "💰 " + n.id.replace("notice:hira-", ""), kw: n.id + " " + n.basis, html: b });
    });
    // 약물(계열별)
    var byClass = {};
    Object.values(DRUGS).forEach(function (d) { (byClass[d.class] = byClass[d.class] || []).push(d); });
    (W.PNEU_CLASSES ? Object.values(W.PNEU_CLASSES) : []).forEach(function (c) {
      var ds = byClass[c.id]; if (!ds) return;
      var b = '<div class="drugclass-box">' + ds.map(function (d) { return '<div class="dc-row"><span class="dc-k">' + esc(d.ko) + '</span><span class="dc-v">' + esc(d.en || "") + (d.reimb ? ' <span class="riskbadge">' + esc((NOTICES[d.reimb] || {}).risk || "") + "</span>" : "") + (d.note ? "<br>· " + esc(d.note) : "") + "</span></div>"; }).join("") + "</div>";
      items.push({ cat: "약물", title: "💊 " + c.ko, kw: c.ko + " " + ds.map(function (d) { return d.ko + d.en; }).join(" "), html: b });
    });
    W._LIB = items; W._DRUGTABLE = drugTable(); renderLib("");
  }
  var CAT_META = { "유형": ["🫁", "폐렴 유형"], "균주표적": ["🦠", "원인균 표적치료"], "약물": ["💊", "항생제 계열"], "급여": ["💰", "급여 · 삭감"] };
  var CAT_ORDER = ["유형", "균주표적", "약물", "급여"];
  function renderLib(q) {
    q = (q || "").toLowerCase();
    var host = el("libGrid"); host.innerHTML = "";
    if (q) {   // 검색: 매칭 항목 인라인(펼침)
      var matches = (W._LIB || []).filter(function (it) { return (it.title + it.kw).toLowerCase().indexOf(q) >= 0; });
      if (!matches.length) { host.innerHTML = '<div class="note">검색 결과 없음</div>'; return; }
      matches.forEach(function (it) {
        var d = document.createElement("details"); d.className = "libItem"; d.open = true;
        d.innerHTML = '<summary><span class="cat">' + esc((CAT_META[it.cat] || [])[1] || it.cat) + "</span>" + esc(it.title) + '</summary><div class="body">' + it.html + "</div>";
        host.appendChild(d);
      });
      return;
    }
    CAT_ORDER.forEach(function (cat) {   // 기본: 대분류 버튼 → 클릭 시 슬라이드-업 시트
      var meta = CAT_META[cat];
      var items = (W._LIB || []).filter(function (it) { return it.cat === cat; });
      if (!items.length) return;
      var count = (cat === "약물") ? Object.keys(DRUGS).length : items.length;
      var b = document.createElement("button"); b.className = "librow";
      b.innerHTML = meta[0] + " " + esc(meta[1]) + '<span class="lc">' + count + "개</span>";
      b.addEventListener("click", function () {
        if (cat === "약물") openSheet(meta[0] + " " + esc(meta[1]), W._DRUGTABLE);
        else openSheet(meta[0] + " " + esc(meta[1]),
          items.map(function (it) { return '<details class="libItem"><summary>' + esc(it.title) + '</summary><div class="body">' + it.html + "</div></details>"; }).join(""));
      });
      host.appendChild(b);
    });
  }
  el("libSearch").addEventListener("input", function (e) { renderLib(e.target.value); });

  /* ---------- 시뮬레이션 프리셋 ---------- */
  var PRESETS = [
    { label: "CAP 외래 경증", d: "젊음·동반질환 없음", p: { type: "cap", severity: { setting: "outpatient", age: 40 }, comorbid: [] } },
    { label: "CAP 병동 중등도", d: "CURB-65 2, 동반 COPD", p: { type: "cap", severity: { setting: "ward" }, comorbid: ["copd"] } },
    { label: "CAP 중환자실 + 녹농균 위험", d: "기계환기, 기관지확장증", p: { type: "cap", severity: { setting: "icu", mech_vent: true }, comorbid: ["bronchiectasis"], risk: {} } },
    { label: "HAP 고위험(MDR) + MRSA", d: "최근 IV항생제·입원, 배양 전", p: { type: "hap", risk: { prior_iv_abx_90d: true, mrsa: true }, micro: { culture_available: false } } },
    { label: "VAP + CRAB 동정", d: "colistin 경과, 흡입 고려", p: { type: "vap", risk: { hospital_days: 8 }, micro: { pathogen: "CRAB", culture_available: true }, course: { days_since_start: 4 } } },
    { label: "면역저하 CAP", d: "장기 스테로이드", p: { type: "cap", severity: { setting: "ward" }, comorbid: ["immunocompromise"] } },
    { label: "흡인성 폐렴", d: "혐기성 루틴 불필요 안내", p: { type: "aspiration" } },
    { label: "COVID-19 폐렴(산소요구)", d: "저산소 → dexamethasone·remdesivir", p: { type: "viral_covid" } },
    { label: "면역저하 PCP", d: "TMP-SMX + 보조 스테로이드", p: { type: "pcp", comorbid: ["immunocompromise"] } }
  ];
  function buildSim() {
    var host = el("simBtns"); host.innerHTML = "";
    PRESETS.forEach(function (ps) {
      var b = document.createElement("button"); b.className = "simbtn";
      b.innerHTML = "<div>" + esc(ps.label) + '</div><div class="d">' + esc(ps.d) + "</div>";
      b.addEventListener("click", function () {
        var saved = P; P = JSON.parse(JSON.stringify(Object.assign({ type: null, special: [], severity: {}, risk: {}, comorbid: [], micro: {}, course: {}, clinical: {} }, ps.p)));
        renderResult(W.recommend(P), "simStream");
        var out = el("simStream").innerHTML; el("simStream").innerHTML = ""; P = saved;
        openSheet("🎬 " + esc(ps.label), out);
      });
      host.appendChild(b);
    });
  }

  /* ---------- 출처 배너 ---------- */
  function buildSrc() {
    el("srcbanner").innerHTML = Object.values(GL).map(function (g) {
      return '<a href="' + esc(g.url) + '" target="_blank" rel="noopener">📘 ' + esc(g.title) + " (" + g.year + ")</a>";
    }).join("<br>");
  }

  buildFlowInputs(); buildLibrary(); buildSim(); buildSrc();
})();

</script>
<!--BACK_TRAP_V4-->
<script>
/* 공용 뒤로가기 트랩 v4 (build.js 자동 주입) — 뒤로가기 시 열린 팝업을 닫거나, 없으면 "‹ 도서관/돌아가기/목록으로" 뷰-백 실행.
   둘 다 없으면 정상 이탈. 앱 내부 함수명을 몰라도 DOM 레벨로 동작. */
(function(){
  "use strict";
  if(window.__backTrapInstalled) return; window.__backTrapInstalled=true;
  var armed=false, consuming=false, baseline=null, backTrapOK=true, lastSched=-1;
  var SHOW_CLASSES=['on','open','active','show','visible','is-open','opened','shown','in'];
  function inView(el){
    var r=el.getBoundingClientRect();
    var iw=Math.min(r.right,innerWidth)-Math.max(r.left,0);
    var ih=Math.min(r.bottom,innerHeight)-Math.max(r.top,0);
    if(iw<=0||ih<=0) return false;
    return iw>=innerWidth*0.5 && (iw*ih)>=innerWidth*innerHeight*0.22;
  }
  function znum(s){ var z=parseInt(s.zIndex,10); return isNaN(z)?0:z; }
  function candidates(){
    var out=[], body=document.body; if(!body) return out;
    var all=body.getElementsByTagName('*');
    for(var i=0;i<all.length;i++){
      var el=all[i];
      if(el.id==='portal-hdr') continue;
      var s=getComputedStyle(el);
      if(s.position!=='fixed' && s.position!=='absolute') continue;
      if(s.display==='none'||s.visibility==='hidden'||parseFloat(s.opacity||'1')<0.05) continue;
      if(znum(s) < 10) continue;
      if(!inView(el)) continue;
      out.push(el);
    }
    return out;
  }
  function overlays(){ if(!baseline) return []; return candidates().filter(function(el){ return !baseline.has(el); }); }
  function isVisible(el){
    var s=getComputedStyle(el); if(s.display==='none'||s.visibility==='hidden'||parseFloat(s.opacity||'1')<0.05) return false;
    var r=el.getBoundingClientRect(); return r.width>4 && r.height>4 && r.bottom>0 && r.top<innerHeight;
  }
  var BACK_ARROW=/[\u2039\u2190\u25C0\u27E8\u276E<]/;
  function looksBack(t){
    if(!t) return false; t=t.replace(/\s+/g,' ').trim(); if(t.length>16) return false;
    if(/\uB3CC\uC544\uAC00\uAE30/.test(t)) return true;            // 돌아가기
    if(/\uBAA9\uB85D\uC73C\uB85C/.test(t)) return true;            // 목록으로
    if(/\uB3C4\uC11C\uAD00/.test(t) && BACK_ARROW.test(t)) return true;  // 도서관 + 화살표
    if(BACK_ARROW.test(t) && /\uBAA9\uB85D|\uB9AC\uC2A4\uD2B8|\uCC98\uC74C|home/i.test(t)) return true;
    return false;
  }
  function backControl(){
    var nodes=document.body.querySelectorAll('[onclick],a,button,[role=button]');
    for(var i=0;i<nodes.length;i++){
      var el=nodes[i];
      if(el.id==='portal-hdr'||el.closest('#portal-hdr')) continue;
      if(!isVisible(el)) continue;
      if(looksBack(el.textContent||'')) return el.closest('[onclick],a,button,[role=button]')||el;
    }
    return null;
  }
  function closeTarget(){
    if(overlays().length>0) return {type:'overlay'};
    if(backTrapOK){ var b=backControl(); if(b) return {type:'back', el:b}; }
    return null;
  }
  function appClosers(){
    var bad={close:1,closed:1,stop:1,print:1,open:1,opener:1,focus:1,blur:1,alert:1,confirm:1,prompt:1};
    var fns=[];
    for(var k in window){
      try{ if(/^(close|hide|dismiss)/i.test(k) && !bad[k] && typeof window[k]==='function' && window[k].length===0 && (''+window[k]).indexOf('[native code]')<0) fns.push(window[k]); }catch(e){}
    }
    try{ if(typeof window.close==='function' && (''+window.close).indexOf('[native code]')<0) fns.push(window.close); }catch(e){}
    return fns;
  }
  function closeOverlays(){
    appClosers().forEach(function(fn){ try{fn.call(window);}catch(e){} });
    overlays().forEach(function(el){ SHOW_CLASSES.forEach(function(c){ el.classList.remove(c); }); });
    try{ if(!overlays().length) document.body.style.overflow=''; }catch(e){}
  }
  function refreshOnce(){
    var has=!!closeTarget();
    if(has && !armed){ armed=true; try{history.pushState({backTrap:1},'');}catch(e){} }
    else if(!has && armed && !consuming){ consuming=true; try{history.back();}catch(e){} }
  }
  function schedule(){
    var t=(window.performance&&performance.now)?performance.now():+new Date();
    if(lastSched>=0 && t-lastSched<80) return; lastSched=t;
    [0,100,250,450,700].forEach(function(d){ setTimeout(refreshOnce,d); });
  }
  window.addEventListener('popstate', function(){
    if(consuming){ consuming=false; armed=false; return; }
    var tgt=closeTarget();
    if(tgt){
      armed=false;
      if(tgt.type==='overlay') closeOverlays();
      else if(tgt.el){ try{tgt.el.click();}catch(e){} }
      schedule();
    } else { armed=false; }
  });
  function init(){
    baseline=new WeakSet();
    candidates().forEach(function(el){ baseline.add(el); });
    backTrapOK = (backControl()===null);
    var mo=new MutationObserver(schedule);
    mo.observe(document.body,{subtree:true,attributes:true,attributeFilter:['class','style','hidden'],childList:true});
    document.addEventListener('click',function(){ schedule(); },true);
    window.addEventListener('resize',schedule);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ setTimeout(init,80); });
  else setTimeout(init,80);
})();
</script>

</body></html>
