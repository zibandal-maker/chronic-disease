<noscript><div class="seo-content"><h2>장염·급성 위장관염 처방·수분요법·위험 사인·피해야 할 것들 (임상의용)</h2><p>장염(급성 위장관염·감염성 설사)의 탈수 평가와 경구수액(ORS) 1차 요법, 항생제 적응 판단(대부분 물설사는 불필요, STEC는 항생제 금지·HUS 위험, 이질·여행자 고열·면역저하 혈변은 적응, 균별 표적), 위험 사인·외과적 복증 의뢰(충수염·장중첩·복막염·중증탈수·HUS), 피해야 할 지뢰(loperamide 금기·경증 주사 남용·정장제 비급여), 심평원 주사 처방률·정장생균제 급여를 제공한다.</p><section id="type-viral"><h3>바이러스성 위장관염(노로·로타)</h3><p>가장 흔한 급성 위장관염. 자연 호전. 치료의 핵심은 항생제가 아니라 수분·전해질 보충. ORS 1차. 소량씩 자주(5–10 mL 숟가락), 구토해도 반복. 구토 심한 소아는 ondansetron 단회 후 ORS 재시도. 조기 재수유·모유 지속(금식 최소화). 손위생·격리로 전파 차단(노로 전염력 강함).</p></section><section id="type-watery"><h3>급성 수양성 설사(비염증성·소장형)</h3><p>혈액·점액 없는 물설사. 소장에서 분비 증가. 대부분 바이러스·독소형, 항생제 대부분 불필요. 수분·전해질(ORS)이 치료. 중증탈수·경구실패만 IV. 건강 성인의 비혈성 물설사엔 racecadotril·loperamide 단기 허용(혈성·발열 없을 때). 여행자·중증·고열이면 §항생제 규칙 확인.</p></section><section id="type-inflammatory"><h3>염증성·혈성 설사(세균성 이질·대장형)</h3><p>혈액·점액·백혈구 동반 설사, 발열·잔변감(tenesmus)·경련성 복통. 대장 침습성 세균. 항생제 적응 가능하나 STEC 감별이 결정적. 적응(혈변+발열/이질·면역저하 혈변): azithromycin 또는 FQ, 단회~3일. 소아·중증은 azithromycin/ceftriaxone. 균 확인 시 표적: 캄필로박터=azithromycin, 시겔라=azithro/cipro/ceftriaxone, 콜레라=doxycycline. STEC 확인·의심 시 지지요법(수분)만, 항생제·지사제 금지·HUS 감시.</p></section><section id="type-food_poisoning"><h3>세균성 식중독(독소형·감염형)</h3><p>오염식품 섭취 후 급성 구토·설사. 독소형(이미 생성된 독소)과 감염형(균 증식) 구분. 독소형은 항생제 무의미. 대증·수분보충이 기본. 대부분 자연 호전. 감염형 중증·고위험군만 §항생제 규칙. 예방·역학(원인 식품 파악)·신고가 임상만큼 중요.</p></section><section id="type-travelers"><h3>여행자 설사</h3><p>개도국 여행 중/후 급성 설사. 대개 자기제한적이나 중증·고열 시 단기 항생제로 이환기간 단축. 경증: 수분·필요시 loperamide(비혈성·무발열 성인). 중등–중증: azithromycin 또는 FQ 단회~3일. 비침습(비혈성·무발열)만 rifaximin 대안. 예방: 물·음식 위생. 일상 예방적 항생제는 비권장.</p></section><section id="type-cdiff"><h3>클로스트리디오이데스 디피실 감염(CDI·항생제연관)</h3><p>최근/현재 항생제·입원·고령과 연관된 설사. 원인 항생제 중단 + 표적치료. loperamide 금기. 1차: 경구 반코마이신 125 mg qid 10일(또는 fidaxomicin). 경증 대체 metronidazole. 원인 항생제 중단·불필요한 위산억제제 재검토. 재발·중증은 전문가·감염관리(격리·접촉주의).</p></section><section id="type-cholera"><h3>콜레라</h3><p>대량 쌀뜨물 설사로 급속 탈수·쇼크. 적극적 수분보충이 생명을 좌우, 항생제는 보조(배설·이환 단축). ★적극적 수분·전해질(다량 IV/ORS)이 최우선. 항생제(doxycycline 300 mg 단회 등)는 배설량·이환기간 감소 보조. 즉시 신고·역학·접촉자 관리.</p></section><section id="symptom-dehydration"><h3>💧 탈수·수분보충 (치료의 중심)</h3><p>경구수액제(저삼투압 ORS) / 아연(원소 아연)</p></section><section id="symptom-vomiting"><h3>🤮 구토·오심 (진토제)</h3><p>온단세트론(경구붕해정) / 돔페리돈 / 메토클로프라미드</p></section><section id="symptom-cramping"><h3>😖 복통·장경련 (진경제)</h3><p>부틸스코폴라민(부스코판) / 피나베리움, 드로타베린, 메베베린</p></section><section id="symptom-fever"><h3>🌡️ 발열·통증 (해열진통)</h3><p>아세트아미노펜 / 이부프로펜</p></section><section id="symptom-diarrhea"><h3>🚽 설사 (지사·보조)</h3><p>라세카도트릴 / 로페라마이드 / 디옥타헤드랄 스멕타이트(스멕타), 비스무트 서브살리실레이트</p></section><section id="symptom-bloating"><h3>🎈 복부팽만·가스 (소포제)</h3><p>시메티콘</p></section><section id="symptom-probiotic"><h3>🦠 장내세균 보조 (프로바이오틱스)</h3><p>락토바실루스 GG, 사카로마이세스 보울라디, 클로스트리디움 부티리쿰(미야리산), 바실루스 생균제</p></section><section id="symptom-diet"><h3>🍚 식이·재수유</h3><p></p></section><section id="drug-ors"><h3>경구수액제(저삼투압 ORS) (oral rehydration solution)</h3><p>경구수액제(ORS) · 성인 탈수 교정: 초기 4시간 손실량 보충 후 유지량. 설사 1회당 성인 200–400 mL 추가 보충 · 소아 경증 50 mL/kg·중등도 100 mL/kg를 4시간에 걸쳐 소량씩(5–10 mL 숟가락) 자주; 설사 1회당 &lt;10kg 60–120 mL, ≥10kg 120–240 mL 추가 · 금기: 스포츠음료·과일주스·이온음료는 고당·저나트륨 → ORS 대용 부적합(삼투성 설사 악화)</p></section><section id="drug-zinc"><h3>아연(원소 아연) (zinc)</h3><p>아연 보충제 · 성인 국내 통용 제한(개도국 소아 대상 권고) · 소아 WHO: 생후 6개월 미만 10 mg/일·6개월 이상 20 mg/일, 10–14일 (설사 기간·재발↓)</p></section><section id="drug-loperamide"><h3>로페라마이드 (loperamide)</h3><p>장운동억제 지사제(오피오이드계) · 성인 초회 4 mg, 이후 무른변마다 2 mg(최대 16 mg/일) · 소아 ★18세 미만 사용 금지(허가·지침) · 금기: ★★혈성·점액변·발열·이질·C.difficile·STEC 의심 시 금기 — 독소 정체로 독성거대결장·HUS 악화. 18세 미만 전면 금기</p></section><section id="drug-racecadotril"><h3>라세카도트릴 (racecadotril)</h3><p>장분비억제 지사제(엔케팔리나제 억제) · 성인 100 mg 1일 3회(식전), 최대 7일 · 소아 1.5 mg/kg 1일 3회(생후 3개월 이상)</p></section><section id="drug-diosmectite"><h3>디옥타헤드랄 스멕타이트(스멕타) (diosmectite)</h3><p>흡착제·점막보호 · 성인 3 g 1일 3회(물에 현탁) · 소아 ≤1세 3 g/일, 1–2세 3–6 g/일, &gt;2세 6–9 g/일 분할 · 금기: 일부 제품 미량 납 검출 이슈로 유럽서 2세 미만 사용 제한 권고 이력(재검증)</p></section><section id="drug-bismuth_subsalicylate"><h3>비스무트 서브살리실레이트 (bismuth subsalicylate)</h3><p>흡착제·점막보호 · 성인 524 mg 30–60분마다(최대 8회/일) · 소아 ★소아·청소년 회피(살리실레이트 → 라이증후군 위험) · 금기: ★수두·인플루엔자 소아에 살리실레이트 → 라이증후군; 살리실레이트 알레르기·와파린 주의</p></section><section id="drug-ondansetron"><h3>온단세트론(경구붕해정) (ondansetron)</h3><p>5-HT3 길항 항구토제 · 성인 4–8 mg 경구/정맥 · 소아 단회 경구(체중별): 8–15kg 2 mg, 15–30kg 4 mg, &gt;30kg 8 mg — 구토로 경구수액 실패 시 1회 · 금기: QT 연장 주의(선천성 QT·전해질이상·병용약). 투여 후 설사 일시 증가 가능</p></section><section id="drug-metoclopramide"><h3>메토클로프라미드 (metoclopramide)</h3><p>도파민길항 항구토·위장운동촉진제 · 성인 10 mg 1일 3회(최대 5일) · 소아 ★1세 미만 금기, 소아 회피 경향 · 금기: ★추체외로 증상·급성 근긴장이상(특히 소아·젊은 여성)·지연성 운동이상 → 소아 회피</p></section><section id="drug-domperidone"><h3>돔페리돈 (domperidone)</h3><p>도파민길항 항구토·위장운동촉진제 · 성인 10 mg 1일 3회(식전) · 소아 체중별 소량(허가 제한) · 금기: ★QT 연장·심장돌연사 위험 → 저용량·단기. 중증 간장애·심질환 회피</p></section><section id="drug-acetaminophen"><h3>아세트아미노펜 (acetaminophen)</h3><p>해열진통제 · 성인 1회 500–1000 mg, 4–6시간마다 (최대 4 g/일; 간질환·음주 시 ≤2–3 g) · 소아 10–15 mg/kg, 4–6시간마다 (최대 75 mg/kg/일)</p></section><section id="drug-ibuprofen"><h3>이부프로펜 (ibuprofen)</h3><p>NSAID(비스테로이드 소염진통) · 성인 1회 200–400 mg, 6–8시간마다 (OTC 최대 1200 mg/일) · 소아 5–10 mg/kg, 6–8시간마다 (≥6개월) · 금기: ★탈수·설사 시 신독성↑·위장관 자극 — 장염엔 아세트아미노펜 우선</p></section><section id="drug-hyoscine_butylbromide"><h3>부틸스코폴라민(부스코판) (hyoscine butylbromide)</h3><p>진경제(장경련·평활근 이완) · 성인 10–20 mg 1일 3–5회(경구/주사) · 소아 6세↑ 10 mg 1일 3회(허가 확인) · 금기: ★녹내장·전립선비대·마비성 장폐색·중증심질환 금기. 외과적 복증 배제 전 복통 은폐 주의</p></section><section id="drug-pinaverium"><h3>피나베리움 (pinaverium bromide)</h3><p>진경제(장경련·평활근 이완) · 성인 50 mg 1일 3회(식사 중, 최대 100 mg 1일 3회) · 소아 소아 자료 제한</p></section><section id="drug-drotaverine"><h3>드로타베린 (drotaverine)</h3><p>진경제(장경련·평활근 이완) · 성인 40–80 mg 1일 3회 · 소아 연령별(허가 확인)</p></section><section id="drug-mebeverine"><h3>메베베린 (mebeverine)</h3><p>진경제(장경련·평활근 이완) · 성인 135 mg 1일 3회(식전) 또는 서방정 200 mg 1일 2회 · 소아 소아 자료 제한</p></section><section id="drug-simethicone"><h3>시메티콘 (simethicone)</h3><p>소포제(가스·복부팽만) · 성인 40–125 mg 식후·취침 전 · 소아 연령별 현탁액</p></section><section id="drug-lactobacillus_gg"><h3>락토바실루스 GG (Lactobacillus rhamnosus GG)</h3><p>생균제(프로바이오틱스·정장생균) · 성인 제품별 상용량 · 소아 ≥10^10 CFU/일, 5–7일 · 금기: ★상당수 품목 비급여(급여 정비). 처방 전 급여 상태 확인</p></section><section id="drug-saccharomyces_boulardii"><h3>사카로마이세스 보울라디 (Saccharomyces boulardii)</h3><p>생균제(프로바이오틱스·정장생균) · 성인 250–500 mg 1일 2회 · 소아 250–500 mg/일 · 금기: ★★중심정맥관 보유·중증면역저하·중환자에 진균혈증(fungemia) 보고 → 해당 환자 금기. 다수 품목 비급여</p></section><section id="drug-clostridium_butyricum"><h3>클로스트리디움 부티리쿰(미야리산) (Clostridium butyricum)</h3><p>생균제(프로바이오틱스·정장생균) · 성인 제품별 상용량 · 소아 연령별 산제·정제 · 금기: 다수 품목 비급여(재검증)</p></section><section id="drug-bacillus_probiotic"><h3>바실루스 생균제 (Bacillus probiotic)</h3><p>생균제(프로바이오틱스·정장생균) · 성인 제품별 상용량 · 소아 연령별 · 금기: 다수 품목 비급여(재검증)</p></section><section id="drug-ciprofloxacin"><h3>시프로플록사신 (ciprofloxacin)</h3><p>플루오로퀴놀론 · 성인 500 mg 1일 2회, 3일(또는 750 mg 단회·1g 단회 옵션) · 소아 소아 1차 아님(연골독성 우려; 필요 시 전문가) · 금기: ★캄필로박터는 FQ 내성 높음 → azithromycin 우선. STEC 의심 시 금지(HUS). 건욱·QT·대동맥류 주의</p></section><section id="drug-levofloxacin"><h3>레보플록사신 (levofloxacin)</h3><p>플루오로퀴놀론 · 성인 500 mg 1일 1회, 3일(또는 단회) · 소아 소아 1차 아님 · 금기: ★STEC 금지·캄필로박터 내성. 힘줄·QT·대동맥 주의</p></section><section id="drug-azithromycin"><h3>아지트로마이신 (azithromycin)</h3><p>마크로라이드 · 성인 500 mg 1일 1회 3일(또는 1 g 단회) · 소아 10 mg/kg/일 3일(이질 등 적응 시)</p></section><section id="drug-ceftriaxone"><h3>세프트리악손 (ceftriaxone)</h3><p>3세대 세팔로스포린 · 성인 1–2 g 정맥 1일 1회 · 소아 50–75 mg/kg/일 정맥(중증·입원)</p></section><section id="drug-cefixime"><h3>세픽심 (cefixime)</h3><p>3세대 세팔로스포린 · 성인 400 mg/일 분할 · 소아 8 mg/kg/일</p></section><section id="drug-doxycycline"><h3>독시사이클린 (doxycycline)</h3><p>테트라사이클린 · 성인 콜레라 300 mg 단회(또는 100 mg bid) · 소아 ★8세 미만 치아착색 회피(콜레라 단회는 이익&gt;위험 시 예외)</p></section><section id="drug-rifaximin"><h3>리팍시민 (rifaximin)</h3><p>리파마이신(비흡수) · 성인 200 mg 1일 3회 3일 · 소아 ≥12세 · 금기: ★혈성·발열·침습성 의심엔 부적합(전신 도달 안 함)</p></section><section id="drug-metronidazole"><h3>메트로니다졸 (metronidazole)</h3><p>니트로이미다졸 · 성인 지아르디아·아메바 500–750 mg tid; 경증 CDI 500 mg tid 10일 · 소아 지아르디아 15 mg/kg/일 분3; CDI 30 mg/kg/일 · 금기: ★음주 시 디설피람양 반응(복용 중·후 금주)</p></section><section id="drug-vancomycin_oral"><h3>경구 반코마이신 (oral vancomycin)</h3><p>경구 글리코펩타이드 · 성인 125 mg 1일 4회 10일(CDI 1차) · 소아 10 mg/kg 1일 4회(최대 125 mg/회) · 금기: 정맥 반코마이신은 CDI에 효과 없음 — 반드시 경구/직장</p></section><section id="drug-fidaxomicin"><h3>피닥소마이신 (fidaxomicin)</h3><p>마크로사이클릭(fidaxomicin) · 성인 200 mg 1일 2회 10일 · 소아 체중별(허가) · 금기: 급여 제한(재검증)</p></section><section id="drug-trimethoprim_sulfamethoxazole"><h3>트리메토프림/설파메톡사졸(TMP-SMX) (trimethoprim-sulfamethoxazole)</h3><p>설폰아마이드 복합 · 성인 160/800 mg 1일 2회 · 소아 TMP 8 mg/kg/일 분2 · 금기: 내성 흔함(경험적 부적합) → 감수성 기반. 설파 알레르기·G6PD 주의</p></section><section id="redflag-surgical"><h3>위험 사인 · 외과적 복증 의뢰</h3><ul><li>충수염·복막염·장폐색·회전이상 — 장염으로 오인 위험, 응급 수술적 평가 필요 — 담즙성(녹색) 구토 — 장폐색·회전이상 신호, 혈성(피/커피찌꺼기) 구토, 심한 국소 복통 + 반발통(rebound)·복벽 경직(방어), 복부 팽만 + 배변·배가스 정지(장폐색), 지속·악화되는 한 곳의 복통(설사보다 복통이 압도), 우하복부 통증 이동(McBurney)·보행 시 통증(충수염)</li><li>장중첩증(호발 3개월–3세) — 장괴사·천공 전 응급 정복(공기·바륨 관장) 또는 수술 — 간헐적 심한 복통 — 갑자기 울며 다리를 배로 굽혔다 풀기를 반복, ★currant-jelly(딸기잼 같은 점액혈변), 우상복부 소시지 모양 복부 종괴, 발작 사이 축 처짐(lethargy)·창백, 구토(진행 시 담즙성)</li><li>중증 탈수(&gt;10%)·저혈량 쇼크 — 즉시 정맥수액·이송 — 무기력·의식저하·깨워도 처짐, 안구 심하게 함몰·눈물 없음·대천문 함몰(영아), 피부탄력 매우 지연(텐트징후 ≥2초), 무뇨·기저귀 6–8시간 이상 마름, 빈맥·저혈압·모세혈관재충전 ≥3초·사지 차가움(쇼크), 물을 약하게 빨거나 못 마심</li><li>STEC(시가독소 대장균) 후 HUS — 급성 신손상·용혈·혈소판감소 3징, 소아 급성신부전 주요 원인 — 혈성설사 경과 중/후 소변량 급감, 창백·기운없음(용혈성 빈혈), 점상출혈·멍(혈소판 감소), 얼굴·손발 부종·전신 부종, 고혈압·경련·의식변화(진행 시)</li><li>중증·균혈증·전이감염 위험이 높아 낮은 문턱으로 평가·배양·조기 항생제 고려 — 생후 3개월 미만 영아의 설사·발열, 고령(특히 동맥경화·기저질환), 면역저하(항암·이식·HIV·고용량 스테로이드), 임신부, 판막질환·인공삽입물 보유</li><li>CDI 의심 — 독소검사·원인 항생제 중단·표적치료 — 최근/현재 항생제 또는 입원력 + 수양성 설사, 발열·복통·백혈구증가, 복부팽만·전신독성(독성거대결장 경고)</li><li>만성·지속 설사 — 염증성 장질환·기생충(지아르디아)·결핵·흡수장애·악성 감별 — 설사 7일(급성 2주) 이상 지속, 발열 지속·반복, 의미있는 체중감소·야간 증상, 지속 혈변·점액변</li><li>수인성·식품매개감염병 집단발생 — 관할 보건소 신고 의무·역학조사 — 동일 음식·장소 노출자 다수 동시 발병, 집단급식·행사 후 유사 증상 군집, 콜레라·장티푸스·이질 등 법정감염병 의심</li></ul></section><section id="pitfalls"><h3>피해야 할 것들 (지뢰)</h3><ul><li>STEC 혈성설사에 항생제: ★★장출혈성 대장균(O157 등)이면 항생제가 시가독소 방출을 늘려 HUS(용혈성요독증후군) 위험을 높인다(강함/중등도). 소아·고령에서 치명적.</li><li>혈성·발열·소아·CDI에 지사제(loperamide): ★★장운동을 멈춰 독소·균이 정체 → 독성거대결장·천공·HUS 악화. 18세 미만은 전면 금기, 침습성(혈성·발열·이질)·C.difficile에 금기.</li><li>외과적 복증을 장염으로 오인: ★충수염·복막염·장폐색·장중첩(소아 currant-jelly+종괴)·회전이상을 놓치면 장괴사·천공·사망. 담즙성 구토·국소 반발통·배변정지는 외과 신호.</li><li>복통을 진통·지사로 은폐: 진단이 지연되어 충수염·복막염 천공으로 진행할 수 있다.</li><li>경증에 습관적 정맥수액(주사): ★주사제 처방률(적정성 평가 지표) 등급이 악화되고, 임상적 이득 없이 비용·감염 위험만 는다.</li><li>비혈성 물설사에 항생제 남용: 효과 없고 내성·부작용·CDI를 늘리며, 항생제 적정성·처방률에서 삭감·감점 위험.</li><li>경증 살모넬라에 불필요한 항생제: 이환기간을 단축하지 못하고 균 배출(보균)을 연장하며 재발·내성을 늘린다(약함/낮음).</li><li>캄필로박터에 fluoroquinolone: 캄필로박터는 FQ 내성률이 높아 실패 가능. 지역 내성이 흔하다.</li><li>스포츠음료·주스를 ORS 대용: ★고당·저나트륨 조성이라 삼투성 설사를 악화시키고 전해질(Na) 교정에 실패한다.</li><li>정장생균제 급여 미확인 처방: ★상당수 품목이 비급여로 정비됨 — 환자 본인부담·삭감·민원 소지. 임상 효과 근거도 상충.</li><li>장기 금식·모유 중단: 금식 장기화는 장점막 회복을 늦추고 영양부전·회복 지연을 초래한다.</li><li>CDI에 정맥 반코마이신: 정맥 반코마이신은 장관강에 도달하지 못해 CDI에 무효하다.</li><li>집단발생·법정감염병 미신고: 수인성·식품매개감염병은 신고 의무 — 미신고는 역학 확산 방치·법적 문제.</li></ul></section><section id="reimb-gastroenteritis"><h3>주사 처방률·급여·삭감·KCD</h3><ul><li>정장생균제(프로바이오틱스) 급여 정비 — 상당수 품목 비급여 전환(약 99품목 비급여 보도).</li><li>감염성 장염 대부분(물설사·바이러스)은 항생제 부적절. 균 확인·적응 근거 없는 처방은 조정.</li><li>경구수액제(ORS) 급여 여부·조건 확인 필요(품목·성상별 상이 가능).</li><li>지사제·항구토제 급여이나 성분중복·과다품목·투여기간 이탈 시 조정.</li><li>A00 콜레라</li><li>A02 기타 살모넬라감염</li><li>A03 세균성 이질(시겔라증)</li><li>A04 기타 세균성 장감염</li><li>A05 기타 세균성 식중독(달리 분류 안 됨)</li><li>A06 아메바증(이질아메바)</li><li>A07 기타 원충성 장질환</li><li>A08 바이러스성·기타 명시된 장감염</li><li>A09 감염성·상세불명 기원의 위장염·결장염</li><li>K52 기타 비감염성 위장염·결장염</li></ul></section></div></noscript>

    var r=el.getBoundingClientRect(); return r.width>4 && r.height>4 && r.bottom>0 && r.top<innerHeight;
  }
  var BACK_ARROW=/[\u2039\u2190\u25C0\u27E8\u276E<]/;
  function looksBack(t){
    if(!t) return false; t=t.replace(/\s+/g,' ').trim(); if(t.length>16) return false;
    if(/\uB3CC\uC544\uAC00\uAE30/.test(t)) return true;            // 돌아가기
    if(/\uBAA9\uB85D\uC73C\uB85C/.test(t)) return true;            // 목록으로
    if(/\uB3C4\uC11C\uAD00/.test(t) && BACK_ARROW.test(t)) return true;  // 도서관 + 화살표
    if(BACK_ARROW.test(t) && /\uBAA9\uB85D|\uB9AC\uC2A4\uD2B8|\uCC98\uC74C|home/i.test(t)) return true;
    return false;
  }
  function backControl(){
    var nodes=document.body.querySelectorAll('[onclick],a,button,[role=button]');
    for(var i=0;i<nodes.length;i++){
      var el=nodes[i];
      if(el.id==='portal-hdr'||el.closest('#portal-hdr')) continue;
      if(!isVisible(el)) continue;
      if(looksBack(el.textContent||'')) return el.closest('[onclick],a,button,[role=button]')||el;
    }
    return null;
  }
  function closeTarget(){
    if(overlays().length>0) return {type:'overlay'};
    if(backTrapOK){ var b=backControl(); if(b) return {type:'back', el:b}; }
    return null;
  }
  function appClosers(){
    var bad={close:1,closed:1,stop:1,print:1,open:1,opener:1,focus:1,blur:1,alert:1,confirm:1,prompt:1};
    var fns=[];
    for(var k in window){
      try{ if(/^(close|hide|dismiss)/i.test(k) && !bad[k] && typeof window[k]==='function' && window[k].length===0 && (''+window[k]).indexOf('[native code]')<0) fns.push(window[k]); }catch(e){}
    }
    try{ if(typeof window.close==='function' && (''+window.close).indexOf('[native code]')<0) fns.push(window.close); }catch(e){}
    return fns;
  }
  function closeOverlays(){
    appClosers().forEach(function(fn){ try{fn.call(window);}catch(e){} });
    overlays().forEach(function(el){ SHOW_CLASSES.forEach(function(c){ el.classList.remove(c); }); });
    try{ if(!overlays().length) document.body.style.overflow=''; }catch(e){}
  }
  function refreshOnce(){
    var has=!!closeTarget();
    if(has && !armed){ armed=true; try{history.pushState({backTrap:1},'');}catch(e){} }
    else if(!has && armed && !consuming){ consuming=true; try{history.back();}catch(e){} }
  }
  function schedule(){
    var t=(window.performance&&performance.now)?performance.now():+new Date();
    if(lastSched>=0 && t-lastSched<80) return; lastSched=t;
    [0,100,250,450,700].forEach(function(d){ setTimeout(refreshOnce,d); });
  }
  window.addEventListener('popstate', function(){
    if(consuming){ consuming=false; armed=false; return; }
    var tgt=closeTarget();
    if(tgt){
      armed=false;
      if(tgt.type==='overlay') closeOverlays();
      else if(tgt.el){ try{tgt.el.click();}catch(e){} }
      schedule();
    } else { armed=false; }
  });
  function init(){
    baseline=new WeakSet();
    candidates().forEach(function(el){ baseline.add(el); });
    backTrapOK = (backControl()===null);
    var mo=new MutationObserver(schedule);
    mo.observe(document.body,{subtree:true,attributes:true,attributeFilter:['class','style','hidden'],childList:true});
    document.addEventListener('click',function(){ schedule(); },true);
    window.addEventListener('resize',schedule);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ setTimeout(init,80); });
  else setTimeout(init,80);
})();
</script>
