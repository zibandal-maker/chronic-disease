<h1>빈혈 처방가이드 — 감별진단·치료·급여 (임상의용)</h1>
<p>빈혈은 적혈구 생성 감소·파괴 증가(용혈)·소실(출혈)이 도달하는 최종 공통 경로다. 형태학(MCV: microcytic 소구성/normocytic 정구성/macrocytic 대구성)과 운동학(망상적혈구·RPI)으로 분류하고, 철검사(ferritin·TSAT·TIBC·sTfR)·B12·엽산·용혈세트·말초혈액도말·골수검사로 감별한다. 한국 가이드라인과 심평원 급여기준을 이중레이어로 제시한다.</p>
<section id="type"><h2>빈혈 타입별 감별·진단</h2><section id="type-ida"><h3>철결핍빈혈(IDA) (microcytic 소구성)</h3><p>체내 저장철 고갈로 생기는 소구성·저색소성 빈혈. 성인에서 가장 흔하며, 빈혈 교정만큼 원인(특히 출혈원) 규명이 중요하다. Work-up: Ferritin·TSAT·TIBC·Iron·Retic·sTfR·위·대장내시경 + FOBT·tTG-IgA. 감별: 지중해빈혈·만성질환/염증빈혈(ACD/AI)·철적혈모구빈혈. KCD D50. 주의: 철결핍 확인에 그쳐 GI암 놓침; 지중해빈혈 오인 철투여.</p></section><section id="type-thalassemia"><h3>지중해빈혈 (microcytic 소구성)</h3><p>글로빈 사슬 합성 장애에 의한 유전성 소구성 빈혈. 한국은 희귀(대개 β-thal minor)이나 다문화·이주로 노출 증가. 철결핍으로 오인 금지. Work-up: Hb electrophoresis·RBC·RDW·Ferritin. 감별: 철결핍빈혈(IDA). KCD D56. 주의: 철결핍 오인 → 철과부하.</p></section><section id="type-sideroblastic"><h3>철적혈모구빈혈 (microcytic 소구성)</h3><p>철 이용 장애로 골수에 환상철적혈모구(ringed sideroblast)가 나타나는 빈혈. 혈청철·페리틴·TSAT가 오히려 상승(철결핍과 반대). Work-up: Iron·Ferritin·TSAT·골수 Prussian blue 염색. 감별: 철결핍빈혈(IDA)·골수형성이상증후군(MDS). KCD D64. 주의: 철결핍 반대 방향인데 철투여.</p></section><section id="type-lead"><h3>납중독 빈혈 (microcytic 소구성)</h3><p>납 노출에 의한 소구성 빈혈. heme 합성 효소 억제. 직업·환경 노출력이 열쇠. Work-up: 혈중 납 농도·말초혈액도말. KCD D64.</p></section><section id="type-acd"><h3>만성질환/염증빈혈(ACD/AI) (normocytic 정구성)</h3><p>만성 염증·감염·악성종양에서 hepcidin 상승으로 철 이용이 차단돼 생기는 정구성(때로 소구성) 저생성 빈혈. 기저질환이 본질. Work-up: CRP·Ferritin·TSAT·TIBC·sTfR. 감별: 철결핍빈혈(IDA). KCD D63. 주의: ACD로 뭉뚱그려 골수종 놓침; 철결핍 병존(sTfR index>2) 간과.</p></section><section id="type-ckd_renal"><h3>신성빈혈(CKD) (normocytic 정구성)</h3><p>신장 EPO 생산 감소로 생기는 정구성·정색소성 저생성 빈혈. 철결핍·염증을 먼저 배제한 뒤 EPO 결핍으로 귀속. Work-up: eGFR·Cr·Ferritin·TSAT·Retic·Vit B12·Folate·CRP. KCD D63.</p></section><section id="type-hf_iron_def"><h3>심부전 철결핍(빈혈 무관) ()</h3><p>심부전에서 빈혈이 없어도 철결핍을 진단·치료. HF의 50–60%가 철결핍이며 증상·예후와 연관. Work-up: Ferritin·TSAT.</p></section><section id="type-aiha"><h3>자가면역용혈빈혈(AIHA) (normocytic 정구성)</h3><p>자가항체에 의한 적혈구 파괴. 온난형(IgG, 비장, 혈관외)과 한랭응집소병(IgM·C3d, 간, 보체매개)으로 나뉜다. Work-up: DAT/Coombs·Haptoglobin·LDH·Indirect bilirubin·Retic. 감별: 유전성 구상적혈구증(HS)·미세혈관병성용혈(TTP/HUS/DIC). KCD D59.</p></section><section id="type-hs"><h3>유전성 구상적혈구증(HS) (normocytic 정구성)</h3><p>적혈구 막단백 결함(ankyrin·band3·spectrin)에 의한 유전성 용혈. 국내 흔한 유전성 용혈빈혈. DAT 음성으로 AIHA와 구별. Work-up: DAT/Coombs·MCHC·Indirect bilirubin·삼투취약성 / EMA-결합 유세포. 감별: 자가면역용혈빈혈(AIHA). KCD D58.</p></section><section id="type-g6pd"><h3>G6PD 결핍 (normocytic 정구성)</h3><p>X연관 효소 결핍(남성 발현). 산화스트레스 시 급성 혈관내 용혈. 한국은 드묾. Work-up: G6PD·Haptoglobin·LDH·말초혈액도말. KCD D55.</p></section><section id="type-maha"><h3>미세혈관병성용혈(TTP/HUS/DIC) (normocytic 정구성)</h3><p>미세혈관 내 적혈구 물리적 파괴(분열적혈구). TTP·HUS·DIC 감별이 응급. 공통: schistocyte>1%, DAT 음성, 혈소판감소, LDH↑↑. Work-up: 말초혈액도말·Platelet·LDH·Haptoglobin·DAT/Coombs·ADAMTS13·응고검사 PT/aPTT/피브리노겐/D-dimer·Cr. KCD D59.</p></section><section id="type-pnh"><h3>발작성야간혈색소뇨증(PNH) (normocytic 정구성)</h3><p>후천 PIGA 변이로 GPI-anchor(CD55/CD59) 결손 → 보체매개 혈관내 용혈·혈전(비전형 부위)·골수부전. Work-up: 말초혈액 유세포검사 (FLAER + CD55/CD59)·LDH·Haptoglobin·Retic. KCD D59.</p></section><section id="type-b12_def"><h3>비타민 B12 결핍 (macrocytic 대구성)</h3><p>코발라민 결핍에 의한 거대적혈모구성 빈혈. 빈혈 없이 신경증상 단독 발현 가능하며 지연 시 비가역 → 의심 즉시 치료. Work-up: Vit B12·MMA·Homocysteine·내인자항체·항벽세포항체·말초혈액도말. 감별: 엽산 결핍·골수형성이상증후군(MDS). KCD D51. 주의: B12 정상수치인데 결핍(MMA 확인); 신경증상 단독(MCV 정상).</p></section><section id="type-folate_def"><h3>엽산 결핍 (macrocytic 대구성)</h3><p>엽산 결핍 거대적혈모구성 빈혈. B12 동반 결핍 시 엽산 단독투여는 신경손상(SCD)을 진행·고정시키므로 금물. Work-up: Folate·Vit B12·Homocysteine·MMA. 감별: 비타민 B12 결핍. KCD D52. 주의: B12 결핍 동반 시 엽산 단독 → SCD 진행.</p></section><section id="type-mds"><h3>골수형성이상증후군(MDS) (macrocytic 대구성)</h3><p>골수 이형성·무효조혈에 의한 클론성 질환. 고령 원인불명 대구성/정구성 빈혈의 숨은 원인. >90%가 빈혈. Work-up: 골수검사(흡인+생검)·CBC 3계열 + 말초도말·EPO·Vit B12·Folate·Ferritin. KCD D46.</p></section><section id="type-aplastic"><h3>재생불량성빈혈 (normocytic 정구성)</h3><p>골수 저형성에 의한 범혈구감소. 연령·공여자 기반으로 이식 vs 면역억제를 결정. Work-up: CBC 3계열 + 망상적혈구·골수검사(생검)·PNH 유세포·바이러스(간염·EBV·HIV)·자가면역. KCD D61.</p></section><section id="type-prca"><h3>순수적혈구무형성(PRCA) (normocytic 정구성)</h3><p>적혈구계 전구세포만 선택적으로 소실(백혈구·혈소판 정상), 망상적혈구 현저 감소. Work-up: Retic·골수검사·Parvovirus B19 PCR · 흉부CT(흉선종) · 자가면역. KCD D60.</p></section><section id="type-redflag_marrow"><h3>혈액암/골수질환 의심(의뢰) ()</h3><p>빈혈이 혈액암·골수질환의 첫 신호일 때. 처방이 아니라 감별·의뢰가 목표. 고령 '단순 빈혈'에서 놓치기 쉬움. Work-up: CBC 3계열 + 말초도말·Ca·Cr·SPEP·sFLC ratio·Immunofixation·LDH·ESR·골수검사. KCD C90.</p></section><section id="type-acute_blood_loss"><h3>급성 출혈후빈혈 (normocytic 정구성)</h3><p>급성 출혈 후 빈혈. 출혈 직후 수시간은 혈장 재충전 전이라 Hb가 손실을 과소평가. Work-up: Retic·Hb·Ferritin. KCD D62.</p></section><section id="type-preg"><h3>임신 빈혈 ()</h3><p>임신 빈혈. 생리적 혈액희석을 반영한 삼분기별 역치. 총 철요구 임신 전체 ~1,000 mg. Work-up: Hb·Ferritin·Vit B12·Folate. KCD D50.</p></section><section id="type-elderly_multifactorial"><h3>노인 다인성 빈혈 ()</h3><p>노인 빈혈은 원인이 영양결핍 1/3 · 만성염증/CKD 1/3 · 원인불명 1/3이며 다인성이 흔하다. 원인불명군에 초기 골수질환이 숨는다. Work-up: Ferritin·TSAT·Vit B12·Folate·Cr·eGFR·TSH·CRP·Retic·지속 원인불명 → SPEP+sFLC·골수검사. KCD D64. 주의: 나이 탓으로 MDS/악성 놓침; 다인성 — 한 원인 확인 후 나머지 배제 안 함.</p></section><section id="type-drug_induced"><h3>약물유발 빈혈 ()</h3><p>고령 다약제에서 흔한, 놓치기 쉬운 빈혈 원인. 신규 빈혈 + 다약제면 항상 감별. Work-up: 약물력 검토(복용 시점·용량)·Vit B12·Folate·DAT/Coombs·Retic·LDH·Haptoglobin. KCD D64.</p></section></section>
<section id="drug"><h2>빈혈 치료 약물 (성분·상품명·급여)</h2><section id="drug-ferrous_sulfate"><h3>황산제일철 (훼로바유서방정)</h3><p>계열 경구 철분제. 성분 황산제일철. ATC B03AA07. 상품명 훼로바유서방정. 허가 1차, 흡수 최우수</p></section><section id="drug-ferrous_fumarate"><h3>푸마르산제일철</h3><p>계열 경구 철분제. 성분 푸마르산제일철. ATC B03AA02. 허가</p></section><section id="drug-ferrous_gluconate"><h3>글루콘산제일철</h3><p>계열 경구 철분제. 성분 글루콘산제일철. ATC B03AA03. 허가</p></section><section id="drug-ferric_maltol"><h3>페릭말톨</h3><p>계열 경구 철분제. 성분 페릭말톨. ATC B03AB10. 미확인</p></section><section id="drug-ferric_carboxymaltose"><h3>카르복시말토오스수산화제이철 (페린젝트주)</h3><p>계열 정맥 철분제. 성분 카르복시말토오스수산화제이철. ATC B03AC. 상품명 페린젝트주. 허가·급여</p></section><section id="drug-iron_sucrose"><h3>수크로오스수산화제이철 (베노훼럼주·베노스틴주)</h3><p>계열 정맥 철분제. 성분 수크로오스수산화제이철. ATC B03AC02. 상품명 베노훼럼주·베노스틴주. 허가·급여</p></section><section id="drug-epoetin_alfa"><h3>에포에틴알파 (에스포젠·에포카인)</h3><p>계열 적혈구조혈자극제. 성분 에포에틴알파. ATC B03XA01. 상품명 에스포젠·에포카인. 허가·급여</p></section><section id="drug-epoetin_beta"><h3>에포에틴베타 (레코몬)</h3><p>계열 적혈구조혈자극제. 성분 에포에틴베타. ATC B03XA01. 상품명 레코몬. 허가·급여</p></section><section id="drug-darbepoetin_alfa"><h3>다베포에틴알파 (네스프·네스벨)</h3><p>계열 적혈구조혈자극제. 성분 다베포에틴알파. ATC B03XA02. 상품명 네스프·네스벨. 허가·급여</p></section><section id="drug-methoxy_peg_epoetin_beta"><h3>메톡시폴리에틸렌글리콜에포에틴베타 (미쎄라)</h3><p>계열 적혈구조혈자극제. 성분 메톡시폴리에틸렌글리콜에포에틴베타. ATC B03XA03. 상품명 미쎄라. 허가·급여</p></section><section id="drug-roxadustat"><h3>록사두스타트 (에브렌조)</h3><p>계열 저산소유도인자 프롤릴수산화효소 억제제. 성분 록사두스타트. ATC B03XA05. 상품명 에브렌조. 허가·급여철수</p></section><section id="drug-enarodustat"><h3>에나로두스타트 (에나로이)</h3><p>계열 저산소유도인자 프롤릴수산화효소 억제제. 성분 에나로두스타트. ATC B03XA. 상품명 에나로이. 허가·급여진행</p></section><section id="drug-vadadustat"><h3>바다두스타트 (바다넴)</h3><p>계열 저산소유도인자 프롤릴수산화효소 억제제. 성분 바다두스타트. ATC B03XA04. 상품명 바다넴. 허가·급여진행</p></section><section id="drug-cyanocobalamin"><h3>시아노코발라민</h3><p>계열 코발라민(B12). 성분 시아노코발라민. ATC B03BA01. 허가</p></section><section id="drug-hydroxocobalamin"><h3>하이드록소코발라민</h3><p>계열 코발라민(B12). 성분 하이드록소코발라민. ATC B03BA03. 허가</p></section><section id="drug-folic_acid"><h3>엽산</h3>   // engine/expr.js
  function tokenize(src) {
    const toks = [];
    let i = 0;
    const isIdent = (c) => /[A-Za-z0-9_:]/.test(c);
    while (i < src.length) {
      const c = src[i];
      if (c === " ") {
        i++;
        continue;
      }
      if (c === "&" && src[i + 1] === "&") {
        toks.push({ t: "&&" });
        i += 2;
        continue;

  // engine/recommend.js
  var REGISTRY_VERSION = "anemia-data-1.0 / engine-1.0";
  function recommend(patient, opts = {}) {
    const cls = classify(patient);
    const types = cls.types;
    const gates = collectGates(patient, types);
    const referrals = gates.filter((g) => g.action === "REFER").map((g) => ({ target: g.target, urgency: g.urgency, reason: g.reason, gate: g.gate }));
    const orders = gates.filter((g) => g.action === "ORDER").map((g) => ({ order: g.order, reason: g.reason, gate: g.gate }));
    const flags = gates.filter((g) => g.action === "WARN" || g.action === "FLAG").map((g) => ({ level: g.action, reason: g.reason, gate: g.gate }));
    const ranked = rank(patient, types, opts);
    ranked.options.forEach((o) => o.warnings.forEach((w) => flags.push({ level: "WARN", reason: w.reason, gate: w.gate, drug: o.drug })));
    const targets = collectTargets(types);
    return {
      REGISTRY_VERSION,
      types: types.map((id) => ({ id, label: (ANEMIA_TYPES[id] || {}).label_ko, reason: (cls.reasons.find((r) => r.type === id) || {}).why })),
      morphology: cls.morphology,
      kinetics: cls.kinetics,
      drugs: ranked.options.map((o) => ({
        drug: o.drug,
        label: o.drug_label,
        grade: o.grade_norm,
        grade_original: o.grade_original,
        grade_system: o.grade_system,
        loe: o.loe,
        reimb: o.reimb,
        reimb_note: o.reimb_note,
        demoted: o.demoted,
        warnings: o.warnings,
        dose_note: o.dose_note,
        action_note: o.action_note,
        evidence: o.evidence,
        source: o.source
      })),
      drugs_total: ranked.total,
      targets,
      flags,
      orders,
      referrals,
      // 안전 우선 노출 순서 힌트
      display_order: ["referrals", "orders", "types", "drugs", "targets", "flags"]
    };
  }
  function collectTargets(types) {
    const targets = [];
    for (const t of types) {
      for (const rec of Object.values(ANEMIA_RECS)) {
        if (rec.topic !== t) continue;
        if (rec.target_th) {
          const v = th(rec.target_th);
          if (v) targets.push({ type: t, metric: v.lab || rec.target_th, op: v.op, value: v.val, note: v.note, ref: rec.target_th });
        }
      }
    }
    return targets;
  }
  function th(ref) {
    const base = Object.keys(ANEMIA_THRESHOLDS).find((b) => ref.startsWith(b + ":"));
    return base ? getThreshold(base, ref.slice(base.length + 1)) : null;
  }

          "<b>\uC131\uC778 \uB0A8\uC131\xB7\uD3D0\uACBD\uD6C4 \uC5EC\uC131 \u2192 \uC0C1\xB7\uD558\uBD80 \uB0B4\uC2DC\uACBD \uD544\uC218</b> (IDA \uC815\uBC00\uAC80\uC0AC \uC2DC GI \uC545\uC131 \uC57D 11%)",

          "\uC694\uAD6C \uC99D\uAC00: \uC784\uC2E0\xB7\uAE09\uC131\uC7A5 / \uC720\uC804: IRIDA(TMPRSS6, \uACBD\uAD6C\uCCA0 \uBD88\uC751)",
          "\uD55C\uAD6D \uC5EC\uC131 IDA \uC720\uBCD1\uB960 8.0%(\uAC00\uC784\uAE30 11.5%)"
        ]) },
        { h: "\u{1F48A} \uCE58\uB8CC (\uACBD\uAD6C 1\uCC28)", body: UL([
          "<b>\uC6D0\uC18C\uCCA0 100\u2013200 mg/\uC77C</b> 2\u20133\uD68C \uBD84\uBCF5, \uC2DD\uAC04(\uACF5\uBCF5). Vit C \uBCD1\uC6A9 \uD761\uC218\u2191, \uC81C\uC0B0\uC81C\xB7\uCE7C\uC298\xB7\uCC28\xB7\uCEE4\uD53C \uC800\uD574",
          "<b>\uACA9\uC77C\uC694\uBC95</b>: 1\uD68C \uBCF5\uC6A9 \uD6C4 \uC0C1\uC2B9\uD55C hepcidin\uC774 \uB2E4\uC74C\uB0A0 \uD761\uC218 \uC5B5\uC81C \u2192 \uACA9\uC77C \uC2DC \uBD84\uC728\uD761\uC218\u2191(Stoffel 2017: 21.8% vs 16.3%). <b>Hb \uAC1C\uC120\uC740 \uB9E4\uC77C\uACFC \uB3D9\uB4F1</b>, \uB0B4\uC57D\uC131\xB7\uC21C\uC751\uB3C4 \uC6B0\uC218",
          "\uBD80\uC791\uC6A9(\uC624\uC2EC\xB7\uBCF5\uD1B5\xB7\uBCC0\uBE44) \u2192 \uC11C\uBC29\uD615\xB7\uC800\uC6A9\uB7C9\xB7\uACA9\uC77C \uC804\uD658"
        ]) },
        { h: "\u{1F489} \uC815\uB9E5\uCCA0 \uC801\uC751\xB7\uBC18\uC751", body: UL([
          "\uC801\uC751: \uACBD\uAD6C 4\u20136\uC8FC \uD6C4 Hb \uC0C1\uC2B9&lt;1 g/dL, \uBD88\uB0B4\uC131, \uD761\uC218\uC7A5\uC560, \uC9C0\uC18D\uCD9C\uD608, \uC2E0\uC18D\uAD50\uC815(\uC218\uC220\uC804\xB7\uC784\uC2E0 3\uBD84\uAE30 \uC911\uC99D), CKD/\uD22C\uC11D, \uC554(ESA \uBCD1\uC6A9)",
          "\uC81C\uC81C: ferric carboxymaltose(\uD398\uB9B0\uC81D\uD2B8), iron sucrose(\uBCA0\uB178\uD6FC\uB7FC). Ganzoni \uACF5\uC2DD\uC73C\uB85C \uCD1D\uB7C9 \uC0B0\uC815",
          "<b>\uBC18\uC751 \uC2DC\uAC04\uD45C</b>: 2\u20133\uC77C \uC790\uAC01\uD638\uC804 \u2192 1\uC8FC \uB9DD\uC0C1\uC801\uD608\uAD6C\u2191 \u2192 2\uC8FC Hb 1\u20132 g/dL\u2191 \u2192 6\u20138\uC8FC \uC815\uC0C1\uD654",
          "<b>\uCE58\uB8CC\uAE30\uAC04</b>: \uC815\uC0C1\uD654 \uD6C4 \uCD94\uAC00 6\uAC1C\uC6D4 \uC720\uC9C0(\uC800\uC7A5\uCCA0 \uC7AC\uCD95\uC801). \uACFC\uBCF4\uCDA9(ferritin&gt;500) \uD68C\uD53C"
        ]) },
        { h: "\u{1F4B3} \uAE09\uC5EC (\uC2EC\uD3C9\uC6D0)", body: "IV \uCCA0\uBD84\uC81C \uACE0\uC2DC \uC81C2024-72\uD638: \uC77C\uBC18 IDA\uB294 Hb\u226410(\uC784\uC2E0\uBD80\u226411) + \uACBD\uAD6C\uACE4\uB780 + (ferritin&lt;30 \uB610\uB294 TSAT&lt;20%). <b>FCM\uC740 \uD22C\uC11D CKD \uAE09\uC5EC \uC81C\uC678</b>." },
        { h: "\u26A0\uFE0F Pitfall", body: UL([
          "\uC18C\uAD6C\uC131\uC778\uB370 \uCCA0\uAC80\uC0AC \uC815\uC0C1/\u2191 \uB610\uB294 \uAC00\uC871\uB825 \u2192 <b>\uC9C0\uC911\uD574\uBE48\uD608</b> \uC758\uC2EC(\uCCA0 \uD22C\uC5EC \uC2DC \uACFC\uBD80\uD558). Hb\uC804\uAE30\uC601\uB3D9\xB7Mentzer&lt;13",

        ]) }

      refs: ["gl:ida-kr-jkma-2024", "gl:ida-kr-kjm-2017"]
    },
    "anemia:type:thalassemia": {

        { h: "\u{1F48A} \uCE58\uB8CC", body: UL([

      summary: "\uCF54\uBC1C\uB77C\uBBFC \uACB0\uD54D\uC5D0 \uC758\uD55C \uAC70\uB300\uC801\uD608\uBAA8\uAD6C\uC131 \uBE48\uD608. <b>\uBE48\uD608 \uC5C6\uC774 \uC2E0\uACBD\uC99D\uC0C1 \uB2E8\uB3C5 \uBC1C\uD604 \uAC00\uB2A5</b>\uD558\uBA70 \uC9C0\uC5F0 \uC2DC \uBE44\uAC00\uC5ED \u2192 \uC758\uC2EC \uC989\uC2DC \uCE58\uB8CC.",

        { h: "\u{1F52C} \uC9C4\uB2E8\xB7\uC608\uD6C4", body: "<b>\uACE8\uC218\uAC80\uC0AC gold standard</b>: \uACC4\uC5F4 \uC774\uD615\uC131\uC138\uD3EC \u226510%, blast%, \uC138\uD3EC\uC720\uC804(\u22125/del5q\xB7\u22127\xB7+8), SF3B1. \uC608\uD6C4 IPSS-R(5\uAD70). \uC9C4\uB2E8 \uC804 B12\xB7\uC5FD\uC0B0\xB7\uCCA0\xB7\uAC04\xB7\uC2E0\xB7\uBC14\uC774\uB7EC\uC2A4 \uBC30\uC81C." },

<script>

</script>
