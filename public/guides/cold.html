<noscript><div class="seo-content"><h2>감기·급성 상기도감염 처방·대증요법·소아 위험징후 정보 (임상의용)</h2><p>감기(급성 비인두염·인두편도염·부비동염·중이염·기관지염·크룹)의 항생제 적응 판단(대부분 바이러스로 항생제 불필요, GAS 인두염은 McIsaac, 세균성 부비동염·중이염 기준)과 증상별 대증요법(가이드+통용, 출처 병치), 소아 위험징후 의뢰, 심평원 항생제 처방률 평가를 제공한다.</p><section id="type-cold"><h3>감기(급성 비인두염)</h3><p>바이러스성 급성 비인두염. 리노바이러스가 최다(코로나바이러스·RSV·파라인플루엔자·아데노 등). 항생제 불필요 — 대증치료 중심. 충분한 수분·휴식·가습. 손위생으로 전파 예방. 증상별 대증요법은 §플로우 참고(가이드/통용·출처 병치).</p></section><section id="type-pharyngitis"><h3>급성 인두편도염</h3><p>인두·편도의 급성 염증. 대부분 바이러스. 성인의 5–15%(소아 20–30%)만 A군 연쇄구균(GAS). 1차 amoxicillin 10일(GAS 확인 시). 페니실린 알레르기 4형은 1세대 cephalosporin/clindamycin/macrolide. GAS 치료 목적: 증상단축·전파차단·급성 류마티스열 예방. 치료 24시간 후 전염력 급감(등교/출근 기준).</p></section><section id="type-rhinosinusitis"><h3>급성 비부비동염</h3><p>부비동 점막의 급성 염증. 대부분 바이러스성(감기의 연장). 세균 중복감염은 소수(0.5–2%). 1차 amoxicillin 또는 amoxicillin/clavulanate. 내성폐렴구균 고위험은 고용량. 국소 스테로이드·생리식염수 세척 보조. 치료 실패(48–72h) 시 amox-clav 고용량 또는 대체.</p></section><section id="type-otitis_media"><h3>급성 중이염</h3><p>중이강의 급성 감염. 소아 흔함(이관 미성숙). 연령·중증도별 관찰대기(watchful waiting). 1차 amoxicillin 고용량 80–90 mg/kg/일, 2차/실패 amox-clav. 페니실린(1형 제외) 대체: cefdinir·cefuroxime·cefpodoxime·cefprozil. 기간 10일(2세↑ 경증 5일 가능). 통증조절(아세트아미노펜/이부프로펜) 병행.</p></section><section id="type-bronchitis"><h3>급성 기관지염</h3><p>하기도 기관지의 급성 염증. 대부분 바이러스(~10%만 백일해·마이코플라스마·클라미디아). 대증치료(진해·거담·수분). 흡연 시 금연. 백일해 확진/유행 시 macrolide + 접촉자 관리. 빈호흡·저산소 → 폐렴 감별(폐렴 앱 연계).</p></section><section id="type-laryngitis"><h3>급성 후두염</h3><p>후두 점막의 급성 염증. 바이러스성 쉰목소리(애성)가 주. 대증·음성휴식·수분·가습. 역류 동반 시 생활습관 교정.</p></section><section id="type-croup"><h3>크룹(후두기관기관지염)</h3><p>소아 상기도(성문하) 바이러스 감염. 개 짖는(barking) 기침·쉰목소리·흡기 stridor. 덱사메타손 0.15–0.6 mg/kg 1회(경증 포함) 표준. 중등도–중증(안정 시 stridor)은 분무 에피네프린 + 관찰(반동 주의)/의뢰. 찬 공기·가습이 도움될 수 있음.</p></section><section id="type-uri_unspec"><h3>다발성·상세불명 상기도감염</h3><p>복합 상기도 증상(비인두·인두·후두 혼재). 바이러스. 대증치료. 소아는 위험징후(§의뢰) 먼저 확인.</p></section><section id="symptom-fever"><h3>발열·통증 대증요법</h3><p>아세트아미노펜 / 이부프로펜, 덱시부프로펜, 록소프로펜</p></section><section id="symptom-rhinorrhea"><h3>콧물·재채기 대증요법</h3><p>클로르페니라민, 트리프롤리딘 / 세티리진, 로라타딘, 에바스틴 / 이프라트로피움 비강분무</p></section><section id="symptom-congestion"><h3>코막힘 대증요법</h3><p>슈도에페드린, 페닐에프린 / 옥시메타졸린, 자일로메타졸린, 나파졸린 / 생리식염수 비강세척</p></section><section id="symptom-cough"><h3>기침 대증요법</h3><p>덱스트로메토르판, 노스카핀, 벤프로페린 / 레보드로프로피진, 옥솔아민 / 코데인, 디히드로코데인 / 꿀</p></section><section id="symptom-sputum"><h3>가래 대증요법</h3><p>구아이페네신, 암브록솔, 브롬헥신 / 아세틸시스테인, 카르보시스테인, 에르도스테인</p></section><section id="symptom-sore_throat"><h3>인후통 대증요법</h3><p>아세트아미노펜 / 이부프로펜 / 생리식염수 비강세척</p></section><section id="drug-acetaminophen"><h3>아세트아미노펜 (acetaminophen)</h3><p>해열진통제 · 발열·통증 1차. 간독성 상한 주의(복합제 중복 확인)</p></section><section id="drug-ibuprofen"><h3>이부프로펜 (ibuprofen)</h3><p>NSAID(비스테로이드 소염진통) · 위장·신장·심혈관 주의; 탈수·수분부족 시 신독성↑</p></section><section id="drug-dexibuprofen"><h3>덱시부프로펜 (dexibuprofen)</h3><p>NSAID(비스테로이드 소염진통) · 이부프로펜 S-이성질체</p></section><section id="drug-loxoprofen"><h3>록소프로펜 (loxoprofen)</h3><p>NSAID(비스테로이드 소염진통) · 전구약물, 위장 부담 상대적 적음</p></section><section id="drug-chlorpheniramine"><h3>클로르페니라민 (chlorpheniramine)</h3><p>1세대 항히스타민 · 콧물·재채기(항콜린). 졸음·구갈·요저류; 고령·전립선·녹내장 주의</p></section><section id="drug-triprolidine"><h3>트리프롤리딘 (triprolidine)</h3><p>1세대 항히스타민 · 복합감기약 성분</p></section><section id="drug-cetirizine"><h3>세티리진 (cetirizine)</h3><p>2세대 항히스타민 · 졸음 적음. 감기 단독효과는 제한</p></section><section id="drug-loratadine"><h3>로라타딘 (loratadine)</h3><p>2세대 항히스타민 · 비진정성</p></section><section id="drug-ebastine"><h3>에바스틴 (ebastine)</h3><p>2세대 항히스타민 · 비진정성</p></section><section id="drug-pseudoephedrine"><h3>슈도에페드린 (pseudoephedrine)</h3><p>경구 비충혈제거제 · 혈압·불면·심계·전립선; 고혈압·관상동맥·MAOI·갑상선항진 주의</p></section><section id="drug-phenylephrine"><h3>페닐에프린 (phenylephrine)</h3><p>경구 비충혈제거제 · 경구 효과 논란(FDA 재평가)</p></section><section id="drug-oxymetazoline"><h3>옥시메타졸린 (oxymetazoline)</h3><p>국소(비강) 비충혈제거제 · ★7일 이상 금지 → 반동성 비염(rhinitis medicamentosa)</p></section><section id="drug-xylometazoline"><h3>자일로메타졸린 (xylometazoline)</h3><p>국소(비강) 비충혈제거제 · 7일 이내</p></section><section id="drug-naphazoline"><h3>나파졸린 (naphazoline)</h3><p>국소(비강) 비충혈제거제 · 7일 이내; 소아 전신흡수 주의</p></section><section id="drug-dextromethorphan"><h3>덱스트로메토르판 (dextromethorphan)</h3><p>중추성 비마약성 진해제 · SSRI·MAOI 병용 시 세로토닌증후군 주의</p></section><section id="drug-noscapine"><h3>노스카핀 (noscapine)</h3><p>중추성 비마약성 진해제 · 비마약성</p></section><section id="drug-benproperine"><h3>벤프로페린 (benproperine)</h3><p>중추성 비마약성 진해제</p></section><section id="drug-levodropropizine"><h3>레보드로프로피진 (levodropropizine)</h3><p>말초성 진해제 · 말초성, 졸음 적음</p></section><section id="drug-oxolamine"><h3>옥솔아민 (oxolamine)</h3><p>말초성 진해제 · 말초성·소염</p></section><section id="drug-codeine"><h3>코데인 (codeine)</h3><p>중추성 마약성 진해제 · 호흡억제·의존; CYP2D6 초대사자 위험</p></section><section id="drug-dihydrocodeine"><h3>디히드로코데인 (dihydrocodeine)</h3><p>중추성 마약성 진해제 · 코데인과 동일 주의</p></section><section id="drug-guaifenesin"><h3>구아이페네신 (guaifenesin)</h3><p>거담제 · 수분 섭취 병행</p></section><section id="drug-ambroxol"><h3>암브록솔 (ambroxol)</h3><p>거담제</p></section><section id="drug-bromhexine"><h3>브롬헥신 (bromhexine)</h3><p>거담제 · 암브록솔 전구체</p></section><section id="drug-acetylcysteine"><h3>아세틸시스테인 (acetylcysteine)</h3><p>점액용해제 · 점액 점도↓</p></section><section id="drug-carbocisteine"><h3>카르보시스테인 (carbocisteine)</h3><p>점액용해제</p></section><section id="drug-erdosteine"><h3>에르도스테인 (erdosteine)</h3><p>점액용해제</p></section><section id="drug-ipratropium_nasal"><h3>이프라트로피움 비강분무 (ipratropium nasal)</h3><p>보조·비약물 · 콧물 감소</p></section><section id="drug-saline_nasal"><h3>생리식염수 비강세척 (saline nasal)</h3><p>보조·비약물 · 약물사용 감소</p></section><section id="drug-zinc"><h3>아연 (zinc)</h3><p>보조·비약물 · 미각이상·오심; 이질성</p></section><section id="drug-honey"><h3>꿀 (honey)</h3><p>보조·비약물 · ★1세 미만 금기(보툴리누스)</p></section><section id="drug-dexamethasone"><h3>덱사메타손 (dexamethasone)</h3><p>코르티코스테로이드 · 경증 크룹 포함 표준</p></section><section id="drug-epinephrine_neb"><h3>에피네프린 분무 (nebulized epinephrine)</h3><p>코르티코스테로이드 · 중등도–중증 크룹, 관찰(반동)</p></section><section id="drug-amoxicillin"><h3>아목시실린 (amoxicillin)</h3><p>아미노페니실린 · 전염단핵구증 의심 시 금지(발진)</p></section><section id="drug-amoxicillin_clavulanate"><h3>아목시실린/클라불란산 (amoxicillin-clavulanate)</h3><p>β-lactam/억제제 복합 · 2차·중증·재발</p></section><section id="drug-cephalexin"><h3>세팔렉신 (cephalexin)</h3><p>1세대 세팔로스포린 · GAS 페니실린 4형 알레르기 대체</p></section><section id="drug-cefadroxil"><h3>세파드록실 (cefadroxil)</h3><p>1세대 세팔로스포린 · GAS 대체</p></section><section id="drug-cefdinir"><h3>세프디니르 (cefdinir)</h3><p>3세대 세팔로스포린 · 순응도 대체(5일)</p></section><section id="drug-cefuroxime"><h3>세푸록심 (cefuroxime)</h3><p>2세대 세팔로스포린 · 중이염 대체</p></section><section id="drug-cefpodoxime"><h3>세프포독심 (cefpodoxime)</h3><p>3세대 세팔로스포린 · 부비동·중이염 대체</p></section><section id="drug-cefprozil"><h3>세프프로질 (cefprozil)</h3><p>2세대 세팔로스포린 · 중이염 대체</p></section><section id="drug-clindamycin"><h3>클린다마이신 (clindamycin)</h3><p>린코사마이드 · GAS 1형 알레르기·재발</p></section><section id="drug-clarithromycin"><h3>클래리트로마이신 (clarithromycin)</h3><p>마크로라이드 · 마크로라이드 내성 주의</p></section><section id="drug-azithromycin"><h3>아지트로마이신 (azithromycin)</h3><p>마크로라이드 · 백일해에도 사용</p></section><section id="drug-doxycycline"><h3>독시사이클린 (doxycycline)</h3><p>테트라사이클린 · 부비동 페니실린 알레르기 대체</p></section><section id="drug-benzathine_penicillin_g"><h3>벤자틴 페니실린 G (benzathine penicillin G)</h3><p>아미노페니실린 · 국내 1차 비권장(순응도 대안)</p></section><section id="redflag-peds"><h3>소아 위험징후·의뢰</h3><ul><li>신생아·3개월 미만 영아 발열 → 즉시 평가(중증세균감염·수막염 배제). 감기로 처리 금지</li><li>급성 후두개염/기도폐쇄 응급</li><li>호흡곤란 — 폐렴·세기관지염(RSV)·천식 악화 감별(폐렴 앱 연계)</li><li>수막염·뇌염 의심</li><li>패혈증/수막구균혈증</li><li>가와사키병 — 관상동맥류 위험, IVIG 골든타임(발병 10일 이내)</li><li>URI 국소 합병증(유양돌기염·안와 연조직염·전두골 골수염)</li><li>탈수 — 수분·평가</li><li>백일해 의심 — PCR·격리·macrolide·접촉자 예방</li><li>NICE amber(중간위험)·발열 5일↑ → 안전망·재평가</li></ul></section><section id="reimb-cold"><h3>처방률 평가·삭감·KCD</h3><ul><li>상병에 부합하는 약물만 급여. 급여기준 벗어난 병용은 조정.</li><li>대증약 대부분 급여. 성분중복·과다품목·투여기간 이탈 시 조정.</li><li>J00 급성 비인두염(감기)</li><li>J01 급성 부비동염</li><li>J02 급성 인두염</li><li>J03 급성 편도염</li><li>J04 급성 후두염·기관염</li><li>J05 급성 폐쇄성 후두염(크룹)·후두개염</li><li>J06 다발성·상세불명 급성 상기도감염</li><li>J20 급성 기관지염</li><li>H66 화농성·상세불명 중이염</li><li>B27 전염단핵구증(감별)</li><li>A37 백일해(감별)</li></ul></section></div></noscript>

      else antibiotic = { decision: "not_indicated", note: "바이러스성(7일 이내·악화 없음) → 대증·관찰", options: [] };
    } else if (type === "otitis_media") {

      else dec = (sev === "severe") ? "indicated" : "watchful";
      antibiotic = { decision: dec, note: dec === "indicated" ? "연령·중증도 → 항생제(고용량 amoxicillin)" : "관찰옵션(추적 보장 + 악화 시 즉시 항생제, 48-72h)",
        options: dec === "indicated" ? [{ label: "1차", drugs: r.first, dose: doseText(r.dose), duration: r.duration }, { label: "2차/실패", drugs: r.second, dose: null }] : [], rule: r.id };

        options: [{ label: "스테로이드", drugs: r.first, dose: doseText(r.dose) }, { label: "중증 추가", drugs: r.severe_add }] };
    } else {
      antibiotic = { decision: "not_indicated", note: "바이러스성 → 항생제 불필요, 대증치료(처방률·삭감 유리)", options: [], grade: "강함" };

      });

      });

    (a.options || []).forEach(function (o) { ab += fmtOpt(o); });
    html += card("clin", "💊", "항생제 적응 판단", a.decision === "indicated" ? "처방" : a.decision === "not_indicated" ? "불필요" : "판단", ab);

    (r.eval || []).forEach(function (e) { eb += '<div class="dc-row dc-reimb"><span class="dc-k">평가</span><span class="dc-v"><b>' + esc(e.indicator) + "</b> — " + esc(e.impact) + "</span></div>"; });
    (r.reimb || []).forEach(function (n) { eb += '<div class="dc-row dc-reimb"><span class="dc-k">' + esc(n.risk || "-") + '</span><span class="dc-v">' + esc(n.basis) + (n.cut ? '<br><span style="color:var(--warn)">' + esc((n.cut || []).join(" / ")) + "</span>" : "") + "</span></div>"; });

  /* 도서관 */
  var CAT_META = { "유형": ["🤧", "감기 유형"], "대증약": ["🧴", "대증약 계열"], "위험": ["🚨", "소아 위험징후·의뢰"], "급여": ["💰", "처방률 평가·삭감"] };

  function referList() {

    var h = '<div class="note" style="padding:0 0 10px">감기처럼 보이지만 놓치면 위험한 소아 상황. 아래 <b>위험 사인</b>이 하나라도 보이면 감기 대증치료를 멈추고 의뢰한다. 등급·계통별로 정리.</div>';
    ["emergency", "urgent", "reeval"].forEach(function (u) {
      var items = Object.values(REFER).filter(function (x) { return x.urgency === u; });
      if (!items.length) return;
      h += '<div class="subttl" style="color:' + URG[u][1] + '">' + esc(URG[u][0]) + "</div>";
      items.forEach(function (x) {
        h += '<div class="blk"><div class="bl">' + esc((x.category ? "[" + x.category + "] " : "") + x.reason) + "</div>";
        if (x.signs) h += '<div style="margin-top:2px"><span style="font-size:10.5px;color:var(--ink-faint)">위험 사인:</span>' + fmtKeypoints(x.signs) + "</div>";
        if (x.detail) h += '<div class="bd" style="color:var(--ink-faint);font-size:11px">→ ' + esc(x.detail) + "</div>";
        if (x.donot) h += '<div class="bd" style="color:var(--block);font-size:11.5px;font-weight:600">⛔ 하지 말 것: ' + esc(x.donot) + "</div>";
        h += "</div>";
      });
    });
    return h;
  }
  function buildLib() {
    var items = [];
    Object.values(TYPES).forEach(function (t) { items.push({ cat: "유형", title: t.emoji + " " + t.ko, kw: t.ko + " " + (t.def || ""), html: fmtType(t) }); });
    items.push({ cat: "위험", title: "🚨 소아 위험징후·의뢰 목록", kw: "소아 위험 의뢰 후두개염 수막염 가와사키", html: referList() });
    Object.values(NOTICES).forEach(function (n) { items.push({ cat: "급여", title: "💰 " + n.id.replace("notice:hira-", ""), kw: n.id + n.basis, html: '<div class="drugclass-box"><div class="dc-row dc-reimb"><span class="dc-k">' + esc(n.risk || "") + '</span><span class="dc-v">' + esc(n.basis) + "</span></div><div class=\"dc-row\"><span class=\"dc-k\" style=\"color:var(--warn)\">삭감</span><span class=\"dc-v\">" + esc((n.cut || []).join(" / ")) + "</span></div></div>" }); });
    items.push({ cat: "급여", title: "💰 항생제 처방률 평가(가감지급 성격)", kw: "처방률 평가 등급 가감지급", html: '<div class="note" style="padding:0">급성상기도감염 항생제 처방률 = 외래 내원일 대비 항생제 처방 비율. 2023년 41.4%. 등급 1(≤20%)~5(>59%). 등급·공개 + 고처방 실사로 자율개선 유도. 바이러스 상병 항생제·주사제 처방은 등급 악화.</div>' });
    W._LIB = items; W._DRUGTABLE = drugTable(); renderLib("");
  }
  function renderLib(q) {
    q = (q || "").toLowerCase(); var host = el("libGrid"); host.innerHTML = "";
    if (q) { var m = (W._LIB || []).filter(function (it) { return (it.title + it.kw).toLowerCase().indexOf(q) >= 0; }); if (!m.length) { host.innerHTML = '<div class="note">검색 결과 없음</div>'; return; } m.forEach(function (it) { var d = document.createElement("details"); d.className = "libItem"; d.open = true; d.innerHTML = '<summary><span class="cat">' + esc((CAT_META[it.cat] || [])[1] || it.cat) + "</span>" + esc(it.title) + '</summary><div class="body">' + it.html + "</div>"; host.appendChild(d); }); return; }
    CAT_ORDER.forEach(function (cat) {
      var meta = CAT_META[cat], items = (W._LIB || []).filter(function (it) { return it.cat === cat; });
      var count = cat === "대증약" ? Object.keys(DRUGS).length : items.length; if (cat !== "대증약" && !items.length) return;
      var b = document.createElement("button"); b.className = "librow"; b.innerHTML = meta[0] + " " + esc(meta[1]) + '<span class="lc">' + count + "개</span>";
      b.addEventListener("click", function () { if (cat === "대증약") openSheet(meta[0] + " " + esc(meta[1]), W._DRUGTABLE); else { var op = items.length <= 1 ? " open" : ""; openSheet(meta[0] + " " + esc(meta[1]), items.map(function (it) { return '<details class="libItem"' + op + '><summary>' + esc(it.title) + '</summary><div class="body">' + it.html + "</div></details>"; }).join("")); } });
      host.appendChild(b);
    });
  }
  el("libSearch").addEventListener("input", function (e) { renderLib(e.target.value); });

  /* 시뮬레이션 */
  var PRESETS = [
    { label: "성인 단순 감기", d: "콧물·기침 대증", p: { type: "cold", age: { years: 30 }, symptoms: { rhinorrhea: true, cough: true } } },
    { label: "GAS 인두염(McIsaac 4)", d: "RADT→양성 시 amoxicillin", p: { type: "pharyngitis", age: { years: 20 }, pharyngitis: { fever38: true, no_cough: true, tender_nodes: true, tonsillar_exudate: true, radt: "positive" } } },
    { label: "세균성 부비동염", d: "10일+이중악화 → amox/clav", p: { type: "rhinosinusitis", age: { years: 35 }, sinusitis: { duration_days: 12, double_worsening: true } } },
    { label: "소아 3세 중이염 경증", d: "관찰대기", p: { type: "otitis_media", age: { years: 3 }, otitis: { certainty: "confirmed", severity: "mild" } } },
    { label: "소아 8세 기침(코데인 제외)", d: "코데인 자동 제외", p: { type: "cold", age: { years: 8 }, symptoms: { cough: true } } },
    { label: "★후두개염 red flag", d: "응급 의뢰·인두검사 금지", p: { type: "pharyngitis", age: { years: 4 }, redflags: { drooling: true, tripod: true } } },
    { label: "★신생아 발열", d: "즉시 응급", p: { type: "uri_unspec", age: { days: 20 }, symptoms: { fever: true }, redflags: { fever: true } } }
  ];
  function buildSim() {
    var host = el("simBtns"); host.innerHTML = "";
    PRESETS.forEach(function (ps) { var b = document.createElement("button"); b.className = "simbtn"; b.innerHTML = "<div>" + esc(ps.label) + '</div><div class="d">' + esc(ps.d) + "</div>"; b.addEventListener("click", function () { var saved = P; P = JSON.parse(JSON.stringify(Object.assign({ type: null, age: {}, symptoms: {}, pharyngitis: {}, sinusitis: {}, otitis: {}, redflags: {}, comorbid: [], allergy: {} }, ps.p))); renderResultTo("simStream"); P = saved; openSheet("🎬 " + esc(ps.label), el("simStream").innerHTML); el("simStream").innerHTML = ""; }); host.appendChild(b); });
  }
  function renderResultTo(hostId) { var stream = el("stream"), keep = stream.innerHTML, ke = el("empty").style.display; render(); el(hostId).innerHTML = el("stream").innerHTML; stream.innerHTML = keep; el("empty").style.display = ke; }

  function buildSrc() { el("srcbanner").innerHTML = Object.values(GL).map(function (g) { return g.url ? '<a href="' + esc(g.url) + '" target="_blank" rel="noopener">📘 ' + esc(g.title) + (g.year ? " (" + g.year + ")" : "") + "</a>" : ""; }).filter(Boolean).join("<br>"); }

  buildFlow(); buildLib(); buildSim(); buildSrc();
})();

</script>
<!--BACK_TRAP_V4-->
<script>
/* 공용 뒤로가기 트랩 v4 (build.js 자동 주입) — 뒤로가기 시 열린 팝업을 닫거나, 없으면 "‹ 도서관/돌아가기/목록으로" 뷰-백 실행.
   둘 다 없으면 정상 이탈. 앱 내부 함수명을 몰라도 DOM 레벨로 동작. */
(function(){
  "use strict";
  if(window.__backTrapInstalled) return; window.__backTrapInstalled=true;
  var armed=false, consuming=false, baseline=null, backTrapOK=true, lastSched=-1;
  var SHOW_CLASSES=['on','open','active','show','visible','is-open','opened','shown','in'];
  function inView(el){
    var r=el.getBoundingClientRect();
    var iw=Math.min(r.right,innerWidth)-Math.max(r.left,0);
    var ih=Math.min(r.bottom,innerHeight)-Math.max(r.top,0);
    if(iw<=0||ih<=0) return false;
    return iw>=innerWidth*0.5 && (iw*ih)>=innerWidth*innerHeight*0.22;
  }
  function znum(s){ var z=parseInt(s.zIndex,10); return isNaN(z)?0:z; }
  function candidates(){
    var out=[], body=document.body; if(!body) return out;
    var all=body.getElementsByTagName('*');
    for(var i=0;i<all.length;i++){
      var el=all[i];
      if(el.id==='portal-hdr') continue;
      var s=getComputedStyle(el);
      if(s.position!=='fixed' && s.position!=='absolute') continue;
      if(s.display==='none'||s.visibility==='hidden'||parseFloat(s.opacity||'1')<0.05) continue;
      if(znum(s) < 10) continue;
      if(!inView(el)) continue;
      out.push(el);
    }
    return out;
  }
  function overlays(){ if(!baseline) return []; return candidates().filter(function(el){ return !baseline.has(el); }); }
  function isVisible(el){
    var s=getComputedStyle(el); if(s.display==='none'||s.visibility==='hidden'||parseFloat(s.opacity||'1')<0.05) return false;
    var r=el.getBoundingClientRect(); return r.width>4 && r.height>4 && r.bottom>0 && r.top<innerHeight;
  }
  var BACK_ARROW=/[\u2039\u2190\u25C0\u27E8\u276E<]/;
  function looksBack(t){
    if(!t) return false; t=t.replace(/\s+/g,' ').trim(); if(t.length>16) return false;
    if(/\uB3CC\uC544\uAC00\uAE30/.test(t)) return true;            // 돌아가기
    if(/\uBAA9\uB85D\uC73C\uB85C/.test(t)) return true;            // 목록으로
    if(/\uB3C4\uC11C\uAD00/.test(t) && BACK_ARROW.test(t)) return true;  // 도서관 + 화살표
    if(BACK_ARROW.test(t) && /\uBAA9\uB85D|\uB9AC\uC2A4\uD2B8|\uCC98\uC74C|home/i.test(t)) return true;
    return false;
  }
  function backControl(){
    var nodes=document.body.querySelectorAll('[onclick],a,button,[role=button]');
    for(var i=0;i<nodes.length;i++){
      var el=nodes[i];
      if(el.id==='portal-hdr'||el.closest('#portal-hdr')) continue;
      if(!isVisible(el)) continue;
      if(looksBack(el.textContent||'')) return el.closest('[onclick],a,button,[role=button]')||el;
    }
    return null;
  }
  function closeTarget(){
    if(overlays().length>0) return {type:'overlay'};
    if(backTrapOK){ var b=backControl(); if(b) return {type:'back', el:b}; }
    return null;
  }
  function appClosers(){
    var bad={close:1,closed:1,stop:1,print:1,open:1,opener:1,focus:1,blur:1,alert:1,confirm:1,prompt:1};
    var fns=[];
    for(var k in window){
      try{ if(/^(close|hide|dismiss)/i.test(k) && !bad[k] && typeof window[k]==='function' && window[k].length===0 && (''+window[k]).indexOf('[native code]')<0) fns.push(window[k]); }catch(e){}
    }
    try{ if(typeof window.close==='function' && (''+window.close).indexOf('[native code]')<0) fns.push(window.close); }catch(e){}
    return fns;
  }
  function closeOverlays(){
    appClosers().forEach(function(fn){ try{fn.call(window);}catch(e){} });
    overlays().forEach(function(el){ SHOW_CLASSES.forEach(function(c){ el.classList.remove(c); }); });
    try{ if(!overlays().length) document.body.style.overflow=''; }catch(e){}
  }
  function refreshOnce(){
    var has=!!closeTarget();
    if(has && !armed){ armed=true; try{history.pushState({backTrap:1},'');}catch(e){} }
    else if(!has && armed && !consuming){ consuming=true; try{history.back();}catch(e){} }
  }
  function schedule(){
    var t=(window.performance&&performance.now)?performance.now():+new Date();
    if(lastSched>=0 && t-lastSched<80) return; lastSched=t;
    [0,100,250,450,700].forEach(function(d){ setTimeout(refreshOnce,d); });
  }
  window.addEventListener('popstate', function(){
    if(consuming){ consuming=false; armed=false; return; }
    var tgt=closeTarget();
    if(tgt){
      armed=false;
      if(tgt.type==='overlay') closeOverlays();
      else if(tgt.el){ try{tgt.el.click();}catch(e){} }
      schedule();
    } else { armed=false; }
  });
  function init(){
    baseline=new WeakSet();
    candidates().forEach(function(el){ baseline.add(el); });
    backTrapOK = (backControl()===null);
    var mo=new MutationObserver(schedule);
    mo.observe(document.body,{subtree:true,attributes:true,attributeFilter:['class','style','hidden'],childList:true});
    document.addEventListener('click',function(){ schedule(); },true);
    window.addEventListener('resize',schedule);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ setTimeout(init,80); });
  else setTimeout(init,80);
})();
</script>
